name: Build Blender iOS - Xcode 26 Fast

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-xcode26-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Fast Incremental
    runs-on: macos-15
    timeout-minutes: 180

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

      BLENDER_SHA: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6

      # Keep this unchanged while iterating on small source/build fixes.
      BUILD_CACHE_VERSION: fast-v1

      EXPECTED_IOS_LIB_SHA: 393201c7c8525941553f6a96e19b909d6b3bfc4f
      EXPECTED_MAC_LIB_SHA: a3e20428fb0ab2231903608cdca90301e130dbfc

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT SOURCE
      # ============================================================

      - name: Checkout Blender iOS
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE
      # ============================================================

      - name: Verify source revision
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "========================================"
          echo "SOURCE"
          echo "========================================"

          echo "Expected: $BLENDER_SHA"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BLENDER_SHA"

          git log -1 --oneline

      # ============================================================
      # 3. NORMALIZE SOURCE TIMESTAMPS
      #
      # This improves our chances of reusing object files restored
      # from the previous Xcode build cache.
      # ============================================================

      - name: Normalize source timestamps
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import subprocess

          stamp = int(
              subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%ct",
                      "HEAD",
                  ],
                  text=True,
              ).strip()
          )

          tracked = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
              ]
          )

          count = 0

          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue

              path = os.fsdecode(raw_path)

              if not os.path.lexists(path):
                  continue

              try:
                  os.utime(
                      path,
                      (stamp, stamp),
                      follow_symlinks=False,
                  )
                  count += 1
              except (OSError, NotImplementedError):
                  pass

          print(
              "Normalized",
              count,
              "tracked paths"
          )
          PY

      # ============================================================
      # 4. SELECT XCODE 26.3
      # ============================================================

      - name: Select Xcode 26.3
        run: |
          set -euxo pipefail

          XCODE="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.3 not installed."
            echo
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select \
            -s "$XCODE/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "Developer directory:"
          xcode-select -p

      # ============================================================
      # 5. VERIFY IOS 26 SDK
      # ============================================================

      - name: Verify iOS SDK
        run: |
          set -euxo pipefail

          SDK_VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          SDK_PATH="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          echo "========================================"
          echo "IPHONEOS SDK"
          echo "========================================"

          echo "Version: $SDK_VERSION"
          echo "Path:    $SDK_PATH"

          case "$SDK_VERSION" in
            26.*)
              ;;
            *)
              echo "ERROR: Expected iOS 26.x SDK"
              exit 1
              ;;
          esac

          echo "IOS_SDK_VERSION=$SDK_VERSION" \
            >> "$GITHUB_ENV"

          echo "IOS_SDK_ROOT=$SDK_PATH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 6. QUICK MODERN UIKIT API TEST
      #
      # Fail immediately if the selected SDK cannot compile the API
      # used by Salmazov's iOS source.
      # ============================================================

      - name: Test UIWindowScene API
        run: |
          set -euxo pipefail

          cat > /tmp/uikit_probe.mm <<'EOF'
          #import <UIKit/UIKit.h>

          static CGRect blender_scene_bounds(UIWindowScene *scene)
          {
            return scene.effectiveGeometry.coordinateSpace.bounds;
          }
          EOF

          SDKROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          xcrun \
            --sdk iphoneos \
            clang++ \
            -x objective-c++ \
            -fsyntax-only \
            -isysroot "$SDKROOT" \
            /tmp/uikit_probe.mm

          echo
          echo "Modern UIWindowScene API probe passed."

      # ============================================================
      # 7. CHECK AVAILABLE DISK
      # ============================================================

      - name: Check disk space
        run: |
          set -euxo pipefail

          df -h "$GITHUB_WORKSPACE"

          FREE_KB="$(
            df -Pk "$GITHUB_WORKSPACE" \
              | awk 'NR == 2 {print $4}'
          )"

          echo "Available KB: $FREE_KB"

          if [ "$FREE_KB" -lt 30000000 ]; then

            echo
            echo "Low disk space; cleaning runner..."

            sudo rm -rf \
              /usr/local/lib/android \
              || true

            sudo rm -rf \
              /usr/share/dotnet \
              || true

            sudo rm -rf \
              "$HOME/Library/Android" \
              || true

            sudo rm -rf \
              /opt/ghc \
              || true

            sudo rm -rf \
              /usr/local/.ghcup \
              || true

            sudo xcrun simctl delete all \
              2>/dev/null \
              || true

          else

            echo
            echo "Enough free space; skipping large cleanup."

          fi

          df -h "$GITHUB_WORKSPACE"

      # ============================================================
      # 8. ENSURE REQUIRED TOOLS
      # ============================================================

      - name: Ensure build tools
        run: |
          set -euxo pipefail

          NEED=""

          if ! command -v cmake >/dev/null 2>&1; then
            NEED="$NEED cmake"
          fi

          if ! command -v git-lfs >/dev/null 2>&1; then
            NEED="$NEED git-lfs"
          fi

          if [ -n "$NEED" ]; then
            brew install $NEED
          else
            echo "CMake and Git LFS already available."
          fi

          git lfs install

          echo
          echo "===== CMake ====="
          cmake --version

          echo
          echo "===== Git LFS ====="
          git lfs version

      # ============================================================
      # 9. CONFIGURE OFFICIAL BLENDER LFS REMOTE
      # ============================================================

      - name: Configure Blender LFS remote
        run: |
          set -euxo pipefail

          git remote add \
            blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null \
            || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config \
            lfs.remote.searchall \
            true

          echo "===== Remotes ====="
          git remote -v

      # ============================================================
      # 10. RESTORE SOURCE LFS ASSET CACHE
      #
      # Cache files that previously caused the app-icon failure,
      # plus Blender release/datafiles.
      # ============================================================

      - name: Restore source LFS assets
        id: source-lfs-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            release/datafiles
            release/ios/Blender.app/Assets.xcassets
          key: blender-source-lfs-${{ env.BLENDER_SHA }}-v2

      # ============================================================
      # 11. MATERIALIZE ALL REQUIRED SOURCE LFS ASSETS
      #
      # This is the important new fix.
      #
      # We first use the Salmazov origin for the iOS-specific files.
      # Blender datafiles are fetched from Blender's official server.
      #
      # If anything remains an LFS pointer we try both sources before
      # allowing the expensive compile to start.
      # ============================================================

      - name: Fetch required source LFS assets
        run: |
          set -euxo pipefail

          IOS_DIR="release/ios/Blender.app/Assets.xcassets"
          DATA_DIR="release/datafiles"

          echo "========================================"
          echo "LFS FILES IN IOS ASSET CATALOG"
          echo "========================================"

          git lfs ls-files \
            "$IOS_DIR" \
            || true

          echo
          echo "========================================"
          echo "LFS FILES IN DATAFILES"
          echo "========================================"

          git lfs ls-files \
            "$DATA_DIR" \
            || true

          # --------------------------------------------------------
          # iOS-specific assets.
          #
          # Start with the Salmazov repository since these may be
          # specific to the iOS fork.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "FETCH IOS ASSETS FROM SALMAZOV ORIGIN"
          echo "========================================"

          git lfs pull \
            origin \
            --include="release/ios/Blender.app/Assets.xcassets/**" \
            || true

          # --------------------------------------------------------
          # Blender runtime/release data.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "FETCH DATAFILES FROM OFFICIAL BLENDER"
          echo "========================================"

          git lfs pull \
            blender-lfs \
            --include="release/datafiles/**" \
            || true

          # --------------------------------------------------------
          # Scan for remaining pointers.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "FIRST LFS POINTER SCAN"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  "release/datafiles"
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          for root in roots:
              if not root.exists():
                  print(
                      "MISSING DIRECTORY:",
                      root,
                  )
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      head = path.read_bytes()[:200]
                  except OSError:
                      continue

                  if head.startswith(magic):
                      print(
                          "LFS POINTER:",
                          path,
                      )
          PY

          # --------------------------------------------------------
          # Fallback:
          # Try Blender official server for any iOS assets that the
          # GitHub fork did not materialize.
          # --------------------------------------------------------

          if python3 <<'PY'
          from pathlib import Path
          import sys

          root = Path(
              "release/ios/Blender.app/"
              "Assets.xcassets"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          if root.exists():
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          for path in bad:
              print(
                  "STILL POINTER:",
                  path,
              )

          sys.exit(
              0 if not bad else 1
          )
          PY
          then

            echo
            echo "iOS asset catalog already materialized."

          else

            echo
            echo "Some iOS assets remain pointers."
            echo "Trying official Blender LFS server..."

            git lfs pull \
              blender-lfs \
              --include="release/ios/Blender.app/Assets.xcassets/**" \
              || true

          fi

          # --------------------------------------------------------
          # Also try origin as fallback for any datafiles which might
          # exist only on the branch/fork.
          # --------------------------------------------------------

          git lfs pull \
            origin \
            --include="release/datafiles/**" \
            || true

          # --------------------------------------------------------
          # FINAL HARD CHECK.
          #
          # Do NOT launch a long Blender build if even one resource
          # is still merely an LFS pointer.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "FINAL LFS POINTER CHECK"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  "release/datafiles"
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for root in roots:
              if not root.exists():
                  raise SystemExit(
                      f"ERROR: required directory "
                      f"does not exist: {root}"
                  )

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      head = path.read_bytes()[:200]
                  except OSError:
                      continue

                  if head.startswith(magic):
                      bad.append(path)

          if bad:
              print()
              print(
                  "ERROR: These required files "
                  "are still Git LFS pointers:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print()
          print(
              "No Git LFS pointers remain "
              "in required release resources."
          )
          PY

          echo
          echo "========================================"
          echo "APPICON CONTENTS"
          echo "========================================"

          find \
            "$IOS_DIR" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

          echo
          echo "========================================"
          echo "FILE TYPES"
          echo "========================================"

          find \
            "$IOS_DIR" \
            -type f \
            -exec file {} \; \
            | head -150

      # ============================================================
      # 12. VERIFY startup.blend SPECIFICALLY
      # ============================================================

      - name: Verify startup.blend
        run: |
          set -euxo pipefail

          STARTUP="release/datafiles/startup.blend"

          test -f "$STARTUP"

          SIZE="$(
            stat -f '%z' "$STARTUP"
          )"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is not materialized."
            exit 1
          fi

          file "$STARTUP"

      # ============================================================
      # 13. SAVE SOURCE LFS CACHE IMMEDIATELY
      #
      # Save now, before Blender compilation, so a later compiler or
      # linker failure cannot make us download these again.
      # ============================================================

      - name: Save source LFS assets
        if: steps.source-lfs-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            release/datafiles
            release/ios/Blender.app/Assets.xcassets
          key: blender-source-lfs-${{ env.BLENDER_SHA }}-v2

      # ============================================================
      # 14. DETERMINE PREBUILT LIBRARY REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -euxo pipefail

          IOS_SHA="$(
            git rev-parse \
              HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse \
              HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "mac_sha=$MAC_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "ios_url=$IOS_URL" \
            >> "$GITHUB_OUTPUT"

          echo "mac_url=$MAC_URL" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "iOS:"
          echo "$IOS_URL"
          echo "$IOS_SHA"

          echo
          echo "macOS:"
          echo "$MAC_URL"
          echo "$MAC_SHA"

      # ============================================================
      # 15. VERIFY EXACT LIBRARY PINS
      # ============================================================

      - name: Verify library revisions
        run: |
          set -euxo pipefail

          IOS="${{ steps.libs.outputs.ios_sha }}"
          MAC="${{ steps.libs.outputs.mac_sha }}"

          echo "iOS expected: $EXPECTED_IOS_LIB_SHA"
          echo "iOS actual:   $IOS"

          echo
          echo "macOS expected: $EXPECTED_MAC_LIB_SHA"
          echo "macOS actual:   $MAC"

          test \
            "$IOS" \
            = "$EXPECTED_IOS_LIB_SHA"

          test \
            "$MAC" \
            = "$EXPECTED_MAC_LIB_SHA"

      # ============================================================
      # 16. RESTORE IOS PREBUILT LIBRARIES
      # ============================================================

      - name: Restore iOS libraries
        id: ios-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v2

      # ============================================================
      # 17. FETCH IOS LIBRARIES ON CACHE MISS
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            lfs install \
            --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 18. SAVE IOS LIB CACHE IMMEDIATELY
      # ============================================================

      - name: Save iOS libraries
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v2

      # ============================================================
      # 19. RESTORE MACOS HOST LIBRARIES
      # ============================================================

      - name: Restore macOS libraries
        id: mac-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v2

      # ============================================================
      # 20. FETCH MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            lfs install \
            --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 21. SAVE MACOS LIB CACHE IMMEDIATELY
      # ============================================================

      - name: Save macOS libraries
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v2

      # ============================================================
      # 22. VERIFY PREBUILT LIBRARIES
      # ============================================================

      - name: Verify libraries
        run: |
          set -euxo pipefail

          IOS_ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          MAC_ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$IOS_ACTUAL" \
            = "$EXPECTED_IOS_LIB_SHA"

          test \
            "$MAC_ACTUAL" \
            = "$EXPECTED_MAC_LIB_SHA"

          echo "===== iOS Python ====="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo
          echo "===== Host Python ====="

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print \
              -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: host Python missing."
            exit 1
          fi

          echo "$HOST_PYTHON"

      # ============================================================
      # 23. APPLY KNOWN FMT COMPATIBILITY FIXES
      #
      # NO UIKit patch under Xcode 26.
      # NO replacement fmt headers.
      # ============================================================

      - name: Apply fmt compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          # ========================================================
          # A. node_geo_join_bundle.cc
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "overridden_keys joins:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: expected exactly 1 "
                  "overridden_keys join; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file1.write_text(text)


          # ========================================================
          # B. geometry_nodes_bundle.cc
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "path joins:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: expected exactly 2 "
                  "path joins; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
          )

          file2.write_text(text)


          # ========================================================
          # VERIFY
          # ========================================================

          if (
              'fmt::join(overridden_keys, ", ")'
              in file1.read_text()
          ):
              raise SystemExit(
                  "ERROR: overridden_keys join remains"
              )

          if (
              'fmt::join(path, "/")'
              in file2.read_text()
          ):
              raise SystemExit(
                  "ERROR: path join remains"
              )

          print()
          print(
              "fmt compatibility patches applied."
          )
          PY

          echo
          echo "========================================"
          echo "COMPATIBILITY PATCH"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            > compatibility.patch

          cat \
            compatibility.patch

      # ============================================================
      # 24. VERIFY MODERN UIKIT SOURCE IS UNMODIFIED
      # ============================================================

      - name: Verify modern UIKit source
        run: |
          set -euxo pipefail

          grep -RIn \
            '\.effectiveGeometry\.coordinateSpace' \
            intern/ghost/intern \
            --include='GHOST_*IOS.mm' \
            | tee modern-uikit-calls.txt

          test -s \
            modern-uikit-calls.txt

          echo
          echo "Modern UIKit source retained."

      # ============================================================
      # 25. RESTORE PARTIAL XCODE BUILD
      #
      # Every run gets a unique save key, but restore-keys selects
      # the newest compatible previous partial build.
      # ============================================================

      - name: Restore incremental Xcode build
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-cyclesoff-

      # ============================================================
      # 26. SHOW RESTORED CACHE
      # ============================================================

      - name: Inspect incremental build cache
        run: |
          set -euxo pipefail

          echo "Cache matched key:"
          echo "${{ steps.build-cache.outputs.cache-matched-key }}"

          echo

          if [ -d build_ios ]; then

            echo "Restored build_ios:"
            du -sh \
              build_ios \
              || true

          else

            echo "No previous build_ios cache restored."

          fi

          echo

          if [ -d "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" ]; then

            echo "Restored host tools:"
            du -sh \
              "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
              || true

          fi

      # ============================================================
      # 27. CONFIGURE
      #
      # IMPORTANT:
      # There is intentionally NO:
      #
      #   rm -rf build_ios
      #
      # CMake updates the restored build tree in place.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "========================================"
          echo "CONFIGURE"
          echo "========================================"

          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS:"
          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          echo
          echo "SDK:"
          echo "$IOS_SDK_ROOT"

          echo
          echo "LIBDIR:"
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DWITH_GPU_BACKEND_TESTS=OFF \
            -DWITH_GPU_COMPOSITOR_TESTS=OFF \
            -DWITH_GPU_DRAW_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 28. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify configuration
        run: |
          set -euxo pipefail

          echo "===== Relevant CMake settings ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_GTESTS:|WITH_TESTS_BATCHED:|WITH_METAL_BACKEND:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep \
              '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep \
              '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"
          echo "WITH_PYTHON=$PYTHON"

          test "$CYCLES" = "OFF"
          test "$PYTHON" = "ON"

      # ============================================================
      # 29. FINAL PRE-BUILD RESOURCE CHECK
      #
      # This is specifically to prevent another 20-30 minute compile
      # followed by an AppIcon LFS failure.
      # ============================================================

      - name: Final resource sanity check
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  "release/datafiles"
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          pointers = []

          for root in roots:
              if not root.exists():
                  raise SystemExit(
                      f"Missing required path: {root}"
                  )

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          pointers.append(path)
                  except OSError:
                      pass

          if pointers:
              print(
                  "ERROR: LFS pointers remain:"
              )

              for path in pointers:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "Pre-build resource check passed."
          )
          PY

      # ============================================================
      # 30. BUILD
      #
      # Keep jobs=3: that has already been stable.
      #
      # Disable IDE indexing/debug-symbol generation in CI.
      # ============================================================

      - name: Build Blender
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "SDK:"
          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo
            echo "===== Compiler / linker / asset errors ====="

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:|actool|CompileAssetCatalog|AppIcon|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt \
              || true

            echo
            echo "===== iOS / UIKit ====="

            grep -n -C 20 \
              -E \
              'GHOST_.*IOS|UIWindowScene|effectiveGeometry|coordinateSpace|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            cat \
              ios-errors.txt \
              || true

            echo
            echo "===== fmt ====="

            grep -n -C 15 \
              -E \
              'fmt::|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            cat \
              fmt-errors.txt \
              || true

            echo
            echo "===== Asset catalog ====="

            grep -n -C 30 \
              -E \
              'actool|Assets.xcassets|AppIcon|CompileAssetCatalog|asset catalog|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > asset-errors.txt \
              || true

            cat \
              asset-errors.txt \
              || true

            echo
            echo "===== Linker ====="

            grep -n -C 30 \
              -E \
              'Undefined symbols|duplicate symbol|library not found|framework not found|ld: |clang: error: linker' \
              xcodebuild.log \
              > linker-errors.txt \
              || true

            cat \
              linker-errors.txt \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 150 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt \
              || true

            echo
            echo "===== Last 600 lines ====="

            tail -600 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 \
            xcodebuild.log

      # ============================================================
      # 31. SAVE PARTIAL OR COMPLETE BUILD
      #
      # Runs even after failure.
      #
      # This is what makes the next source-fix iteration much faster.
      # ============================================================

      - name: Show incremental build size
        if: always()
        run: |
          echo "===== build_ios ====="

          du -sh \
            "$GITHUB_WORKSPACE/build_ios" \
            2>/dev/null \
            || true

          echo
          echo "===== host tools ====="

          du -sh \
            "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
            2>/dev/null \
            || true

      - name: Save incremental Xcode build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}

      # ============================================================
      # 32. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              \( \
                -name 'Blender.app' \
                -o \
                -name 'blender.app' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Blender.app not found."

            echo
            echo "Generated .app bundles:"

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "Blender.app:"
          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 33. VERIFY APP
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -euxo pipefail

          test -f \
            "$APP/Info.plist"

          echo "===== Info.plist ====="

          plutil \
            -p \
            "$APP/Info.plist" \
            | head -120

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          elif [ -f "$APP/blender" ]
          then

            EXEC_NAME="blender"
            EXECUTABLE="$APP/blender"

          else

            echo "ERROR: Blender executable not found."

            find \
              "$APP" \
              -maxdepth 1 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Executable ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 34. CHECK APP FOR LEFTOVER LFS POINTERS
      # ============================================================

      - name: Verify packaged app resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          app = Path(
              os.environ["APP"]
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in app.rglob("*"):
              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:
              print(
                  "ERROR: LFS pointer files made it "
                  "into Blender.app:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "No LFS pointers found inside Blender.app."
          )
          PY

      # ============================================================
      # 35. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          (
            cd package

            zip \
              -qry \
              -y \
              ../Blender-5.2-iPad-Xcode26-Fast.ipa \
              Payload
          )

          test -f \
            Blender-5.2-iPad-Xcode26-Fast.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Xcode26-Fast.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Xcode26-Fast.ipa \
            | head -150

      # ============================================================
      # 36. WRITE BUILD INFO
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "Xcode:"
            xcodebuild -version \
              2>/dev/null \
              || true
            echo

            echo "iPhoneOS SDK:"
            xcrun \
              --sdk iphoneos \
              --show-sdk-version \
              2>/dev/null \
              || true
            echo

            echo "Build options:"
            echo "WITH_PYTHON=ON"
            echo "WITH_CYCLES=OFF"
            echo "WITH_GTESTS=OFF"
            echo "WITH_TESTS_BATCHED=OFF"
            echo

            echo "Compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path joins"
            echo

            echo "UIKit compatibility patches:"
            echo "NONE"
            echo

            echo "UIKit API:"
            echo "effectiveGeometry.coordinateSpace"
            echo

            echo "LFS handling:"
            echo "release/datafiles materialized"
            echo "iOS Assets.xcassets materialized"
            echo "pre-build pointer scan enabled"
            echo "post-build pointer scan enabled"
            echo

            echo "Speed features:"
            echo "source LFS cache"
            echo "iOS dependency cache"
            echo "macOS dependency cache"
            echo "partial Xcode build cache"
            echo "partial failed builds saved"
            echo "source timestamp normalization"
            echo "Xcode index store disabled"
            echo "debug symbols disabled"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 37. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Xcode26-Fast
          path: |
            Blender-5.2-iPad-Xcode26-Fast.ipa
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 38. ALWAYS UPLOAD DIAGNOSTIC LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-xcode26-fast-logs
          path: |
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            asset-errors.txt
            linker-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
