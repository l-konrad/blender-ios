name: Build Blender iOS - Xcode 26 Fast

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-xcode26-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Fast Incremental
    runs-on: macos-15
    timeout-minutes: 180

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

      BLENDER_SHA: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6

      EXPECTED_IOS_LIB_SHA: 393201c7c8525941553f6a96e19b909d6b3bfc4f
      EXPECTED_MAC_LIB_SHA: a3e20428fb0ab2231903608cdca90301e130dbfc

      IOS_DEPLOYMENT_TARGET: "26.2"

      # IMPORTANT:
      # Do NOT bump this for the current fixes.
      # Keeping fast-v3 lets us reuse the already compiled Xcode tree.
      BUILD_CACHE_VERSION: fast-v3

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT SOURCE
      # ============================================================

      - name: Checkout Blender iOS
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE
      # ============================================================

      - name: Verify source revision
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "========================================"
          echo "SOURCE"
          echo "========================================"
          echo
          echo "Expected: $BLENDER_SHA"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BLENDER_SHA"

          git log -1 --oneline

      # ============================================================
      # 3. NORMALIZE SOURCE TIMESTAMPS
      #
      # Helps restored Xcode object files remain reusable.
      # ============================================================

      - name: Normalize source timestamps
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import subprocess

          stamp = int(
              subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%ct",
                      "HEAD",
                  ],
                  text=True,
              ).strip()
          )

          tracked = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
              ]
          )

          count = 0

          for raw in tracked.split(b"\0"):
              if not raw:
                  continue

              path = os.fsdecode(raw)

              if not os.path.lexists(path):
                  continue

              try:
                  os.utime(
                      path,
                      (stamp, stamp),
                      follow_symlinks=False,
                  )
                  count += 1
              except (OSError, NotImplementedError):
                  pass

          print(
              "Normalized timestamps for",
              count,
              "tracked paths",
          )
          PY

      # ============================================================
      # 4. SELECT XCODE 26.3
      # ============================================================

      - name: Select Xcode 26.3
        run: |
          set -euxo pipefail

          XCODE="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE" ]; then

            echo "ERROR: Xcode 26.3 is unavailable."
            echo
            echo "Installed Xcode versions:"

            ls -d \
              /Applications/Xcode*.app \
              || true

            exit 1
          fi

          sudo xcode-select \
            -s "$XCODE/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "Developer directory:"
          xcode-select -p

      # ============================================================
      # 5. VERIFY IOS SDK
      # ============================================================

      - name: Verify iOS SDK
        run: |
          set -euxo pipefail

          SDK_VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          SDK_PATH="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          echo "========================================"
          echo "IPHONEOS SDK"
          echo "========================================"

          echo "Version: $SDK_VERSION"
          echo "Path:    $SDK_PATH"

          case "$SDK_VERSION" in

            26.*)
              ;;

            *)
              echo "ERROR: Expected iOS 26.x SDK."
              exit 1
              ;;

          esac

          echo "IOS_SDK_VERSION=$SDK_VERSION" \
            >> "$GITHUB_ENV"

          echo "IOS_SDK_ROOT=$SDK_PATH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 6. MODERN UIKIT API PROBE
      # ============================================================

      - name: Test modern UIWindowScene API
        run: |
          set -euxo pipefail

          cat > /tmp/uikit_probe.mm <<'EOF'
          #import <UIKit/UIKit.h>

          static CGRect blender_scene_bounds(UIWindowScene *scene)
          {
            return scene.effectiveGeometry.coordinateSpace.bounds;
          }
          EOF

          SDKROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          xcrun \
            --sdk iphoneos \
            clang++ \
            -x objective-c++ \
            -fsyntax-only \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min="$IOS_DEPLOYMENT_TARGET" \
            /tmp/uikit_probe.mm

          echo
          echo "Modern UIWindowScene API probe passed."

      # ============================================================
      # 7. CHECK DISK SPACE
      # ============================================================

      - name: Check disk space
        run: |
          set -euxo pipefail

          df -h \
            "$GITHUB_WORKSPACE"

          FREE_KB="$(
            df -Pk "$GITHUB_WORKSPACE" \
              | awk 'NR == 2 {print $4}'
          )"

          echo
          echo "Available KB: $FREE_KB"

          if [ "$FREE_KB" -lt 30000000 ]; then

            echo
            echo "Low disk space. Cleaning runner..."

            sudo rm -rf \
              /usr/local/lib/android \
              || true

            sudo rm -rf \
              /usr/share/dotnet \
              || true

            sudo rm -rf \
              "$HOME/Library/Android" \
              || true

            sudo rm -rf \
              /opt/ghc \
              || true

            sudo rm -rf \
              /usr/local/.ghcup \
              || true

            sudo xcrun simctl delete all \
              2>/dev/null \
              || true

          else

            echo
            echo "Enough disk space."

          fi

          df -h \
            "$GITHUB_WORKSPACE"

      # ============================================================
      # 8. ENSURE REQUIRED TOOLS
      # ============================================================

      - name: Ensure build tools
        run: |
          set -euxo pipefail

          NEED=""

          if ! command -v cmake >/dev/null 2>&1; then
            NEED="$NEED cmake"
          fi

          if ! command -v git-lfs >/dev/null 2>&1; then
            NEED="$NEED git-lfs"
          fi

          if [ -n "$NEED" ]; then

            brew install $NEED

          else

            echo "CMake and Git LFS already available."

          fi

          git lfs install

          echo
          echo "===== CMake ====="
          cmake --version

          echo
          echo "===== Git LFS ====="
          git lfs version

      # ============================================================
      # 9. OFFICIAL BLENDER LFS REMOTE
      # ============================================================

      - name: Configure Blender LFS remote
        run: |
          set -euxo pipefail

          git remote add \
            blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null \
            || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config \
            lfs.remote.searchall \
            true

          echo
          echo "===== Git remotes ====="

          git remote -v

      # ============================================================
      # 10. DETECT BUNDLED ASSET SOURCE LAYOUT
      #
      # New Blender:
      #
      #   assets/brushes
      #   assets/nodes
      #
      # Older layout:
      #
      #   release/datafiles/assets
      #
      # If the latter is a gitlink, we fetch blender-assets below.
      # ============================================================

      - name: Detect bundled asset layout
        id: asset-layout
        shell: bash
        run: |
          set -euxo pipefail

          MODE=""
          SOURCE=""
          SHA=""

          if [ -d assets ]; then

            MODE="root"
            SOURCE="assets"

            echo
            echo "Using top-level Blender assets directory."

          else

            TREE_LINE="$(
              git ls-tree \
                HEAD \
                release/datafiles/assets \
                || true
            )"

            TREE_MODE="$(
              printf '%s\n' "$TREE_LINE" \
                | awk '{print $1}'
            )"

            TREE_SHA="$(
              printf '%s\n' "$TREE_LINE" \
                | awk '{print $3}'
            )"

            if [ "$TREE_MODE" = "160000" ] && \
               [ -n "$TREE_SHA" ]
            then

              MODE="submodule"
              SOURCE="release/datafiles/assets"
              SHA="$TREE_SHA"

              echo
              echo "Using legacy blender-assets gitlink:"
              echo "$SHA"

            else

              echo
              echo "ERROR: could not determine bundled asset layout."

              echo
              echo "Root directory:"
              ls -la

              echo
              echo "release/datafiles:"
              ls -la \
                release/datafiles \
                || true

              exit 1

            fi

          fi

          echo "mode=$MODE" \
            >> "$GITHUB_OUTPUT"

          echo "source=$SOURCE" \
            >> "$GITHUB_OUTPUT"

          echo "sha=$SHA" \
            >> "$GITHUB_OUTPUT"

          echo "BUNDLED_ASSETS_SOURCE=$SOURCE" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "BUNDLED ASSET LAYOUT"
          echo "========================================"

          echo "Mode:   $MODE"
          echo "Source: $SOURCE"

          if [ -n "$SHA" ]; then
            echo "SHA:    $SHA"
          fi

      # ============================================================
      # 11. RESTORE SOURCE RESOURCE CACHE
      #
      # v5 adds the top-level assets/ tree.
      # ============================================================

      - name: Restore source resources
        id: source-assets-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            release/datafiles/startup.blend
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
            assets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v5

      # ============================================================
      # 12. RESTORE OLD BLENDER-ASSETS SUBMODULE CACHE IF NEEDED
      # ============================================================

      - name: Restore legacy Blender assets
        id: legacy-assets-cache
        if: steps.asset-layout.outputs.mode == 'submodule'
        uses: actions/cache/restore@v5
        with:
          path: release/datafiles/assets
          key: blender-assets-${{ steps.asset-layout.outputs.sha }}-v2

      # ============================================================
      # 13. FETCH LEGACY BLENDER-ASSETS IF THIS SOURCE USES IT
      # ============================================================

      - name: Fetch legacy Blender assets
        if: >-
          steps.asset-layout.outputs.mode == 'submodule' &&
          steps.legacy-assets-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        shell: bash
        run: |
          set -euxo pipefail

          PATH_ASSETS="release/datafiles/assets"
          SHA="${{ steps.asset-layout.outputs.sha }}"

          URL="https://projects.blender.org/blender/blender-assets.git"

          rm -rf \
            "$PATH_ASSETS"

          git clone \
            --filter=blob:none \
            --no-checkout \
            "$URL" \
            "$PATH_ASSETS"

          git -C "$PATH_ASSETS" \
            fetch \
            --depth=1 \
            origin \
            "$SHA"

          git -C "$PATH_ASSETS" \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C "$PATH_ASSETS" \
              rev-parse HEAD
          )"

          echo
          echo "Expected asset SHA:"
          echo "$SHA"

          echo
          echo "Actual asset SHA:"
          echo "$ACTUAL"

          test \
            "$ACTUAL" \
            = "$SHA"

          git -C "$PATH_ASSETS" \
            lfs install \
            --local

          git -C "$PATH_ASSETS" \
            lfs pull \
            2>&1 | tee blender-assets-lfs.log

          du -sh \
            "$PATH_ASSETS"

      # ============================================================
      # 14. VERIFY LEGACY BLENDER-ASSETS IF PRESENT
      # ============================================================

      - name: Verify legacy Blender assets
        if: steps.asset-layout.outputs.mode == 'submodule'
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="release/datafiles/assets"

          test -d \
            "$ROOT"

          ACTUAL="$(
            git -C "$ROOT" \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.asset-layout.outputs.sha }}"

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "release/datafiles/assets"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue

              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:
              print(
                  "ERROR: legacy blender-assets "
                  "still contains LFS pointers:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Legacy blender-assets repository "
              "is fully materialized."
          )
          PY

      # ============================================================
      # 15. MATERIALIZE MAIN-REPOSITORY LFS RESOURCES
      #
      # Handles:
      #
      #   release/datafiles
      #   scripts
      #   assets              <-- IMPORTANT NEW FIX
      #
      # The AppIcon is handled separately because that one LFS
      # object is unavailable.
      # ============================================================

      - name: Materialize packaged source resources
        shell: bash
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          # --------------------------------------------------------
          # Materialize one pointer directly from .git/lfs/objects.
          # --------------------------------------------------------

          materialize_pointer()
          {
            FILE="$1"

            if [ ! -f "$FILE" ]; then

              echo "ERROR: missing source file:"
              echo "  $FILE"

              return 1
            fi

            if ! head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              return 0
            fi

            echo
            echo "----------------------------------------"
            echo "Materializing:"
            echo "  $FILE"

            OID="$(
              sed -n \
                's/^oid sha256://p' \
                "$FILE"
            )"

            if [ -z "$OID" ]; then

              echo "ERROR: no LFS OID in pointer:"
              echo "  $FILE"

              return 1
            fi

            echo "OID:"
            echo "  $OID"

            GIT_DIR="$(
              git rev-parse \
                --git-dir
            )"

            OBJECT="$GIT_DIR/lfs/objects/${OID:0:2}/${OID:2:2}/$OID"

            if [ ! -f "$OBJECT" ]; then

              echo "Fetching from Blender LFS..."

              git lfs fetch \
                blender-lfs \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              echo "Trying source origin LFS..."

              git lfs fetch \
                origin \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              echo
              echo "ERROR: LFS object unavailable."
              echo "File:"
              echo "  $FILE"
              echo "OID:"
              echo "  $OID"

              return 1
            fi

            TEMP="${FILE}.materialized"

            cp \
              "$OBJECT" \
              "$TEMP"

            ACTUAL="$(
              shasum \
                -a 256 \
                "$TEMP" \
                | awk '{print $1}'
            )"

            if [ "$ACTUAL" != "$OID" ]; then

              echo "ERROR: SHA-256 mismatch."
              echo "Expected: $OID"
              echo "Actual:   $ACTUAL"

              rm -f \
                "$TEMP"

              return 1
            fi

            mv \
              "$TEMP" \
              "$FILE"

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              echo "ERROR: materialized file still looks like an LFS pointer."

              return 1
            fi

            echo "Materialized:"
            echo "  $FILE"
          }

          # --------------------------------------------------------
          # Broad prefetches first.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "PREFETCH release/datafiles"
          echo "========================================"

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/**" \
            HEAD \
            2>&1 | tee source-lfs.log \
            || true

          echo
          echo "========================================"
          echo "PREFETCH APP TEMPLATES"
          echo "========================================"

          git lfs fetch \
            blender-lfs \
            --include="scripts/startup/bl_app_templates_system/**" \
            HEAD \
            2>&1 | tee -a source-lfs.log \
            || true

          if [ "${{ steps.asset-layout.outputs.mode }}" = "root" ]; then

            echo
            echo "========================================"
            echo "PREFETCH TOP-LEVEL ASSETS"
            echo "========================================"

            git lfs fetch \
              blender-lfs \
              --include="assets/**" \
              HEAD \
              2>&1 | tee -a source-lfs.log \
              || true

          fi

          # --------------------------------------------------------
          # release/datafiles
          #
          # Exclude release/datafiles/assets because on older source
          # that can be a nested Git repository.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "MATERIALIZE release/datafiles"
          echo "========================================"

          COUNT=0

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_pointer \
                "$FILE"

              COUNT=$((COUNT + 1))

            fi

          done < <(
            find \
              release/datafiles \
              -path 'release/datafiles/assets' \
              -prune \
              -o \
              -type f \
              -print0
          )

          echo
          echo "Materialized datafile pointers: $COUNT"

          # --------------------------------------------------------
          # scripts
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "MATERIALIZE scripts"
          echo "========================================"

          COUNT=0

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_pointer \
                "$FILE"

              COUNT=$((COUNT + 1))

            fi

          done < <(
            find \
              scripts \
              -type f \
              -print0
          )

          echo
          echo "Materialized script pointers: $COUNT"

          # --------------------------------------------------------
          # Current Blender root assets/.
          #
          # This is where the 15 brush/node resources from the last
          # failure actually come from.
          # --------------------------------------------------------

          if [ "${{ steps.asset-layout.outputs.mode }}" = "root" ]; then

            echo
            echo "========================================"
            echo "MATERIALIZE TOP-LEVEL assets/"
            echo "========================================"

            COUNT=0

            while IFS= read -r -d '' FILE
            do

              if head -c 200 "$FILE" \
                | grep -q "$LFS_MAGIC"
              then

                materialize_pointer \
                  "$FILE"

                COUNT=$((COUNT + 1))

              fi

            done < <(
              find \
                assets \
                -type f \
                -print0
            )

            echo
            echo "Materialized bundled asset pointers: $COUNT"

          fi

          # --------------------------------------------------------
          # startup.blend must definitely be real.
          # --------------------------------------------------------

          STARTUP="release/datafiles/startup.blend"

          materialize_pointer \
            "$STARTUP"

          STARTUP_SIZE="$(
            stat \
              -f '%z' \
              "$STARTUP"
          )"

          echo
          echo "startup.blend size:"
          echo "$STARTUP_SIZE"

          if [ "$STARTUP_SIZE" -lt 1024 ]; then

            echo "ERROR: startup.blend is unexpectedly tiny."

            exit 1
          fi

      # ============================================================
      # 16. PREPARE DEAD APPICON LFS OBJECT
      # ============================================================

      - name: Prepare iOS AppIcon
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          ICON_DIR="release/ios/Blender.app/Assets.xcassets/AppIcon.appiconset"

          ICON="$ICON_DIR/blender_icon_1024x1024.png"

          CONTENTS="$ICON_DIR/Contents.json"

          test -d \
            "$ICON_DIR"

          test -f \
            "$CONTENTS"

          NEED_ICON=0

          if [ ! -f "$ICON" ]; then

            echo "AppIcon missing."
            NEED_ICON=1

          elif [ ! -s "$ICON" ]; then

            echo "AppIcon empty."
            NEED_ICON=1

          elif head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            echo "AppIcon is the unavailable LFS pointer."
            NEED_ICON=1

          else

            echo "AppIcon already contains real image data."

          fi

          if [ "$NEED_ICON" -eq 1 ]; then

            echo
            echo "Generating fallback 1024x1024 RGB AppIcon..."

            ICON_PATH="$ICON" python3 <<'PY'
          import binascii
          import os
          import struct
          import zlib

          path = os.environ["ICON_PATH"]

          width = 1024
          height = 1024

          pixel = bytes(
              (
                  243,
                  111,
                  33,
              )
          )

          row = (
              b"\x00"
              + pixel * width
          )

          raw = row * height

          def chunk(kind, data):
              return (
                  struct.pack(
                      ">I",
                      len(data),
                  )
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      binascii.crc32(
                          kind + data
                      ) & 0xFFFFFFFF,
                  )
              )

          png = bytearray(
              b"\x89PNG\r\n\x1a\n"
          )

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  2,
                  0,
                  0,
                  0,
              ),
          )

          png += chunk(
              b"IDAT",
              zlib.compress(
                  raw,
                  9,
              ),
          )

          png += chunk(
              b"IEND",
              b"",
          )

          with open(
              path,
              "wb",
          ) as handle:
              handle.write(png)

          print(
              "Generated:",
              path,
          )

          print(
              "Bytes:",
              len(png),
          )
          PY

          fi

          echo
          echo "===== AppIcon ====="

          file \
            "$ICON"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            -g format \
            -g hasAlpha \
            "$ICON"

          WIDTH="$(
            sips \
              -g pixelWidth \
              "$ICON" \
              | awk '/pixelWidth:/ {print $2}'
          )"

          HEIGHT="$(
            sips \
              -g pixelHeight \
              "$ICON" \
              | awk '/pixelHeight:/ {print $2}'
          )"

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

          if head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            echo "ERROR: AppIcon remains an LFS pointer."

            exit 1
          fi

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "release/ios/Blender.app/"
              "Assets.xcassets/"
              "AppIcon.appiconset/"
              "Contents.json"
          )

          data = json.loads(
              path.read_text()
          )

          filenames = {
              item.get("filename")
              for item in data.get(
                  "images",
                  [],
              )
              if item.get("filename")
          }

          expected = (
              "blender_icon_1024x1024.png"
          )

          print(
              "Referenced AppIcon files:",
              filenames,
          )

          if expected not in filenames:
              raise SystemExit(
                  "ERROR: Contents.json does not "
                  f"reference {expected}"
              )
          PY

      # ============================================================
      # 17. VERIFY ALL PACKAGED SOURCE RESOURCES
      #
      # This now checks the CURRENT root assets/ directory too.
      # ============================================================

      - name: Verify source resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path(
                  "release/datafiles"
              ),
              Path(
                  "scripts"
              ),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
          ]

          asset_root = Path(
              os.environ[
                  "BUNDLED_ASSETS_SOURCE"
              ]
          )

          roots.append(
              asset_root
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          seen = set()

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  try:
                      resolved = path.resolve()
                  except OSError:
                      resolved = path

                  if resolved in seen:
                      continue

                  seen.add(
                      resolved
                  )

                  try:
                      head = path.read_bytes()[:200]
                  except OSError:
                      continue

                  if head.startswith(magic):
                      bad.append(path)

          if bad:

              print(
                  "ERROR: source resources still "
                  "contain Git LFS pointers:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "All packaged source resources "
              "are materialized."
          )
          PY

      # ============================================================
      # 18. VERIFY THE 15 ASSETS THAT FAILED LAST TIME
      # ============================================================

      - name: Verify bundled brushes and nodes
        run: |
          set -euxo pipefail

          ROOT="$BUNDLED_ASSETS_SOURCE"

          REQUIRED=(
            "brushes/essentials_brushes-mesh_sculpt.blend"
            "brushes/essentials_brushes-gp_weight.blend"
            "brushes/essentials_brushes-mesh_weight.blend"
            "brushes/essentials_brushes-curve_sculpt.blend"
            "brushes/essentials_brushes-gp_sculpt.blend"
            "brushes/essentials_brushes-gp_vertex.blend"
            "brushes/essentials_brushes-gp_draw.blend"
            "brushes/essentials_brushes-mesh_texture.blend"
            "brushes/essentials_brushes-mesh_vertex.blend"
            "nodes/compositing_nodes_essentials.blend"
            "nodes/shading_nodes_essentials.blend"
            "nodes/principal_components.blend"
            "nodes/geometry_nodes_dynamics_assets.blend"
            "nodes/geometry_nodes_essentials.blend"
            "nodes/procedural_hair_node_assets.blend"
          )

          for REL in "${REQUIRED[@]}"
          do

            FILE="$ROOT/$REL"

            echo "Checking:"
            echo "  $FILE"

            test -f \
              "$FILE"

            if head -c 200 "$FILE" \
              | grep -q \
                'version https://git-lfs.github.com/spec/v1'
            then

              echo "ERROR: still an LFS pointer:"
              echo "  $FILE"

              exit 1
            fi

          done

          echo
          echo "All 15 previously failing assets are available."

      # ============================================================
      # 19. SAVE MAIN SOURCE RESOURCE CACHE
      # ============================================================

      - name: Save source resource cache
        if: steps.source-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            release/datafiles/startup.blend
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
            assets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v5

      # ============================================================
      # 20. SAVE LEGACY ASSET CACHE IF NEEDED
      # ============================================================

      - name: Save legacy Blender assets
        if: >-
          steps.asset-layout.outputs.mode == 'submodule' &&
          steps.legacy-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: release/datafiles/assets
          key: blender-assets-${{ steps.asset-layout.outputs.sha }}-v2

      # ============================================================
      # 21. DETERMINE IOS/MACOS PREBUILT LIBRARY REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -euxo pipefail

          IOS_SHA="$(
            git rev-parse \
              HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse \
              HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "mac_sha=$MAC_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "ios_url=$IOS_URL" \
            >> "$GITHUB_OUTPUT"

          echo "mac_url=$MAC_URL" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "iOS:"
          echo "$IOS_URL"
          echo "$IOS_SHA"

          echo
          echo "macOS:"
          echo "$MAC_URL"
          echo "$MAC_SHA"

      # ============================================================
      # 22. VERIFY LIBRARY PINS
      # ============================================================

      - name: Verify library revisions
        run: |
          set -euxo pipefail

          test \
            "${{ steps.libs.outputs.ios_sha }}" \
            = "$EXPECTED_IOS_LIB_SHA"

          test \
            "${{ steps.libs.outputs.mac_sha }}" \
            = "$EXPECTED_MAC_LIB_SHA"

      # ============================================================
      # 23. RESTORE IOS LIBRARIES
      # ============================================================

      - name: Restore iOS libraries
        id: ios-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 24. FETCH IOS LIBRARIES
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            lfs install \
            --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 25. VERIFY IOS LIBRARIES
      # ============================================================

      - name: Verify iOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$EXPECTED_IOS_LIB_SHA"

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

      # ============================================================
      # 26. SAVE IOS LIBRARIES
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 27. RESTORE MACOS HOST LIBRARIES
      # ============================================================

      - name: Restore macOS libraries
        id: mac-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 28. FETCH MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            lfs install \
            --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 29. VERIFY MACOS LIBRARIES
      # ============================================================

      - name: Verify macOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$EXPECTED_MAC_LIB_SHA"

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print \
              -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then

            echo "ERROR: host Python is missing."

            exit 1
          fi

          echo
          echo "Host Python:"
          echo "$HOST_PYTHON"

      # ============================================================
      # 30. SAVE MACOS LIBRARIES
      # ============================================================

      - name: Save macOS library cache
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 31. APPLY FMT COMPATIBILITY FIXES
      #
      # 1. BundleKey fmt::join
      # 2. StringRef / BundleKey path fmt::join
      # 3. old fmt without fmt::println in mesh_bevel.cc
      # ============================================================

      - name: Apply fmt compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re


          # ========================================================
          # PATCH 1
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(
              needle
          )

          print(
              "BundleKey joins:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: expected exactly 1 "
                  "BundleKey fmt::join; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file1.write_text(
              text
          )


          # ========================================================
          # PATCH 2
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(
              needle
          )

          print(
              "Path joins:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: expected exactly 2 "
                  "fmt::join(path) expressions; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
          )

          file2.write_text(
              text
          )


          # ========================================================
          # PATCH 3
          # ========================================================

          file3 = Path(
              "source/blender/geometry/intern/"
              "mesh_bevel.cc"
          )

          text = file3.read_text()

          call = "fmt::println("

          total = text.count(
              call
          )

          zero_arg = text.count(
              "fmt::println();"
          )

          print(
              "mesh_bevel println calls:",
              total,
          )

          print(
              "zero-argument println calls:",
              zero_arg,
          )

          if total < 19:
              raise SystemExit(
                  "ERROR: expected at least 19 "
                  "println calls; "
                  f"found {total}"
              )

          # Zero-argument println = newline.
          text = text.replace(
              "fmt::println();",
              'fmt::print("\\n");',
          )

          remaining_calls = text.count(
              call
          )

          if remaining_calls:

              macro = r'''

          /*
           * Compatibility for the older fmt implementation
           * exposed by the iOS dependency set.
           */
          #ifndef BLENDER_FMT_PRINTLN_COMPAT
          #  define BLENDER_FMT_PRINTLN_COMPAT(...) \
            do { \
              fmt::print(__VA_ARGS__); \
              fmt::print("\n"); \
            } while (false)
          #endif

          '''

              includes = list(
                  re.finditer(
                      r"(?m)^#include[^\n]*\n",
                      text,
                  )
              )

              if not includes:
                  raise SystemExit(
                      "ERROR: could not find include "
                      "block in mesh_bevel.cc"
                  )

              insert_at = includes[-1].end()

              text = (
                  text[:insert_at]
                  + macro
                  + text[insert_at:]
              )

              text = text.replace(
                  call,
                  "BLENDER_FMT_PRINTLN_COMPAT(",
              )

          file3.write_text(
              text
          )


          # ========================================================
          # VERIFY
          # ========================================================

          if (
              'fmt::join(overridden_keys, ", ")'
              in file1.read_text()
          ):
              raise SystemExit(
                  "ERROR: BundleKey join remains"
              )

          if (
              'fmt::join(path, "/")'
              in file2.read_text()
          ):
              raise SystemExit(
                  "ERROR: path join remains"
              )

          patched3 = file3.read_text()

          remaining = patched3.count(
              "fmt::println("
          )

          print()
          print(
              "Remaining real fmt::println calls:",
              remaining,
          )

          if remaining != 0:
              raise SystemExit(
                  "ERROR: actual fmt::println call remains"
              )

          print()
          print(
              "All fmt compatibility fixes verified."
          )
          PY

          echo
          echo "========================================"
          echo "COMPATIBILITY DIFF"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc \
            > compatibility.patch

          echo
          echo "===== Verify no real fmt::println calls remain ====="

          if grep -nF \
            'fmt::println(' \
            source/blender/geometry/intern/mesh_bevel.cc
          then

            echo "ERROR: actual fmt::println call remains."

            exit 1
          fi

          echo "No actual fmt::println calls remain."

      # ============================================================
      # 32. VERIFY MODERN UIKIT SOURCE
      # ============================================================

      - name: Verify modern UIKit source
        run: |
          set -euxo pipefail

          grep -RIn \
            '\.effectiveGeometry\.coordinateSpace' \
            intern/ghost/intern \
            --include='GHOST_*IOS.mm' \
            | tee modern-uikit-calls.txt

          test -s \
            modern-uikit-calls.txt

          echo
          echo "Modern UIKit source remains intact."

      # ============================================================
      # 33. RESTORE PARTIAL XCODE BUILD
      #
      # fast-v3 IS INTENTIONALLY UNCHANGED.
      # ============================================================

      - name: Restore incremental Xcode build
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-

      # ============================================================
      # 34. INSPECT BUILD CACHE
      # ============================================================

      - name: Inspect incremental build cache
        run: |
          set -euxo pipefail

          echo "Exact cache hit:"
          echo "${{ steps.build-cache.outputs.cache-hit }}"

          echo

          if [ -d "$GITHUB_WORKSPACE/build_ios" ]; then

            echo "Restored build_ios:"

            du -sh \
              "$GITHUB_WORKSPACE/build_ios" \
              || true

          else

            echo "No previous build_ios cache restored."

          fi

          echo

          if [ -d "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" ]; then

            echo "Restored host tools:"

            du -sh \
              "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
              || true

          fi

      # ============================================================
      # 35. CONFIGURE
      #
      # DO NOT rm -rf build_ios.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "========================================"
          echo "CONFIGURE"
          echo "========================================"

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS:"
          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          echo
          echo "Deployment target:"
          echo "$IOS_DEPLOYMENT_TARGET"

          echo
          echo "Bundled asset source:"
          echo "$BUNDLED_ASSETS_SOURCE"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DWITH_GPU_BACKEND_TESTS=OFF \
            -DWITH_GPU_COMPOSITOR_TESTS=OFF \
            -DWITH_GPU_DRAW_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 36. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify configuration
        run: |
          set -euxo pipefail

          echo "===== Important CMake options ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_GTESTS:|WITH_TESTS_BATCHED:|WITH_METAL_BACKEND:|CMAKE_OSX_DEPLOYMENT_TARGET:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep \
              '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep \
              '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"
          echo "WITH_PYTHON=$PYTHON"

          test "$CYCLES" = "OFF"
          test "$PYTHON" = "ON"

      # ============================================================
      # 37. FINAL PRE-BUILD RESOURCE CHECK
      # ============================================================

      - name: Final pre-build resource check
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path("release/datafiles"),
              Path("scripts"),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  os.environ[
                      "BUNDLED_ASSETS_SOURCE"
                  ]
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          seen = set()

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  try:
                      resolved = path.resolve()
                  except OSError:
                      resolved = path

                  if resolved in seen:
                      continue

                  seen.add(resolved)

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:

              print(
                  "ERROR: source resources still "
                  "contain LFS pointers:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Pre-build resource check passed."
          )
          PY

      # ============================================================
      # 38. BUILD BLENDER
      # ============================================================

      - name: Build Blender
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          xcodebuild -version

          echo
          echo "SDK:"

          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo
            echo "===== Main errors ====="

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:|actool|CompileAssetCatalog|AppIcon|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt \
              || true

            echo
            echo "===== fmt diagnostics ====="

            grep -n -C 25 \
              -E \
              'fmt::|println|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            cat \
              fmt-errors.txt \
              || true

            echo
            echo "===== UIKit / GHOST ====="

            grep -n -C 20 \
              -E \
              'GHOST_.*IOS|UIWindowScene|effectiveGeometry|coordinateSpace|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            cat \
              ios-errors.txt \
              || true

            echo
            echo "===== Asset catalog ====="

            grep -n -C 30 \
              -E \
              'actool|Assets.xcassets|AppIcon|CompileAssetCatalog|asset catalog|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > asset-errors.txt \
              || true

            cat \
              asset-errors.txt \
              || true

            echo
            echo "===== Linker ====="

            grep -n -C 30 \
              -E \
              'Undefined symbols|duplicate symbol|library not found|framework not found|ld: |clang: error: linker' \
              xcodebuild.log \
              > linker-errors.txt \
              || true

            cat \
              linker-errors.txt \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 180 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt \
              || true

            echo
            echo "===== Last 700 lines ====="

            tail -700 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 \
            xcodebuild.log

      # ============================================================
      # 39. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              \( \
                -name 'Blender.app' \
                -o \
                -name 'blender.app' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Blender.app not found."

            echo
            echo "Generated app bundles:"

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "Blender.app:"
          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 40. REPAIR STALE RESOURCE COPIES INSIDE CACHED Blender.app
      #
      # IMPORTANT FIX:
      #
      # App path:
      #
      #   Assets/5.2/datafiles/assets/foo
      #
      # Current source:
      #
      #   assets/foo
      #
      # NOT:
      #
      #   release/datafiles/assets/foo
      #
      # Other mappings remain:
      #
      #   datafiles/foo -> release/datafiles/foo
      #   scripts/foo   -> scripts/foo
      # ============================================================

      - name: Repair and verify packaged app resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil

          app = Path(
              os.environ["APP"]
          )

          asset_source = Path(
              os.environ[
                  "BUNDLED_ASSETS_SOURCE"
              ]
          )

          base = (
              app
              / "Assets"
              / "5.2"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          def is_pointer(path):
              try:
                  return (
                      path.read_bytes()[:200]
                      .startswith(magic)
                  )
              except OSError:
                  return False

          pointers = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          print(
              "Pointers initially found inside Blender.app:",
              len(pointers),
          )

          repaired = 0

          for destination in pointers:

              try:
                  relative = destination.relative_to(
                      base
                  )
              except ValueError:

                  print(
                      "Cannot map pointer outside Assets/5.2:",
                      destination,
                  )

                  continue

              parts = relative.parts

              if not parts:
                  continue

              source = None

              # ----------------------------------------------------
              # datafiles/assets/*
              #
              # Current Blender source maps this from top-level
              # assets/*.
              #
              # Older source can use release/datafiles/assets/*.
              # BUNDLED_ASSETS_SOURCE handles both.
              # ----------------------------------------------------

              if (
                  len(parts) >= 2
                  and parts[0] == "datafiles"
                  and parts[1] == "assets"
              ):

                  source = (
                      asset_source
                      / Path(
                          *parts[2:]
                      )
                  )

              # ----------------------------------------------------
              # Other datafiles:
              #
              # datafiles/foo
              # ->
              # release/datafiles/foo
              # ----------------------------------------------------

              elif parts[0] == "datafiles":

                  source = (
                      Path("release")
                      / relative
                  )

              # ----------------------------------------------------
              # scripts/foo -> scripts/foo
              # ----------------------------------------------------

              elif parts[0] == "scripts":

                  source = Path(
                      *parts
                  )

              else:

                  print(
                      "Unknown packaged resource mapping:",
                      destination,
                  )

                  continue

              if not source.is_file():

                  print(
                      "Mapped source does not exist:"
                  )

                  print(
                      "  destination:",
                      destination,
                  )

                  print(
                      "  source:     ",
                      source,
                  )

                  continue

              if is_pointer(
                  source
              ):

                  print(
                      "Mapped source is STILL an LFS pointer:"
                  )

                  print(
                      " ",
                      source,
                  )

                  continue

              print(
                  "Repairing:"
              )

              print(
                  "  destination:",
                  destination,
              )

              print(
                  "  source:     ",
                  source,
              )

              shutil.copy2(
                  source,
                  destination,
              )

              repaired += 1

          print()
          print(
              "Repaired stale packaged resources:",
              repaired,
          )

          remaining = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          if remaining:

              print()
              print(
                  "ERROR: unresolved Git LFS "
                  "pointers remain in Blender.app:"
              )

              for path in remaining:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print()
          print(
              "Blender.app contains no Git LFS pointers."
          )
          PY

      # ============================================================
      # 41. VERIFY BLENDER EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -euxo pipefail

          test -f \
            "$APP/Info.plist"

          echo "===== Info.plist ====="

          plutil \
            -p \
            "$APP/Info.plist" \
            | head -150

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          elif [ -f "$APP/blender" ]
          then

            EXEC_NAME="blender"
            EXECUTABLE="$APP/blender"

          else

            echo "ERROR: Blender executable not found."

            find \
              "$APP" \
              -maxdepth 1 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Executable ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 42. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          (
            cd package

            zip \
              -qry \
              -y \
              ../Blender-5.2-iPad-Xcode26-Fast.ipa \
              Payload
          )

          test -f \
            Blender-5.2-iPad-Xcode26-Fast.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Xcode26-Fast.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Xcode26-Fast.ipa \
            | head -180

      # ============================================================
      # 43. WRITE BUILD INFORMATION
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "Xcode:"
            xcodebuild -version \
              2>/dev/null \
              || true
            echo

            echo "iPhoneOS SDK:"
            xcrun \
              --sdk iphoneos \
              --show-sdk-version \
              2>/dev/null \
              || true
            echo

            echo "Deployment target:"
            echo "$IOS_DEPLOYMENT_TARGET"
            echo

            echo "Bundled asset source:"
            echo "${BUNDLED_ASSETS_SOURCE:-unknown}"
            echo

            echo "Build options:"
            echo "WITH_PYTHON=ON"
            echo "WITH_CYCLES=OFF"
            echo "WITH_GTESTS=OFF"
            echo "WITH_TESTS_BATCHED=OFF"
            echo

            echo "Compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path fmt::join"
            echo "legacy fmt println compatibility in mesh_bevel.cc"
            echo

            echo "UIKit compatibility patches:"
            echo "NONE"
            echo

            echo "UIKit API:"
            echo "effectiveGeometry.coordinateSpace"
            echo

            echo "Resource handling:"
            echo "release/datafiles LFS materialization"
            echo "scripts LFS materialization"
            echo "top-level assets LFS materialization"
            echo "legacy blender-assets fallback"
            echo "dead AppIcon LFS replacement"
            echo "pre-build pointer validation"
            echo "post-build stale resource repair"
            echo "post-build pointer validation"
            echo

            echo "Speed features:"
            echo "source resource cache"
            echo "iOS library cache"
            echo "macOS library cache"
            echo "partial Xcode build cache"
            echo "failed partial builds saved"
            echo "source timestamp normalization"
            echo "index store disabled"
            echo "debug symbols disabled"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 44. SHOW BUILD CACHE SIZE
      # ============================================================

      - name: Show incremental build size
        if: always()
        run: |
          echo "===== build_ios ====="

          du -sh \
            "$GITHUB_WORKSPACE/build_ios" \
            2>/dev/null \
            || true

          echo
          echo "===== host tools ====="

          du -sh \
            "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
            2>/dev/null \
            || true

      # ============================================================
      # 45. SAVE PARTIAL OR COMPLETE XCODE BUILD
      #
      # fast-v3 intentionally remains unchanged.
      # ============================================================

      - name: Save incremental Xcode build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}

      # ============================================================
      # 46. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Xcode26-Fast
          path: |
            Blender-5.2-iPad-Xcode26-Fast.ipa
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 47. UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-xcode26-fast-logs
          path: |
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
            source-lfs.log
            blender-assets-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            asset-errors.txt
            linker-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
