name: Build Blender iPad + TouchView

on:
  workflow_dispatch:

concurrency:
  group: blender-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iPad IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT SALMAZOV
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # 2. ENVIRONMENT
      # ============================================================

      - name: Environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          uname -a
          uname -m
          sw_vers

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          df -h

      # ============================================================
      # 3. FREE DISK SPACE
      # Blender + both prebuilt library bundles are large.
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 4. BUILD TOOLS
      # ============================================================

      - name: Install tools
        run: |
          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version

      # ============================================================
      # 5. REQUIRED BLENDER SOURCE LFS DATA
      #
      # Avoid trying to download Blender's LFS data from the fork.
      # ============================================================

      - name: Fetch required Blender source LFS
        run: |
          set -euxo pipefail

          git config lfs.remote.searchall true

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          echo "=== startup.blend ==="

          ls -lh \
            release/datafiles/startup.blend

          file \
            release/datafiles/startup.blend

      # ============================================================
      # 6. FIND EXACT LIBRARY COMMITS PINNED BY SALMAZOV
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(
            git rev-parse HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse HEAD:lib/macos_arm64
          )"

          echo "ios=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac=$MAC_SHA" >> "$GITHUB_OUTPUT"

          echo "Pinned iOS libraries:"
          echo "$IOS_SHA"

          echo "Pinned macOS libraries:"
          echo "$MAC_SHA"

      # ============================================================
      # 7. RESTORE IOS LIBRARY CACHE
      # ============================================================

      - name: Restore iOS libraries cache
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v2

      # ============================================================
      # 8. RESTORE MACOS HOST LIBRARY CACHE
      # ============================================================

      - name: Restore macOS libraries cache
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v2

      # ============================================================
      # 9. FETCH IOS PREBUILT LIBRARIES
      #
      # Salmazov's .gitmodules uses:
      #
      # update = none
      #
      # Override that explicitly.
      # ============================================================

      - name: Fetch iOS prebuilt libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init \
            lib/ios_arm64

          git config \
            submodule.lib/ios_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/ios_arm64

          echo "=== iOS repository root ==="

          IOS_ROOT="$(
            git -C lib/ios_arm64 \
              rev-parse --show-toplevel
          )"

          echo "$IOS_ROOT"

          test "$IOS_ROOT" = \
            "$GITHUB_WORKSPACE/lib/ios_arm64"

          echo "=== iOS remote ==="

          git -C lib/ios_arm64 \
            remote -v

          echo "=== iOS revision ==="

          ACTUAL_IOS="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          echo "$ACTUAL_IOS"

          test "$ACTUAL_IOS" = \
            "${{ steps.libs.outputs.ios }}"

          echo "=== Initialize iOS LFS ==="

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs env

          echo "=== Download iOS LFS ==="

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          echo "=== Verify iOS Python ==="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 10. FETCH MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS host libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init \
            lib/macos_arm64

          git config \
            submodule.lib/macos_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/macos_arm64

          echo "=== macOS repository root ==="

          MAC_ROOT="$(
            git -C lib/macos_arm64 \
              rev-parse --show-toplevel
          )"

          echo "$MAC_ROOT"

          test "$MAC_ROOT" = \
            "$GITHUB_WORKSPACE/lib/macos_arm64"

          echo "=== macOS remote ==="

          git -C lib/macos_arm64 \
            remote -v

          echo "=== macOS revision ==="

          ACTUAL_MAC="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          echo "$ACTUAL_MAC"

          test "$ACTUAL_MAC" = \
            "${{ steps.libs.outputs.mac }}"

          echo "=== Initialize macOS LFS ==="

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs env

          echo "=== Download macOS LFS ==="

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 11. VERIFY BOTH LIBRARY SETS
      #
      # Salmazov expects iOS Python plus macOS-host Python.
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: macOS host Python missing"
            exit 1
          fi

          echo "=== iOS Python ==="

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "=== Host Python ==="

          echo "$HOST_PYTHON"

          echo "=== Library sizes ==="

          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 12. SAVE IOS CACHE
      # ============================================================

      - name: Save iOS libraries cache
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v2

      # ============================================================
      # 13. SAVE MACOS CACHE
      # ============================================================

      - name: Save macOS libraries cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v2

      # ============================================================
      # 14. ADD SHLOK / NENDO TOUCHVIEW
      #
      # IMPORTANT FIX:
      #
      # sparse-checkout cone mode accepts directories.
      #
      # Therefore:
      #
      #     scripts/startup
      #
      # NOT:
      #
      #     scripts/startup/touchview_ios_startup.py
      #
      # ============================================================

      - name: Add Shlok TouchView
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eux

          rm -rf \
            /tmp/shlok

          GIT_LFS_SKIP_SMUDGE=1 \
            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              https://github.com/Shlok-Bhakta/blender-ios-build.git \
              /tmp/shlok

          echo "=== Configure sparse checkout ==="

          git -C /tmp/shlok \
            sparse-checkout set \
              scripts/addons_core/touchview \
              scripts/startup

          echo "=== Verify downloaded TouchView ==="

          test -d \
            /tmp/shlok/scripts/addons_core/touchview

          test -f \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py

          echo "=== Replace/add TouchView in Salmazov ==="

          rm -rf \
            scripts/addons_core/touchview

          cp -R \
            /tmp/shlok/scripts/addons_core/touchview \
            scripts/addons_core/touchview

          cp \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py \
            scripts/startup/touchview_ios_startup.py

          echo "=== TouchView files ==="

          find \
            scripts/addons_core/touchview \
            -maxdepth 3 \
            -type f \
            | head -100

          echo "=== TouchView startup script ==="

          cat \
            scripts/startup/touchview_ios_startup.py

          echo "=== TouchView source installation successful ==="

      # ============================================================
      # 15. CONFIGURE BLENDER FOR PHYSICAL IOS DEVICE
      #
      # These match Salmazov's own setup_ios.sh configuration.
      # ============================================================

      - name: Configure Blender for iPad
        run: |
          set -euxo pipefail

          rm -rf \
            build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 16. SHOW XCODE TARGETS
      # ============================================================

      - name: List Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # 17. BUILD BLENDER
      #
      # Physical ARM64 iPhone/iPad SDK.
      # Signing disabled because LiveContainer will handle execution.
      # ============================================================

      - name: Build Blender for physical iPad
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log

      # ============================================================
      # 18. FIND BLENDER.APP
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP=""

          if [ -d \
            "$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app" ]; then

            APP="$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app"

          else

            APP="$(
              find \
                "$GITHUB_WORKSPACE/build_ios" \
                -type d \
                -name 'Blender.app' \
                -print -quit
            )"

          fi

          if [ -z "$APP" ] || \
             [ ! -d "$APP" ]; then

            echo "ERROR: Blender.app was not produced."

            echo "=== Other .app directories ==="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "=== Blender.app ==="

          echo "$APP"

          du -sh "$APP"

      # ============================================================
      # 19. VERIFY TOUCHVIEW ACTUALLY GOT PACKAGED
      # ============================================================

      - name: Verify TouchView inside Blender.app
        run: |
          set -eux

          echo "=== Search packaged Blender.app ==="

          find \
            "$APP" \
            \( \
              -iname '*touchview*' \
              -o \
              -name 'touchview_ios_startup.py' \
            \) \
            -print \
            | head -100

          STARTUP="$(
            find \
              "$APP" \
              -name 'touchview_ios_startup.py' \
              -print -quit
          )"

          if [ -z "$STARTUP" ]; then
            echo "ERROR:"
            echo "touchview_ios_startup.py was NOT packaged into Blender.app"
            exit 1
          fi

          TOUCHVIEW_DIR="$(
            find \
              "$APP" \
              -type d \
              -name touchview \
              -print -quit
          )"

          if [ -z "$TOUCHVIEW_DIR" ]; then
            echo "ERROR:"
            echo "TouchView add-on directory was NOT packaged into Blender.app"
            exit 1
          fi

          echo "TouchView packaged successfully:"
          echo "$TOUCHVIEW_DIR"

          echo "Auto-start packaged successfully:"
          echo "$STARTUP"

      # ============================================================
      # 20. PACKAGE UNSIGNED IPA
      #
      # IPA:
      #
      # Payload/
      #   Blender.app/
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-TouchView.ipa \
            Payload

          cd ..

          echo "=== IPA ==="

          ls -lh \
            Blender-5.2-iPad-TouchView.ipa

          echo "=== Verify TouchView inside IPA ==="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | grep -i touchview \
            | head -100

      # ============================================================
      # 21. UPLOAD FINISHED IPA
      # ============================================================

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-iPad-TouchView
          path: Blender-5.2-iPad-TouchView.ipa
          retention-days: 30

      # ============================================================
      # 22. UPLOAD DEBUG LOGS IF ANYTHING FAILS
      # ============================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-build-logs
          path: |
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            build_ios/CMakeCache.txt
            build_ios/**/*.log
            build_ios/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
