name: Build Blender iOS IPA

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build physical-device IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # 1. Blender source
      # ------------------------------------------------------------

      - name: Checkout Blender iOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      # ------------------------------------------------------------
      # 2. Environment
      # ------------------------------------------------------------

      - name: Show runner information
        run: |
          uname -a
          uname -m
          df -h

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install tools
        run: |
          brew install cmake git-lfs
          git lfs install

          cmake --version
          git lfs version

      # ------------------------------------------------------------
      # 3. Prebuilt Blender libraries
      #
      # Salmazov needs BOTH:
      #   lib/ios_arm64
      #   lib/macos_arm64
      # ------------------------------------------------------------

      - name: Fetch iOS library submodule
        run: |
          set -euxo pipefail

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update --init --depth 1 lib/ios_arm64

          echo "=== iOS library commit ==="
          git -C lib/ios_arm64 rev-parse HEAD

          echo "=== iOS LFS objects ==="
          git -C lib/ios_arm64 lfs ls-files | head -50 || true

          git -C lib/ios_arm64 lfs install --local

          git -C lib/ios_arm64 lfs pull \
            2>&1 | tee ios-lfs.log

      - name: Fetch macOS host library submodule
        run: |
          set -euxo pipefail

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update --init --depth 1 lib/macos_arm64

          echo "=== macOS library commit ==="
          git -C lib/macos_arm64 rev-parse HEAD

          git -C lib/macos_arm64 lfs install --local

          git -C lib/macos_arm64 lfs pull \
            2>&1 | tee macos-lfs.log

      # ------------------------------------------------------------
      # 4. Verify important dependencies
      # ------------------------------------------------------------

      - name: Verify libraries
        run: |
          set -euxo pipefail

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find lib/macos_arm64/python/bin \
              -name 'python3.*' \
              -not -name '*config*' \
              -type f \
              | head -1
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "macOS host Python not found"
            exit 1
          fi

          echo "iOS Python:"
          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "Host Python:"
          echo "$HOST_PYTHON"

          df -h

      # ------------------------------------------------------------
      # 5. Configure Blender for a PHYSICAL iOS device
      # ------------------------------------------------------------

      - name: Configure Blender
        run: |
          set -euxo pipefail

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"
          IOS_SDK_ROOT="$(
            xcrun --sdk iphoneos --show-sdk-path
          )"
          IOS_DEV_ROOT="$(dirname "$IOS_SDK_ROOT")"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ------------------------------------------------------------
      # 6. Make sure Blender target exists
      # ------------------------------------------------------------

      - name: Show Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ------------------------------------------------------------
      # 7. Build Blender
      #
      # Signing is intentionally disabled.
      # LiveContainer/SideStore can sign it later.
      # ------------------------------------------------------------

      - name: Build Blender for iPad
        run: |
          set -euxo pipefail

          NCPU="$(sysctl -n hw.ncpu)"

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

      # ------------------------------------------------------------
      # 8. Find Blender.app
      # ------------------------------------------------------------

      - name: Locate Blender.app
        run: |
          set -euxo pipefail

          echo "Applications produced:"
          find build_ios -type d -name '*.app' -print || true

          APP="$(
            find build_ios \
              -type d \
              -name 'Blender.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app was not produced"
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          du -sh "$APP"

          echo "BLENDER_APP=$APP" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 9. Sanity check: physical-device binary
      # ------------------------------------------------------------

      - name: Inspect application
        run: |
          set -euxo pipefail

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$BLENDER_APP/Info.plist" || true

          file "$BLENDER_APP/Blender" || true

          du -sh "$BLENDER_APP"

      # ------------------------------------------------------------
      # 10. Package as IPA
      #
      # IPA format:
      #
      # Payload/
      #   Blender.app/
      # ------------------------------------------------------------

      - name: Package IPA
        run: |
          set -euxo pipefail

          rm -rf ipa-package
          mkdir -p ipa-package/Payload

          ditto \
            "$BLENDER_APP" \
            ipa-package/Payload/Blender.app

          cd ipa-package

          /usr/bin/zip \
            -qry \
            "$GITHUB_WORKSPACE/Blender-iOS-5.2.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          echo "IPA:"
          ls -lh Blender-iOS-5.2.ipa

          echo
          echo "IPA contents:"
          unzip -l Blender-iOS-5.2.ipa | head -30

      # ------------------------------------------------------------
      # 11. Upload the finished IPA
      # ------------------------------------------------------------

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-5.2-physical-device
          path: Blender-iOS-5.2.ipa
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 12. Upload logs even when something fails
      # ------------------------------------------------------------

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-build-logs
          path: |
            ios-lfs.log
            macos-lfs.log
            configure.log
            build.log
          if-no-files-found: ignore
          retention-days: 7
