name: Build Blender iOS - Xcode 26 Fast

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-xcode26-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Fast Incremental
    runs-on: macos-15
    timeout-minutes: 180

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

      BLENDER_SHA: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6

      EXPECTED_IOS_LIB_SHA: 393201c7c8525941553f6a96e19b909d6b3bfc4f
      EXPECTED_MAC_LIB_SHA: a3e20428fb0ab2231903608cdca90301e130dbfc

      IOS_DEPLOYMENT_TARGET: "26.2"

      # IMPORTANT:
      # Keep this unchanged for small source/resource fixes.
      # That allows previous compiled Xcode objects to be restored.
      BUILD_CACHE_VERSION: fast-v3

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT SOURCE
      # ============================================================

      - name: Checkout Blender iOS
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE
      # ============================================================

      - name: Verify source revision
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "========================================"
          echo "SOURCE"
          echo "========================================"
          echo
          echo "Expected: $BLENDER_SHA"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BLENDER_SHA"

          git log -1 --oneline

      # ============================================================
      # 3. NORMALIZE SOURCE TIMESTAMPS
      #
      # Helps Xcode reuse objects restored from the previous run.
      # Files modified by our patches later receive new timestamps.
      # ============================================================

      - name: Normalize source timestamps
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import subprocess

          stamp = int(
              subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%ct",
                      "HEAD",
                  ],
                  text=True,
              ).strip()
          )

          tracked = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
              ]
          )

          count = 0

          for raw in tracked.split(b"\0"):
              if not raw:
                  continue

              path = os.fsdecode(raw)

              if not os.path.lexists(path):
                  continue

              try:
                  os.utime(
                      path,
                      (stamp, stamp),
                      follow_symlinks=False,
                  )
                  count += 1
              except (OSError, NotImplementedError):
                  pass

          print(
              "Normalized timestamps for",
              count,
              "tracked paths",
          )
          PY

      # ============================================================
      # 4. SELECT XCODE 26.3
      # ============================================================

      - name: Select Xcode 26.3
        run: |
          set -euxo pipefail

          XCODE="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.3 is unavailable."
            echo
            echo "Installed Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select \
            -s "$XCODE/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "Developer directory:"
          xcode-select -p

      # ============================================================
      # 5. VERIFY IOS SDK
      # ============================================================

      - name: Verify iOS SDK
        run: |
          set -euxo pipefail

          SDK_VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          SDK_PATH="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          echo "========================================"
          echo "IPHONEOS SDK"
          echo "========================================"

          echo "Version: $SDK_VERSION"
          echo "Path:    $SDK_PATH"

          case "$SDK_VERSION" in
            26.*)
              ;;
            *)
              echo "ERROR: Expected an iOS 26.x SDK."
              exit 1
              ;;
          esac

          echo "IOS_SDK_VERSION=$SDK_VERSION" \
            >> "$GITHUB_ENV"

          echo "IOS_SDK_ROOT=$SDK_PATH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 6. QUICK UIKIT API TEST
      # ============================================================

      - name: Test modern UIWindowScene API
        run: |
          set -euxo pipefail

          cat > /tmp/uikit_probe.mm <<'EOF'
          #import <UIKit/UIKit.h>

          static CGRect blender_scene_bounds(UIWindowScene *scene)
          {
            return scene.effectiveGeometry.coordinateSpace.bounds;
          }
          EOF

          SDKROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          xcrun \
            --sdk iphoneos \
            clang++ \
            -x objective-c++ \
            -fsyntax-only \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min="$IOS_DEPLOYMENT_TARGET" \
            /tmp/uikit_probe.mm

          echo
          echo "Modern UIWindowScene API probe passed."

      # ============================================================
      # 7. DISK SPACE
      # ============================================================

      - name: Check disk space
        run: |
          set -euxo pipefail

          df -h "$GITHUB_WORKSPACE"

          FREE_KB="$(
            df -Pk "$GITHUB_WORKSPACE" \
              | awk 'NR == 2 {print $4}'
          )"

          echo
          echo "Available KB: $FREE_KB"

          if [ "$FREE_KB" -lt 30000000 ]; then

            echo
            echo "Low disk space. Cleaning runner..."

            sudo rm -rf \
              /usr/local/lib/android \
              || true

            sudo rm -rf \
              /usr/share/dotnet \
              || true

            sudo rm -rf \
              "$HOME/Library/Android" \
              || true

            sudo rm -rf \
              /opt/ghc \
              || true

            sudo rm -rf \
              /usr/local/.ghcup \
              || true

            sudo xcrun simctl delete all \
              2>/dev/null \
              || true

          else

            echo
            echo "Enough disk space."

          fi

          df -h "$GITHUB_WORKSPACE"

      # ============================================================
      # 8. REQUIRED TOOLS
      # ============================================================

      - name: Ensure build tools
        run: |
          set -euxo pipefail

          NEED=""

          if ! command -v cmake >/dev/null 2>&1; then
            NEED="$NEED cmake"
          fi

          if ! command -v git-lfs >/dev/null 2>&1; then
            NEED="$NEED git-lfs"
          fi

          if [ -n "$NEED" ]; then
            brew install $NEED
          else
            echo "CMake and Git LFS already available."
          fi

          git lfs install

          echo
          cmake --version

          echo
          git lfs version

      # ============================================================
      # 9. OFFICIAL BLENDER LFS REMOTE
      # ============================================================

      - name: Configure Blender LFS remote
        run: |
          set -euxo pipefail

          git remote add \
            blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null \
            || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config \
            lfs.remote.searchall \
            true

          echo
          git remote -v

      # ============================================================
      # 10. RESTORE SOURCE RESOURCE CACHE
      #
      # v4 adds the bundled app-template .blend files.
      #
      # Changing this cache DOES NOT change BUILD_CACHE_VERSION.
      # ============================================================

      - name: Restore source assets
        id: source-assets-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            release/datafiles
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v4

      # ============================================================
      # 11. MATERIALIZE ALL PACKAGED LFS RESOURCES
      #
      # Previous run proved these source trees can contain pointers
      # that later get copied directly into Blender.app:
      #
      #   release/datafiles
      #   scripts
      #
      # Instead of relying solely on "git lfs checkout", this step:
      #
      #   1. reads each pointer's SHA-256
      #   2. fetches the corresponding LFS object
      #   3. locates it in .git/lfs/objects
      #   4. SHA-256 verifies it
      #   5. copies the real data over the pointer
      #
      # The broken AppIcon is handled separately below because its
      # original LFS object is unavailable.
      # ============================================================

      - name: Materialize packaged source resources
        shell: bash
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          # --------------------------------------------------------
          # Helper for one Git LFS pointer.
          # --------------------------------------------------------

          materialize_lfs_pointer()
          {
            FILE="$1"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: file is missing:"
              echo "  $FILE"
              return 1
            fi

            if ! head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then
              return 0
            fi

            echo
            echo "----------------------------------------"
            echo "Materializing LFS file:"
            echo "  $FILE"

            OID="$(
              sed -n \
                's/^oid sha256://p' \
                "$FILE"
            )"

            if [ -z "$OID" ]; then
              echo "ERROR: LFS pointer contains no SHA-256 OID:"
              echo "  $FILE"
              return 1
            fi

            echo "OID:"
            echo "  $OID"

            GIT_DIR="$(
              git rev-parse \
                --git-dir
            )"

            OBJECT="$GIT_DIR/lfs/objects/${OID:0:2}/${OID:2:2}/$OID"

            # ------------------------------------------------------
            # If not already downloaded, try Blender's official LFS
            # server first.
            # ------------------------------------------------------

            if [ ! -f "$OBJECT" ]; then

              echo "Fetching from official Blender LFS..."

              git lfs fetch \
                blender-lfs \
                --include="$FILE" \
                HEAD \
                || true

            fi

            # ------------------------------------------------------
            # Some fork-specific content might exist only on origin.
            # ------------------------------------------------------

            if [ ! -f "$OBJECT" ]; then

              echo "Official server did not provide it."
              echo "Trying Salmazov origin..."

              git lfs fetch \
                origin \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              echo
              echo "ERROR: LFS object is unavailable."
              echo "File:"
              echo "  $FILE"
              echo "OID:"
              echo "  $OID"

              return 1

            fi

            TEMP="${FILE}.materialized"

            cp \
              "$OBJECT" \
              "$TEMP"

            ACTUAL="$(
              shasum \
                -a 256 \
                "$TEMP" \
                | awk '{print $1}'
            )"

            if [ "$ACTUAL" != "$OID" ]; then

              echo
              echo "ERROR: downloaded LFS object failed SHA-256 verification."
              echo "File:"
              echo "  $FILE"
              echo "Expected:"
              echo "  $OID"
              echo "Actual:"
              echo "  $ACTUAL"

              rm -f "$TEMP"

              return 1

            fi

            mv \
              "$TEMP" \
              "$FILE"

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              echo "ERROR: materialized file still looks like a pointer."
              return 1

            fi

            echo "Materialized:"
            echo "  $FILE"
          }

          # --------------------------------------------------------
          # Broad prefetches.
          #
          # These save lots of individual requests when many asset
          # files are pointers.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "PREFETCH release/datafiles"
          echo "========================================"

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/**" \
            HEAD \
            2>&1 | tee source-lfs.log \
            || true

          echo
          echo "========================================"
          echo "PREFETCH scripts"
          echo "========================================"

          git lfs fetch \
            blender-lfs \
            --include="scripts/**" \
            HEAD \
            2>&1 | tee -a source-lfs.log \
            || true

          # --------------------------------------------------------
          # Materialize ALL pointers under release/datafiles.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "MATERIALIZE release/datafiles"
          echo "========================================"

          DATA_COUNT=0

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_lfs_pointer \
                "$FILE"

              DATA_COUNT=$((DATA_COUNT + 1))

            fi

          done < <(
            find \
              release/datafiles \
              -type f \
              -print0
          )

          echo
          echo "Materialized datafile pointers: $DATA_COUNT"

          # --------------------------------------------------------
          # Materialize ALL pointers under scripts.
          #
          # This includes the startup.blend files seen in the failed
          # packaged-app verification.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "MATERIALIZE scripts"
          echo "========================================"

          SCRIPT_COUNT=0

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_lfs_pointer \
                "$FILE"

              SCRIPT_COUNT=$((SCRIPT_COUNT + 1))

            fi

          done < <(
            find \
              scripts \
              -type f \
              -print0
          )

          echo
          echo "Materialized script pointers: $SCRIPT_COUNT"

          # --------------------------------------------------------
          # startup.blend explicit hard check.
          # --------------------------------------------------------

          STARTUP="release/datafiles/startup.blend"

          materialize_lfs_pointer \
            "$STARTUP"

          STARTUP_SIZE="$(
            stat \
              -f '%z' \
              "$STARTUP"
          )"

          echo
          echo "startup.blend size:"
          echo "$STARTUP_SIZE"

          if [ "$STARTUP_SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is unexpectedly tiny."
            exit 1
          fi

          # --------------------------------------------------------
          # Hard pointer scan before doing an expensive compile.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "VERIFY PACKAGED SOURCE RESOURCES"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path("release/datafiles"),
              Path("scripts"),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:
              print(
                  "ERROR: packaged source resources still "
                  "contain Git LFS pointers:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "All release/datafiles and scripts resources "
              "are materialized."
          )
          PY

      # ============================================================
      # 12. PREPARE THE APP ICON
      #
      # The original Salmazov icon LFS object is unavailable.
      #
      # Keep generating a valid local 1024x1024 RGB icon instead.
      # ============================================================

      - name: Prepare iOS AppIcon
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          ICON_DIR="release/ios/Blender.app/Assets.xcassets/AppIcon.appiconset"

          ICON="$ICON_DIR/blender_icon_1024x1024.png"

          CONTENTS="$ICON_DIR/Contents.json"

          test -d "$ICON_DIR"
          test -f "$CONTENTS"

          NEED_ICON=0

          if [ ! -f "$ICON" ]; then

            echo "AppIcon is missing."
            NEED_ICON=1

          elif [ ! -s "$ICON" ]; then

            echo "AppIcon is empty."
            NEED_ICON=1

          elif head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            echo "AppIcon is still the dead Git LFS pointer."
            NEED_ICON=1

          else

            echo "AppIcon already contains real image data."

          fi

          if [ "$NEED_ICON" -eq 1 ]; then

            echo
            echo "Generating fallback 1024x1024 RGB AppIcon..."

            ICON_PATH="$ICON" python3 <<'PY'
          import binascii
          import os
          import struct
          import zlib

          path = os.environ["ICON_PATH"]

          width = 1024
          height = 1024

          # Blender-like orange RGB.
          # No alpha channel.
          pixel = bytes(
              (
                  243,
                  111,
                  33,
              )
          )

          row = (
              b"\x00"
              + pixel * width
          )

          raw = row * height

          def chunk(kind, data):
              return (
                  struct.pack(
                      ">I",
                      len(data),
                  )
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      binascii.crc32(
                          kind + data
                      ) & 0xFFFFFFFF,
                  )
              )

          png = bytearray(
              b"\x89PNG\r\n\x1a\n"
          )

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  2,
                  0,
                  0,
                  0,
              ),
          )

          png += chunk(
              b"IDAT",
              zlib.compress(
                  raw,
                  9,
              ),
          )

          png += chunk(
              b"IEND",
              b"",
          )

          with open(
              path,
              "wb",
          ) as handle:
              handle.write(png)

          print(
              "Generated:",
              path,
          )

          print(
              "Bytes:",
              len(png),
          )
          PY

          fi

          echo
          echo "===== AppIcon ====="

          file \
            "$ICON"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            -g format \
            -g hasAlpha \
            "$ICON"

          WIDTH="$(
            sips \
              -g pixelWidth \
              "$ICON" \
              | awk '/pixelWidth:/ {print $2}'
          )"

          HEIGHT="$(
            sips \
              -g pixelHeight \
              "$ICON" \
              | awk '/pixelHeight:/ {print $2}'
          )"

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

          if head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            echo "ERROR: AppIcon remains an LFS pointer."
            exit 1

          fi

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "release/ios/Blender.app/"
              "Assets.xcassets/"
              "AppIcon.appiconset/"
              "Contents.json"
          )

          data = json.loads(
              path.read_text()
          )

          files = {
              item.get("filename")
              for item in data.get(
                  "images",
                  [],
              )
              if item.get("filename")
          }

          expected = (
              "blender_icon_1024x1024.png"
          )

          print(
              "Referenced AppIcon files:",
              files,
          )

          if expected not in files:
              raise SystemExit(
                  "ERROR: AppIcon Contents.json does "
                  f"not reference {expected}"
              )
          PY

          # --------------------------------------------------------
          # No LFS pointer may remain anywhere in Assets.xcassets.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "release/ios/Blender.app/"
              "Assets.xcassets"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:
              print(
                  "ERROR: LFS pointers remain in Assets.xcassets:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "iOS Assets.xcassets is fully materialized."
          )
          PY

      # ============================================================
      # 13. SAVE SOURCE RESOURCE CACHE EARLY
      #
      # Save the real .blend resources before compilation so another
      # source/compiler failure cannot force us to fetch them again.
      # ============================================================

      - name: Save source asset cache
        if: steps.source-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            release/datafiles
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v4

      # ============================================================
      # 14. DETERMINE LIBRARY REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -euxo pipefail

          IOS_SHA="$(
            git rev-parse \
              HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse \
              HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "mac_sha=$MAC_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "ios_url=$IOS_URL" \
            >> "$GITHUB_OUTPUT"

          echo "mac_url=$MAC_URL" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "iOS SHA:"
          echo "$IOS_SHA"

          echo
          echo "macOS SHA:"
          echo "$MAC_SHA"

      # ============================================================
      # 15. VERIFY LIBRARY PINS
      # ============================================================

      - name: Verify library revisions
        run: |
          set -euxo pipefail

          test \
            "${{ steps.libs.outputs.ios_sha }}" \
            = "$EXPECTED_IOS_LIB_SHA"

          test \
            "${{ steps.libs.outputs.mac_sha }}" \
            = "$EXPECTED_MAC_LIB_SHA"

      # ============================================================
      # 16. RESTORE IOS LIBRARIES
      # ============================================================

      - name: Restore iOS libraries
        id: ios-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 17. FETCH IOS LIBRARIES
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            lfs install \
            --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 18. VERIFY IOS LIBRARIES
      # ============================================================

      - name: Verify iOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$EXPECTED_IOS_LIB_SHA"

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

      # ============================================================
      # 19. SAVE IOS LIBRARY CACHE
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 20. RESTORE MACOS HOST LIBRARIES
      # ============================================================

      - name: Restore macOS libraries
        id: mac-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 21. FETCH MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            lfs install \
            --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 22. VERIFY MACOS HOST LIBRARIES
      # ============================================================

      - name: Verify macOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$EXPECTED_MAC_LIB_SHA"

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print \
              -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: host Python is missing."
            exit 1
          fi

          echo
          echo "Host Python:"
          echo "$HOST_PYTHON"

      # ============================================================
      # 23. SAVE MACOS LIBRARY CACHE
      # ============================================================

      - name: Save macOS library cache
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 24. APPLY ALL KNOWN FMT COMPATIBILITY PATCHES
      #
      # 1. BundleKey fmt::join
      #
      # 2. StringRef / BundleKey fmt::join(path)
      #
      # 3. mesh_bevel println compatibility for the old fmt pulled
      #    indirectly from the iOS dependencies.
      #
      # No replacement fmt headers.
      # No UIKit source patch.
      # ============================================================

      - name: Apply fmt compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re


          # ========================================================
          # PATCH 1
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(
              needle
          )

          print(
              "BundleKey joins:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: expected exactly 1 "
                  "BundleKey fmt::join; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file1.write_text(
              text
          )


          # ========================================================
          # PATCH 2
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(
              needle
          )

          print(
              "Path joins:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: expected exactly 2 "
                  "fmt::join(path) expressions; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
          )

          file2.write_text(
              text
          )


          # ========================================================
          # PATCH 3
          #
          # Blender source uses the newer println API.
          #
          # The fmt visible in this iOS build does not provide it.
          #
          # Handle zero-argument calls separately, then convert the
          # remaining calls to a compatibility macro.
          # ========================================================

          file3 = Path(
              "source/blender/geometry/intern/"
              "mesh_bevel.cc"
          )

          text = file3.read_text()

          call = "fmt::println("

          total = text.count(
              call
          )

          zero_arg = text.count(
              "fmt::println();"
          )

          print(
              "mesh_bevel println calls:",
              total,
          )

          print(
              "zero-argument println calls:",
              zero_arg,
          )

          if total < 19:
              raise SystemExit(
                  "ERROR: expected at least 19 "
                  "println calls; "
                  f"found {total}"
              )

          # Zero-argument println simply means one newline.
          text = text.replace(
              "fmt::println();",
              'fmt::print("\\n");',
          )

          remaining_calls = text.count(
              call
          )

          if remaining_calls:
              macro = r'''

          /*
           * Compatibility for the older fmt implementation exposed
           * by the iOS dependency set.
           *
           * Preserve println behavior using fmt::print.
           */
          #ifndef BLENDER_FMT_PRINTLN_COMPAT
          #  define BLENDER_FMT_PRINTLN_COMPAT(...) \
            do { \
              fmt::print(__VA_ARGS__); \
              fmt::print("\n"); \
            } while (false)
          #endif

          '''

              includes = list(
                  re.finditer(
                      r"(?m)^#include[^\n]*\n",
                      text,
                  )
              )

              if not includes:
                  raise SystemExit(
                      "ERROR: could not find include "
                      "block in mesh_bevel.cc"
                  )

              insert_at = includes[-1].end()

              text = (
                  text[:insert_at]
                  + macro
                  + text[insert_at:]
              )

              text = text.replace(
                  call,
                  "BLENDER_FMT_PRINTLN_COMPAT(",
              )

          file3.write_text(
              text
          )


          # ========================================================
          # VERIFY
          # ========================================================

          if (
              'fmt::join(overridden_keys, ", ")'
              in file1.read_text()
          ):
              raise SystemExit(
                  "ERROR: BundleKey fmt::join remains"
              )

          if (
              'fmt::join(path, "/")'
              in file2.read_text()
          ):
              raise SystemExit(
                  "ERROR: path fmt::join remains"
              )

          patched3 = file3.read_text()

          remaining = patched3.count(
              "fmt::println("
          )

          print()
          print(
              "Remaining real fmt::println calls:",
              remaining,
          )

          if remaining != 0:
              raise SystemExit(
                  "ERROR: an actual fmt::println "
                  "call remains"
              )

          print()
          print(
              "All fmt compatibility fixes verified."
          )
          PY

          echo
          echo "========================================"
          echo "COMPATIBILITY DIFF"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc \
            > compatibility.patch

          echo
          echo "===== Verify no actual println calls remain ====="

          # Search for the function-call form specifically.
          #
          # Do NOT search merely for "fmt::println", because a comment
          # mentioning the API previously caused a false failure.
          if grep -nF \
            'fmt::println(' \
            source/blender/geometry/intern/mesh_bevel.cc
          then

            echo "ERROR: actual fmt::println call remains."
            exit 1

          fi

          echo "No actual fmt::println calls remain."

      # ============================================================
      # 25. VERIFY MODERN UIKIT SOURCE
      # ============================================================

      - name: Verify modern UIKit source
        run: |
          set -euxo pipefail

          grep -RIn \
            '\.effectiveGeometry\.coordinateSpace' \
            intern/ghost/intern \
            --include='GHOST_*IOS.mm' \
            | tee modern-uikit-calls.txt

          test -s \
            modern-uikit-calls.txt

          echo
          echo "Modern UIKit source remains intact."

      # ============================================================
      # 26. RESTORE PARTIAL XCODE BUILD
      #
      # IMPORTANT:
      #
      # fast-v3 is intentionally unchanged.
      #
      # This should recover the huge amount of C/C++ work already
      # completed by the previous build.
      # ============================================================

      - name: Restore incremental Xcode build
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-

      # ============================================================
      # 27. INSPECT BUILD CACHE
      # ============================================================

      - name: Inspect incremental build cache
        run: |
          set -euxo pipefail

          echo "Exact cache hit:"
          echo "${{ steps.build-cache.outputs.cache-hit }}"

          echo

          if [ -d "$GITHUB_WORKSPACE/build_ios" ]; then

            echo "Restored build_ios:"
            du -sh \
              "$GITHUB_WORKSPACE/build_ios" \
              || true

          else

            echo "No previous build_ios cache restored."

          fi

          echo

          if [ -d "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" ]; then

            echo "Restored host tools:"
            du -sh \
              "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
              || true

          fi

      # ============================================================
      # 28. CONFIGURE
      #
      # Do NOT delete build_ios.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "========================================"
          echo "CONFIGURE"
          echo "========================================"

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          echo
          echo "Deployment target:"
          echo "$IOS_DEPLOYMENT_TARGET"

          echo
          echo "LIBDIR:"
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DWITH_GPU_BACKEND_TESTS=OFF \
            -DWITH_GPU_COMPOSITOR_TESTS=OFF \
            -DWITH_GPU_DRAW_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 29. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify configuration
        run: |
          set -euxo pipefail

          echo "===== Important CMake options ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_GTESTS:|WITH_TESTS_BATCHED:|WITH_METAL_BACKEND:|CMAKE_OSX_DEPLOYMENT_TARGET:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep \
              '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep \
              '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"
          echo "WITH_PYTHON=$PYTHON"

          test "$CYCLES" = "OFF"
          test "$PYTHON" = "ON"

      # ============================================================
      # 30. FINAL SOURCE RESOURCE CHECK
      #
      # Do this immediately before Xcode.
      # ============================================================

      - name: Final pre-build resource check
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path("release/datafiles"),
              Path("scripts"),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:
              print(
                  "ERROR: packaged resources still contain "
                  "Git LFS pointers:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "All source resources required for packaging "
              "are materialized."
          )
          PY

      # ============================================================
      # 31. BUILD BLENDER
      #
      # Keep jobs=3.
      # ============================================================

      - name: Build Blender
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          xcodebuild -version

          echo
          echo "SDK:"
          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo
            echo "===== Compiler / linker / resource errors ====="

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:|actool|CompileAssetCatalog|AppIcon|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt \
              || true

            echo
            echo "===== fmt diagnostics ====="

            grep -n -C 25 \
              -E \
              'fmt::|println|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            cat \
              fmt-errors.txt \
              || true

            echo
            echo "===== UIKit / GHOST ====="

            grep -n -C 20 \
              -E \
              'GHOST_.*IOS|UIWindowScene|effectiveGeometry|coordinateSpace|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            cat \
              ios-errors.txt \
              || true

            echo
            echo "===== Asset catalog ====="

            grep -n -C 30 \
              -E \
              'actool|Assets.xcassets|AppIcon|CompileAssetCatalog|asset catalog|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > asset-errors.txt \
              || true

            cat \
              asset-errors.txt \
              || true

            echo
            echo "===== Linker ====="

            grep -n -C 30 \
              -E \
              'Undefined symbols|duplicate symbol|library not found|framework not found|ld: |clang: error: linker' \
              xcodebuild.log \
              > linker-errors.txt \
              || true

            cat \
              linker-errors.txt \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 180 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt \
              || true

            echo
            echo "===== Last 700 lines ====="

            tail -700 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 \
            xcodebuild.log

      # ============================================================
      # 32. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              \( \
                -name 'Blender.app' \
                -o \
                -name 'blender.app' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Blender.app not found."

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1

          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "Blender.app:"
          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 33. REPAIR STALE LFS COPIES INSIDE Blender.app
      #
      # Why this is necessary:
      #
      # build_ios itself is cached. A previously generated app bundle
      # can therefore contain old LFS pointer copies even though the
      # source files are now materialized correctly.
      #
      # Mapping:
      #
      # Blender.app/Assets/5.2/datafiles/*
      #   <- release/datafiles/*
      #
      # Blender.app/Assets/5.2/scripts/*
      #   <- scripts/*
      #
      # If an app file is a pointer but its source is real, replace
      # the stale app copy directly.
      # ============================================================

      - name: Repair and verify packaged app resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil

          app = Path(
              os.environ["APP"]
          )

          base = (
              app
              / "Assets"
              / "5.2"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          def is_pointer(path):
              try:
                  return (
                      path.read_bytes()[:200]
                      .startswith(magic)
                  )
              except OSError:
                  return False

          initial = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          print(
              "Pointers initially found inside Blender.app:",
              len(initial),
          )

          repaired = 0

          for destination in initial:

              try:
                  relative = destination.relative_to(
                      base
                  )
              except ValueError:
                  print(
                      "Cannot map pointer outside Assets/5.2:",
                      destination,
                  )
                  continue

              parts = relative.parts

              if not parts:
                  continue

              if parts[0] == "datafiles":

                  source = (
                      Path("release")
                      / relative
                  )

              elif parts[0] == "scripts":

                  source = Path(
                      *parts
                  )

              else:

                  print(
                      "Unknown packaged resource root:",
                      destination,
                  )

                  continue

              if not source.is_file():

                  print(
                      "Mapped source does not exist:",
                      source,
                  )

                  continue

              if is_pointer(source):

                  print(
                      "Mapped source is STILL an LFS pointer:",
                      source,
                  )

                  continue

              print(
                  "Repairing:"
              )

              print(
                  "  destination:",
                  destination,
              )

              print(
                  "  source:     ",
                  source,
              )

              shutil.copy2(
                  source,
                  destination,
              )

              repaired += 1

          print()
          print(
              "Repaired stale packaged resources:",
              repaired,
          )

          remaining = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          if remaining:

              print()
              print(
                  "ERROR: unresolved Git LFS pointer files "
                  "remain in Blender.app:"
              )

              for path in remaining:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print()
          print(
              "Blender.app contains no Git LFS pointers."
          )
          PY

      # ============================================================
      # 34. VERIFY EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -euxo pipefail

          test -f \
            "$APP/Info.plist"

          echo "===== Info.plist ====="

          plutil \
            -p \
            "$APP/Info.plist" \
            | head -150

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          elif [ -f "$APP/blender" ]
          then

            EXEC_NAME="blender"
            EXECUTABLE="$APP/blender"

          else

            echo "ERROR: Blender executable not found."

            find \
              "$APP" \
              -maxdepth 1 \
              -type f \
              -print \
              || true

            exit 1

          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Executable ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 35. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          (
            cd package

            zip \
              -qry \
              -y \
              ../Blender-5.2-iPad-Xcode26-Fast.ipa \
              Payload
          )

          test -f \
            Blender-5.2-iPad-Xcode26-Fast.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Xcode26-Fast.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Xcode26-Fast.ipa \
            | head -180

      # ============================================================
      # 36. BUILD INFORMATION
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "Xcode:"
            xcodebuild -version \
              2>/dev/null \
              || true
            echo

            echo "iPhoneOS SDK:"
            xcrun \
              --sdk iphoneos \
              --show-sdk-version \
              2>/dev/null \
              || true
            echo

            echo "Deployment target:"
            echo "$IOS_DEPLOYMENT_TARGET"
            echo

            echo "Build options:"
            echo "WITH_PYTHON=ON"
            echo "WITH_CYCLES=OFF"
            echo "WITH_GTESTS=OFF"
            echo "WITH_TESTS_BATCHED=OFF"
            echo

            echo "Compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path fmt::join"
            echo "legacy fmt println compatibility in mesh_bevel.cc"
            echo

            echo "UIKit compatibility patches:"
            echo "NONE"
            echo

            echo "UIKit API:"
            echo "effectiveGeometry.coordinateSpace"
            echo

            echo "Asset handling:"
            echo "release/datafiles LFS materialization"
            echo "scripts LFS materialization"
            echo "direct SHA-256 LFS object verification"
            echo "dead AppIcon LFS replacement"
            echo "1024x1024 RGB fallback AppIcon"
            echo "pre-build resource pointer scan"
            echo "post-build stale resource repair"
            echo "post-build pointer scan"
            echo

            echo "Speed features:"
            echo "source resource cache"
            echo "iOS dependency cache"
            echo "macOS host dependency cache"
            echo "partial Xcode build cache"
            echo "failed partial builds saved"
            echo "source timestamp normalization"
            echo "index store disabled"
            echo "debug symbols disabled"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 37. SHOW BUILD CACHE SIZE
      #
      # Placed after successful resource repair so a successful run's
      # cached app bundle contains the repaired resources too.
      #
      # Because it uses always(), this also runs after compile failure.
      # ============================================================

      - name: Show incremental build size
        if: always()
        run: |
          echo "===== build_ios ====="

          du -sh \
            "$GITHUB_WORKSPACE/build_ios" \
            2>/dev/null \
            || true

          echo
          echo "===== host tools ====="

          du -sh \
            "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
            2>/dev/null \
            || true

      # ============================================================
      # 38. SAVE PARTIAL OR COMPLETE XCODE BUILD
      #
      # This executes after failures too.
      #
      # On successful runs it now captures the resource-repaired app.
      # ============================================================

      - name: Save incremental Xcode build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}

      # ============================================================
      # 39. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Xcode26-Fast
          path: |
            Blender-5.2-iPad-Xcode26-Fast.ipa
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 40. ALWAYS UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-xcode26-fast-logs
          path: |
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            asset-errors.txt
            linker-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
