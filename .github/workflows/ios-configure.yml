name: Build Blender iOS - Fixed

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-fixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT SALMAZOV
      # ============================================================

      - name: Checkout Salmazov ios-new
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: ios-new
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. CHECKOUT EXACT KNOWN SOURCE REVISION
      # ============================================================

      - name: Checkout exact Blender source
        run: |
          set -euxo pipefail

          EXPECTED="1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6"

          git fetch \
            origin \
            "$EXPECTED" \
            --depth=1

          git checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git log -1 --oneline

      # ============================================================
      # 3. ENVIRONMENT
      # ============================================================

      - name: Show environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== CPU ====="
          uname -m

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "===== Source commit ====="
          git rev-parse HEAD

          echo
          echo "===== Disk ====="
          df -h

      # ============================================================
      # 4. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 5. INSTALL BUILD TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          brew install cmake git-lfs

          git lfs install

          echo "===== CMake ====="
          cmake --version

          echo
          echo "===== Git LFS ====="
          git lfs version

          echo
          echo "===== Python ====="
          python3 --version

      # ============================================================
      # 6. FETCH startup.blend
      # ============================================================

      - name: Fetch startup.blend
        run: |
          set -euxo pipefail

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config lfs.remote.searchall true

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f \
            release/datafiles/startup.blend

          SIZE="$(
            stat -f '%z' \
              release/datafiles/startup.blend
          )"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer"
            exit 1
          fi

          file \
            release/datafiles/startup.blend

      # ============================================================
      # 7. GET EXACT LIBRARY REVISIONS FROM SOURCE
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(
            git rev-parse HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac_sha=$MAC_SHA" >> "$GITHUB_OUTPUT"
          echo "ios_url=$IOS_URL" >> "$GITHUB_OUTPUT"
          echo "mac_url=$MAC_URL" >> "$GITHUB_OUTPUT"

          echo "===== iOS libraries ====="
          echo "$IOS_URL"
          echo "$IOS_SHA"

          echo
          echo "===== macOS libraries ====="
          echo "$MAC_URL"
          echo "$MAC_SHA"

      # ============================================================
      # 8. VERIFY THE EXACT KNOWN LIBRARY PINS
      # ============================================================

      - name: Verify expected library revisions
        run: |
          set -eux

          EXPECTED_IOS="393201c7c8525941553f6a96e19b909d6b3bfc4f"
          EXPECTED_MAC="a3e20428fb0ab2231903608cdca90301e130dbfc"

          ACTUAL_IOS="${{ steps.libs.outputs.ios_sha }}"
          ACTUAL_MAC="${{ steps.libs.outputs.mac_sha }}"

          echo "iOS expected: $EXPECTED_IOS"
          echo "iOS actual:   $ACTUAL_IOS"

          echo
          echo "macOS expected: $EXPECTED_MAC"
          echo "macOS actual:   $ACTUAL_MAC"

          test "$ACTUAL_IOS" = "$EXPECTED_IOS"
          test "$ACTUAL_MAC" = "$EXPECTED_MAC"

      # ============================================================
      # 9. RESTORE IOS LIBRARY CACHE
      # ============================================================

      - name: Cache iOS libraries
        id: ios-cache
        uses: actions/cache@v5
        with:
          path: lib/ios_arm64
          key: blender-ios-arm64-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 10. RESTORE MACOS LIBRARY CACHE
      # ============================================================

      - name: Cache macOS libraries
        id: mac-cache
        uses: actions/cache@v5
        with:
          path: lib/macos_arm64
          key: blender-macos-arm64-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 11. FETCH IOS LIBRARIES IF NEEDED
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          EXPECTED="${{ steps.libs.outputs.ios_sha }}"

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 12. FETCH MACOS LIBRARIES IF NEEDED
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          EXPECTED="${{ steps.libs.outputs.mac_sha }}"

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 13. VERIFY LIBRARIES
      # ============================================================

      - name: Verify libraries
        run: |
          set -eux

          IOS_ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          MAC_ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test "$IOS_ACTUAL" = \
            "${{ steps.libs.outputs.ios_sha }}"

          test "$MAC_ACTUAL" = \
            "${{ steps.libs.outputs.mac_sha }}"

          echo "===== iOS Python ====="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo
          echo "===== macOS host Python ====="

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: host Python not found"
            exit 1
          fi

          echo "$HOST_PYTHON"

          echo
          echo "===== Library sizes ====="

          du -sh \
            lib/ios_arm64

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 14. APPLY ALL REQUIRED SOURCE COMPATIBILITY FIXES
      #
      # A:
      #   BundleKey fmt::join
      #
      # B:
      #   StringRef / BundleKey path fmt::join
      #
      # C:
      #   Xcode 16.4 UIWindowScene coordinateSpace compatibility
      #
      # NO fmt replacement.
      # NO CPATH hacks.
      # NO changed dependency headers.
      # ============================================================

      - name: Apply source compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          # ========================================================
          # FIX A
          #
          # node_geo_join_bundle.cc
          #
          # Old fmt from the iOS dependency set cannot directly
          # format fmt::join(BundleKey range).
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "overridden_keys joins:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "overridden_keys fmt::join; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file1.write_text(text)

          print(
              "Patched:",
              file1,
          )


          # ========================================================
          # FIX B
          #
          # geometry_nodes_bundle.cc
          #
          # Exact source revision contains TWO:
          #
          #   fmt::join(path, "/")
          #
          # One path can contain StringRef.
          # Another can contain BundleKey.
          #
          # The overloads below support both types.
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "path joins:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: Expected exactly two "
                  "path fmt::join expressions; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
          )

          file2.write_text(text)

          print(
              "Patched:",
              file2,
          )


          # ========================================================
          # FIX C
          #
          # GHOST_WindowIOS.mm
          #
          # Source:
          #
          # windowScene.effectiveGeometry.coordinateSpace.bounds
          #
          # Xcode 16.4 / iPhoneOS 18.5 does not expose the
          # coordinateSpace member on UIWindowSceneGeometry.
          #
          # UIWindowScene itself does expose coordinateSpace.
          # ========================================================

          file3 = Path(
              "intern/ghost/intern/"
              "GHOST_WindowIOS.mm"
          )

          text = file3.read_text()

          needle = (
              "windowScene.effectiveGeometry."
              "coordinateSpace.bounds"
          )

          replacement = (
              "windowScene.coordinateSpace.bounds"
          )

          count = text.count(needle)

          print(
              "effectiveGeometry coordinateSpace uses:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "effectiveGeometry.coordinateSpace use; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file3.write_text(text)

          print(
              "Patched:",
              file3,
          )


          # ========================================================
          # VERIFY
          # ========================================================

          bad_patterns = [
              (
                  file1,
                  'fmt::join(overridden_keys, ", ")',
              ),
              (
                  file2,
                  'fmt::join(path, "/")',
              ),
              (
                  file3,
                  'effectiveGeometry.coordinateSpace',
              ),
          ]

          print()
          print(
              "===== Verify compatibility fixes ====="
          )

          for path, pattern in bad_patterns:
              remaining = (
                  path.read_text().count(pattern)
              )

              print(
                  path,
                  pattern,
                  "remaining:",
                  remaining,
              )

              if remaining != 0:
                  raise SystemExit(
                      "ERROR: Compatibility fix "
                      f"verification failed for {path}"
                  )

          print()
          print(
              "All compatibility fixes applied."
          )
          PY

          echo
          echo "========================================"
          echo "COMPATIBILITY DIFF"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            intern/ghost/intern/GHOST_WindowIOS.mm

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            intern/ghost/intern/GHOST_WindowIOS.mm \
            > compatibility.patch

      # ============================================================
      # 15. CONFIGURE BLENDER
      #
      # Cycles OFF:
      #   avoids the known cycles_kernel_cpu failure.
      #
      # Python remains ON.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          rm -rf \
            build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "===== SDK ====="
          echo "$IOS_SDK_ROOT"

          echo
          echo "===== LIBDIR ====="
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_CYCLES=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 16. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          echo "===== Important CMake options ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_PYTHON_NUMPY:|WITH_AUDASPACE:|WITH_METAL_BACKEND:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"
          echo "WITH_PYTHON=$PYTHON"

          if [ "$CYCLES" != "OFF" ]; then
            echo "ERROR: Cycles is not OFF"
            exit 1
          fi

          if [ "$PYTHON" != "ON" ]; then
            echo "ERROR: Python is not ON"
            exit 1
          fi

      # ============================================================
      # 17. BUILD
      # ============================================================

      - name: Build Blender for physical iOS
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo
            echo "===== Compiler / linker errors ====="

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt \
              || true

            echo
            echo "===== GHOST / UIKit diagnostics ====="

            grep -n -C 20 \
              -E \
              'GHOST_WindowIOS|UIWindowScene|coordinateSpace|effectiveGeometry|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            cat \
              ios-errors.txt \
              || true

            echo
            echo "===== fmt / Bundle diagnostics ====="

            grep -n -C 15 \
              -E \
              'fmt::|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            cat \
              fmt-errors.txt \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 120 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt \
              || true

            echo
            echo "===== Last 500 lines ====="

            tail -500 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 \
            xcodebuild.log

      # ============================================================
      # 18. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              -name 'Blender.app' \
              -print -quit
          )"

          if [ -z "$APP" ] || \
             [ ! -d "$APP" ]
          then

            echo "ERROR: Blender.app not found"

            echo
            echo "===== Generated apps ====="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== Blender.app ====="
          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 19. VERIFY EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -eux

          test -f \
            "$APP/Info.plist"

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          else

            echo "ERROR: Blender executable not found"

            find \
              "$APP" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Executable ====="
          echo "$EXECUTABLE"

          echo
          echo "===== File type ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 20. INSPECT APP
      # ============================================================

      - name: Inspect Blender.app
        run: |
          set -eux

          echo "===== App size ====="

          du -sh \
            "$APP"

          echo
          echo "===== App contents ====="

          find \
            "$APP" \
            -maxdepth 2 \
            -print \
            | head -150

      # ============================================================
      # 21. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-Cycles-OFF.ipa \
            Payload

          cd ..

          test -f \
            Blender-5.2-iPad-Cycles-OFF.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Cycles-OFF.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Cycles-OFF.ipa \
            | head -100

      # ============================================================
      # 22. BUILD INFORMATION
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null || true
            echo

            echo "Build options:"
            echo "WITH_CYCLES=OFF"
            echo

            echo "Compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path joins"
            echo "Xcode 16.4 UIWindowScene coordinateSpace"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 23. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Cycles-OFF
          path: |
            Blender-5.2-iPad-Cycles-OFF.ipa
            build-revision.txt
            compatibility.patch
          retention-days: 30

      # ============================================================
      # 24. ALWAYS UPLOAD LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-build-logs
          path: |
            build-revision.txt
            compatibility.patch
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
