name: Build Blender iPad + TouchView

on:
  workflow_dispatch:

concurrency:
  group: blender-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iPad IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT SALMAZOV IOS-NEW
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # 2. ENVIRONMENT
      # ============================================================

      - name: Environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "===== macOS ====="
          sw_vers

          echo "===== CPU ====="
          uname -m

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== Disk ====="
          df -h

      # ============================================================
      # 3. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 4. BUILD TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version
          python3 --version
          curl --version | head -1

      # ============================================================
      # 5. FETCH startup.blend FROM OFFICIAL BLENDER LFS
      # ============================================================

      - name: Fetch Blender startup.blend
        run: |
          set -euxo pipefail

          git config lfs.remote.searchall true

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f release/datafiles/startup.blend

          SIZE="$(
            stat -f '%z' release/datafiles/startup.blend
          )"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer."
            exit 1
          fi

          file release/datafiles/startup.blend
          ls -lh release/datafiles/startup.blend

      # ============================================================
      # 6. DETERMINE EXACT LIBRARY REVISIONS PINNED BY SALMAZOV
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(
            git rev-parse HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse HEAD:lib/macos_arm64
          )"

          echo "ios=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac=$MAC_SHA" >> "$GITHUB_OUTPUT"

          echo "Pinned iOS libs:"
          echo "$IOS_SHA"

          echo "Pinned macOS libs:"
          echo "$MAC_SHA"

      # ============================================================
      # 7. RESTORE IOS LIBRARY CACHE
      # ============================================================

      - name: Restore iOS library cache
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v4

      # ============================================================
      # 8. RESTORE MACOS LIBRARY CACHE
      # ============================================================

      - name: Restore macOS library cache
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v4

      # ============================================================
      # 9. FETCH IOS PREBUILT LIBRARIES
      #
      # Salmazov has update=none for this submodule.
      # Override it explicitly.
      # ============================================================

      - name: Fetch iOS prebuilt libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init \
            lib/ios_arm64

          git config \
            submodule.lib/ios_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/ios_arm64

          IOS_ROOT="$(
            git -C lib/ios_arm64 \
              rev-parse --show-toplevel
          )"

          echo "===== iOS repository ====="
          echo "$IOS_ROOT"

          test "$IOS_ROOT" = \
            "$GITHUB_WORKSPACE/lib/ios_arm64"

          echo "===== iOS remote ====="
          git -C lib/ios_arm64 remote -v

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.ios }}"

          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/ios_arm64 \
            lfs install --local

          echo "===== iOS LFS environment ====="

          git -C lib/ios_arm64 \
            lfs env

          echo "===== Downloading iOS objects ====="

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          echo "===== Verify iOS Python ====="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 10. FETCH MACOS ARM64 HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS host libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init \
            lib/macos_arm64

          git config \
            submodule.lib/macos_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/macos_arm64

          MAC_ROOT="$(
            git -C lib/macos_arm64 \
              rev-parse --show-toplevel
          )"

          echo "===== macOS repository ====="
          echo "$MAC_ROOT"

          test "$MAC_ROOT" = \
            "$GITHUB_WORKSPACE/lib/macos_arm64"

          echo "===== macOS remote ====="
          git -C lib/macos_arm64 remote -v

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.mac }}"

          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/macos_arm64 \
            lfs install --local

          echo "===== macOS LFS environment ====="

          git -C lib/macos_arm64 \
            lfs env

          echo "===== Downloading macOS objects ====="

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 11. VERIFY PREBUILT LIBRARIES
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: macOS host Python missing."
            exit 1
          fi

          echo "===== iOS Python ====="

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "===== Host Python ====="
          echo "$HOST_PYTHON"

          echo "===== Library sizes ====="

          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 12. SAVE IOS LIBRARY CACHE
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v4

      # ============================================================
      # 13. SAVE MACOS LIBRARY CACHE
      # ============================================================

      - name: Save macOS library cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v4

      # ============================================================
      # 14. FIX THE REAL FMT PROBLEM
      #
      # Salmazov's iOS dependency bundle is exposing the fmt copy
      # vendored inside OpenImageIO.
      #
      # Blender 5.2 expects its own newer fmt.
      #
      # Read FMT_VERSION directly from Blender's versions.cmake,
      # download that exact version, and force it before OIIO's
      # -isystem include directory.
      # ============================================================

      - name: Install Blender-matching fmt headers
        run: |
          set -euxo pipefail

          VERSIONS_FILE="build_files/build_environment/cmake/versions.cmake"

          test -f "$VERSIONS_FILE"

          FMT_VERSION="$(
            python3 <<'PY'
          import re
          from pathlib import Path

          text = Path(
              "build_files/build_environment/cmake/versions.cmake"
          ).read_text()

          match = re.search(
              r'set\s*\(\s*FMT_VERSION\s+([^\s\)]+)',
              text
          )

          if not match:
              raise SystemExit("Could not determine FMT_VERSION")

          print(match.group(1))
          PY
          )"

          if [ -z "$FMT_VERSION" ]; then
            echo "ERROR: FMT_VERSION is empty."
            exit 1
          fi

          echo "===== Blender expects fmt ====="
          echo "$FMT_VERSION"

          echo "$FMT_VERSION" > fmt-version.txt

          rm -rf \
            "$GITHUB_WORKSPACE/.deps/fmt"

          rm -f \
            "$GITHUB_WORKSPACE/.deps/fmt.tar.gz"

          mkdir -p \
            "$GITHUB_WORKSPACE/.deps/fmt"

          echo "===== Download matching fmt ====="

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz" \
            -o "$GITHUB_WORKSPACE/.deps/fmt.tar.gz"

          tar \
            -xzf "$GITHUB_WORKSPACE/.deps/fmt.tar.gz" \
            -C "$GITHUB_WORKSPACE/.deps/fmt" \
            --strip-components=1

          FMT_INCLUDE="$GITHUB_WORKSPACE/.deps/fmt/include"

          test -f \
            "$FMT_INCLUDE/fmt/format.h"

          test -f \
            "$FMT_INCLUDE/fmt/core.h" \
            || test -f "$FMT_INCLUDE/fmt/base.h"

          echo "FMT_INCLUDE=$FMT_INCLUDE" \
            >> "$GITHUB_ENV"

          echo "===== New fmt include directory ====="
          echo "$FMT_INCLUDE"

          echo "===== New fmt version macro ====="

          grep -R \
            -m1 \
            '#define FMT_VERSION' \
            "$FMT_INCLUDE/fmt" \
            || true

          echo
          echo "===== Old OpenImageIO vendored fmt ====="

          grep -R \
            -m1 \
            '#define FMT_VERSION' \
            lib/ios_arm64/openimageio/include/OpenImageIO/detail/fmt \
            || true

          echo
          echo "IMPORTANT:"
          echo "We are NOT deleting OpenImageIO's fmt."
          echo "We are making Blender's own fmt headers take precedence."

      # ============================================================
      # 15. ADD SHLOK / NENDO TOUCHVIEW
      # ============================================================

      - name: Add Shlok TouchView
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            /tmp/shlok

          GIT_LFS_SKIP_SMUDGE=1 \
            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              https://github.com/Shlok-Bhakta/blender-ios-build.git \
              /tmp/shlok

          git -C /tmp/shlok \
            sparse-checkout set \
              scripts/addons_core/touchview \
              scripts/startup

          test -d \
            /tmp/shlok/scripts/addons_core/touchview

          test -f \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py

          rm -rf \
            scripts/addons_core/touchview

          cp -R \
            /tmp/shlok/scripts/addons_core/touchview \
            scripts/addons_core/touchview

          cp \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py \
            scripts/startup/touchview_ios_startup.py

          echo "===== TouchView ====="

          find \
            scripts/addons_core/touchview \
            -maxdepth 3 \
            -type f \
            | head -100

          echo "===== Auto-start ====="

          cat \
            scripts/startup/touchview_ios_startup.py

      # ============================================================
      # 16. VERIFY WE ARE NOT APPLYING THE OLD SOURCE HACKS
      #
      # This build fixes fmt itself instead of patching every
      # fmt::join() call one at a time.
      # ============================================================

      - name: Show previously failing fmt calls
        run: |
          set -eux

          echo "===== geometry_nodes_bundle.cc ====="

          grep -n -A 2 -B 2 \
            'fmt::join(path' \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            || true

          echo "===== node_geo_join_bundle.cc ====="

          grep -n -A 2 -B 2 \
            'fmt::join(overridden_keys' \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            || true

      # ============================================================
      # 17. CONFIGURE FOR PHYSICAL IOS DEVICE
      #
      # IMPORTANT:
      #
      # - Python ON: TouchView needs bpy.
      # - Cycles OFF: avoids the previous cycles CPU kernel failure.
      # - Audaspace OFF: iOS build.
      # - Tests OFF: unnecessary for IPA.
      #
      # CMAKE_CXX_FLAGS forces the correct fmt include directory.
      # CPATH/CPLUS_INCLUDE_PATH add a second layer of protection.
      # ============================================================

      - name: Configure Blender for iPad
        env:
          CPATH: ${{ env.FMT_INCLUDE }}
          CPLUS_INCLUDE_PATH: ${{ env.FMT_INCLUDE }}
        run: |
          set -euxo pipefail

          rm -rf \
            build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "===== SDK ====="
          echo "$IOS_SDK_ROOT"

          echo "===== iOS LIBDIR ====="
          echo "$IOS_LIBDIR"

          echo "===== fmt ====="
          echo "$FMT_INCLUDE"

          echo "===== CPATH ====="
          echo "$CPATH"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_PYTHON_NUMPY=OFF \
            -DWITH_PYTHON_INSTALL_NUMPY=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_INSTALL_PORTABLE=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-I${FMT_INCLUDE}" \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

          echo
          echo "===== Important CMake values ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_PYTHON_NUMPY:|WITH_AUDASPACE:|WITH_INSTALL_PORTABLE:|CMAKE_CXX_FLAGS:' \
            build_ios/CMakeCache.txt \
            || true

          echo
          echo "===== Check fmt include was recorded ====="

          grep -R \
            "$FMT_INCLUDE" \
            build_ios \
            | head -30 \
            || true

      # ============================================================
      # 18. LIST XCODE TARGETS
      # ============================================================

      - name: List Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # 19. BUILD HOST CROSS-COMPILE TOOLS FIRST
      # ============================================================

      - name: Build Blender cross tools
        env:
          CPATH: ${{ env.FMT_INCLUDE }}
          CPLUS_INCLUDE_PATH: ${{ env.FMT_INCLUDE }}
        run: |
          set -o pipefail

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee cross-tools.log
          then

            echo
            echo "=============================================="
            echo "          CROSS TOOLS BUILD FAILED"
            echo "=============================================="

            grep -n -C 10 \
              -E \
              '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              cross-tools.log \
              | tail -600 \
              || true

            exit 1
          fi

          echo
          echo "===== CROSS TOOLS SUCCESS ====="

      # ============================================================
      # 20. BUILD PHYSICAL IPAD BLENDER
      #
      # Keep correct fmt ahead of OIIO's private vendored fmt.
      # ============================================================

      - name: Build Blender for physical iPad
        env:
          CPATH: ${{ env.FMT_INCLUDE }}
          CPLUS_INCLUDE_PATH: ${{ env.FMT_INCLUDE }}
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          echo "Using $NCPU build jobs"

          echo "FMT_INCLUDE=$FMT_INCLUDE"
          echo "CPATH=$CPATH"
          echo "CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH"

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log
          then

            echo
            echo "================================================"
            echo "             XCODE BUILD FAILED"
            echo "================================================"
            echo

            echo "===== Compiler / linker errors ====="

            grep -n -C 12 \
              -E \
              '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|Command .* failed' \
              xcodebuild.log \
              | tail -1000 \
              || true

            echo
            echo "===== fmt references near errors ====="

            grep -n -C 5 \
              -E \
              'fmt/(base|core|format)\.h|FMT_VERSION|fmt::' \
              xcodebuild.log \
              | tail -500 \
              || true

            echo
            echo "===== Failed build commands ====="

            grep -n -A 100 \
              'The following build commands failed:' \
              xcodebuild.log \
              | tail -200 \
              || true

            echo
            echo "===== Last 300 lines ====="

            tail -300 \
              xcodebuild.log \
              || true

            exit 1
          fi

          echo
          echo "================================================"
          echo "            BLENDER BUILD SUCCEEDED"
          echo "================================================"

      # ============================================================
      # 21. FIND BLENDER.APP
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP=""

          if [ -d \
            "$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app" ]
          then
            APP="$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app"
          fi

          if [ -z "$APP" ]
          then
            APP="$(
              find \
                "$GITHUB_WORKSPACE/build_ios" \
                -type d \
                -name 'Blender.app' \
                -print -quit
            )"
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]
          then
            echo "ERROR: Blender.app not found."

            echo "===== Generated app bundles ====="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== Blender.app ====="

          echo "$APP"

          du -sh "$APP"

      # ============================================================
      # 22. VERIFY PHYSICAL ARM64 EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -eux

          EXECUTABLE="$APP/Blender"

          if [ ! -f "$EXECUTABLE" ]
          then
            EXECUTABLE="$(
              find \
                "$APP" \
                -maxdepth 1 \
                -type f \
                -perm +111 \
                -print -quit
            )"
          fi

          if [ -z "$EXECUTABLE" ]
          then
            echo "ERROR: executable not found."
            exit 1
          fi

          echo "===== Executable ====="
          echo "$EXECUTABLE"

          file \
            "$EXECUTABLE"

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 23. VERIFY TOUCHVIEW INSIDE BLENDER.APP
      # ============================================================

      - name: Verify TouchView inside Blender.app
        run: |
          set -eux

          echo "===== TouchView files ====="

          find \
            "$APP" \
            \( \
              -iname '*touchview*' \
              -o \
              -name 'touchview_ios_startup.py' \
            \) \
            -print \
            | head -100

          STARTUP="$(
            find \
              "$APP" \
              -name 'touchview_ios_startup.py' \
              -print -quit
          )"

          TOUCHVIEW="$(
            find \
              "$APP" \
              -type d \
              -name touchview \
              -print -quit
          )"

          if [ -z "$STARTUP" ]
          then
            echo "ERROR: TouchView auto-start script missing."
            exit 1
          fi

          if [ -z "$TOUCHVIEW" ]
          then
            echo "ERROR: TouchView add-on missing."
            exit 1
          fi

          echo "===== TouchView add-on ====="
          echo "$TOUCHVIEW"

          echo "===== TouchView auto-start ====="
          echo "$STARTUP"

      # ============================================================
      # 24. OPTIONAL SIZE CLEANUP
      # ============================================================

      - name: Clean unnecessary packaged files
        run: |
          set -eux

          rm -rf \
            "$APP/Assets/5.2/python/lib/python3.11/config-3.11-darwin" \
            || true

          rm -rf \
            "$APP/Assets/5.2/python/lib/python3.13/config-3.13-darwin" \
            || true

          du -sh "$APP"

      # ============================================================
      # 25. PACKAGE STANDARD UNSIGNED IPA
      #
      # Payload/
      # └── Blender.app/
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-TouchView.ipa \
            Payload

          cd ..

          echo "===== IPA ====="

          ls -lh \
            Blender-5.2-iPad-TouchView.ipa

          echo "===== IPA root ====="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | head -40

          echo "===== TouchView inside IPA ====="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | grep -i touchview \
            | head -100

      # ============================================================
      # 26. UPLOAD FINISHED IPA
      # ============================================================

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-iPad-TouchView
          path: Blender-5.2-iPad-TouchView.ipa
          retention-days: 30

      # ============================================================
      # 27. ALWAYS UPLOAD DEBUG LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-build-logs
          path: |
            fmt-version.txt
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            cross-tools.log
            xcodebuild.log
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
