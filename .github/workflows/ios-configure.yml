name: Build Blender iPad + TouchView

on:
  workflow_dispatch:

concurrency:
  group: blender-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iPad IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT SALMAZOV IOS-NEW
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # 2. ENVIRONMENT
      # ============================================================

      - name: Environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo "=== Disk ==="
          df -h

      # ============================================================
      # 3. FREE SOME RUNNER SPACE
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 4. TOOLS
      # ============================================================

      - name: Install tools
        run: |
          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version

      # ============================================================
      # 5. REQUIRED BLENDER SOURCE LFS ASSET
      #
      # Fetch from Blender upstream instead of this GitHub fork.
      # ============================================================

      - name: Fetch Blender startup.blend
        run: |
          set -euxo pipefail

          git config lfs.remote.searchall true

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          echo "=== startup.blend ==="
          ls -lh release/datafiles/startup.blend
          file release/datafiles/startup.blend

      # ============================================================
      # 6. GET EXACT LIBRARY COMMITS PINNED BY IOS-NEW
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(git rev-parse HEAD:lib/ios_arm64)"
          MAC_SHA="$(git rev-parse HEAD:lib/macos_arm64)"

          echo "ios=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac=$MAC_SHA" >> "$GITHUB_OUTPUT"

          echo "iOS libraries commit:   $IOS_SHA"
          echo "macOS libraries commit: $MAC_SHA"

      # ============================================================
      # 7. RESTORE IOS LIBRARY CACHE
      # ============================================================

      - name: Restore iOS libraries cache
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v3

      # ============================================================
      # 8. RESTORE MACOS LIBRARY CACHE
      # ============================================================

      - name: Restore macOS libraries cache
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v3

      # ============================================================
      # 9. FETCH IOS ARM64 PREBUILT LIBRARIES
      #
      # Salmazov's .gitmodules specifies update=none, so override it.
      # ============================================================

      - name: Fetch iOS prebuilt libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init lib/ios_arm64

          git config \
            submodule.lib/ios_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/ios_arm64

          IOS_ROOT="$(
            git -C lib/ios_arm64 \
              rev-parse --show-toplevel
          )"

          echo "=== iOS repository ==="
          echo "$IOS_ROOT"
          git -C lib/ios_arm64 remote -v
          git -C lib/ios_arm64 rev-parse HEAD

          test "$IOS_ROOT" = \
            "$GITHUB_WORKSPACE/lib/ios_arm64"

          test "$(
            git -C lib/ios_arm64 rev-parse HEAD
          )" = "${{ steps.libs.outputs.ios }}"

          git -C lib/ios_arm64 \
            lfs install --local

          echo "=== iOS LFS environment ==="
          git -C lib/ios_arm64 lfs env

          echo "=== Download iOS LFS objects ==="

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          echo "=== Verify iOS Python ==="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          du -sh lib/ios_arm64

      # ============================================================
      # 10. FETCH MACOS ARM64 HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS host libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init lib/macos_arm64

          git config \
            submodule.lib/macos_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/macos_arm64

          MAC_ROOT="$(
            git -C lib/macos_arm64 \
              rev-parse --show-toplevel
          )"

          echo "=== macOS repository ==="
          echo "$MAC_ROOT"
          git -C lib/macos_arm64 remote -v
          git -C lib/macos_arm64 rev-parse HEAD

          test "$MAC_ROOT" = \
            "$GITHUB_WORKSPACE/lib/macos_arm64"

          test "$(
            git -C lib/macos_arm64 rev-parse HEAD
          )" = "${{ steps.libs.outputs.mac }}"

          git -C lib/macos_arm64 \
            lfs install --local

          echo "=== macOS LFS environment ==="
          git -C lib/macos_arm64 lfs env

          echo "=== Download macOS LFS objects ==="

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh lib/macos_arm64

      # ============================================================
      # 11. VERIFY PREBUILT LIBRARIES
      #
      # Salmazov's setup script checks for these too.
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: host Python missing"
            exit 1
          fi

          echo "=== iOS Python ==="
          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "=== macOS host Python ==="
          echo "$HOST_PYTHON"

          echo "=== Library sizes ==="
          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 12. CACHE IOS LIBRARIES
      # ============================================================

      - name: Save iOS libraries cache
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v3

      # ============================================================
      # 13. CACHE MACOS LIBRARIES
      # ============================================================

      - name: Save macOS libraries cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v3

      # ============================================================
      # 14. ADD SHLOK / NENDO TOUCHVIEW
      #
      # FIXED sparse checkout:
      # checkout scripts/startup DIRECTORY, not one individual file.
      # ============================================================

      - name: Add Shlok TouchView
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eux

          rm -rf /tmp/shlok

          GIT_LFS_SKIP_SMUDGE=1 \
            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              https://github.com/Shlok-Bhakta/blender-ios-build.git \
              /tmp/shlok

          git -C /tmp/shlok \
            sparse-checkout set \
              scripts/addons_core/touchview \
              scripts/startup

          echo "=== Verify source files ==="

          test -d \
            /tmp/shlok/scripts/addons_core/touchview

          test -f \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py

          rm -rf \
            scripts/addons_core/touchview

          cp -R \
            /tmp/shlok/scripts/addons_core/touchview \
            scripts/addons_core/touchview

          cp \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py \
            scripts/startup/touchview_ios_startup.py

          echo "=== TouchView files ==="

          find \
            scripts/addons_core/touchview \
            -maxdepth 3 \
            -type f \
            | head -100

          echo "=== TouchView auto-start ==="

          cat \
            scripts/startup/touchview_ios_startup.py

      # ============================================================
      # 15. CONFIGURE FOR PHYSICAL IPAD
      #
      # IMPORTANT:
      #
      # Python       ON  -> required for TouchView
      # Cycles       OFF -> fixes current cycles_kernel_cpu failure
      # Audaspace    OFF -> same as Salmazov iOS CI
      # Portable     OFF -> same as Salmazov iOS CI
      # ============================================================

      - name: Configure Blender for iPad
        run: |
          set -euxo pipefail

          rm -rf build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "=== iOS SDK ==="
          echo "$IOS_SDK_ROOT"

          echo "=== iOS libraries ==="
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_INSTALL_PORTABLE=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            --no-warn-unused-cli \
            2>&1 | tee configure.log

          echo "=== Relevant CMake settings ==="

          grep -E \
            'WITH_PYTHON:|WITH_CYCLES:|WITH_AUDASPACE:|WITH_INSTALL_PORTABLE:|APPLE_TARGET_DEVICE:' \
            build_ios/CMakeCache.txt \
            || true

      # ============================================================
      # 16. LIST GENERATED XCODE TARGETS
      # ============================================================

      - name: List Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # 17. BUILD BLENDER FOR PHYSICAL IPAD
      #
      # Better diagnostics:
      # if Xcode fails, print actual error:/fatal error:/ld: lines.
      # ============================================================

      - name: Build Blender for physical iPad
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          echo "Using $NCPU build jobs"

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log
          then
            echo
            echo "================================================"
            echo "              XCODE BUILD FAILED"
            echo "================================================"
            echo
            echo "=== Compiler / linker errors ==="

            grep -n -C 8 \
              -E \
              '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|Command .* failed' \
              xcodebuild.log \
              | tail -500 \
              || true

            echo
            echo "=== Failed build commands ==="

            grep -n -A 50 \
              'The following build commands failed:' \
              xcodebuild.log \
              | tail -100 \
              || true

            echo
            echo "=== Last 200 build lines ==="

            tail -200 \
              xcodebuild.log \
              || true

            exit 1
          fi

          echo
          echo "=== BUILD SUCCEEDED ==="

      # ============================================================
      # 18. FIND BLENDER.APP
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP=""

          if [ -d \
            "$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app" ]; then

            APP="$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app"

          else

            APP="$(
              find \
                "$GITHUB_WORKSPACE/build_ios" \
                -type d \
                -name 'Blender.app' \
                -print -quit
            )"

          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then

            echo "ERROR: Blender.app not found"

            echo "=== Any generated applications ==="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "=== Blender.app ==="
          echo "$APP"

          du -sh "$APP"

      # ============================================================
      # 19. VERIFY TOUCHVIEW WAS PACKAGED
      # ============================================================

      - name: Verify TouchView inside Blender.app
        run: |
          set -eux

          echo "=== TouchView inside app ==="

          find \
            "$APP" \
            \( \
              -iname '*touchview*' \
              -o \
              -name 'touchview_ios_startup.py' \
            \) \
            -print \
            | head -100

          STARTUP="$(
            find \
              "$APP" \
              -name 'touchview_ios_startup.py' \
              -print -quit
          )"

          TOUCHVIEW_DIR="$(
            find \
              "$APP" \
              -type d \
              -name 'touchview' \
              -print -quit
          )"

          if [ -z "$STARTUP" ]; then
            echo "ERROR: TouchView startup script wasn't packaged"
            exit 1
          fi

          if [ -z "$TOUCHVIEW_DIR" ]; then
            echo "ERROR: TouchView add-on wasn't packaged"
            exit 1
          fi

          echo "TouchView:"
          echo "$TOUCHVIEW_DIR"

          echo "Auto-start:"
          echo "$STARTUP"

      # ============================================================
      # 20. PACKAGE UNSIGNED IPA
      #
      # Payload/
      # └── Blender.app/
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-TouchView.ipa \
            Payload

          cd ..

          echo "=== Finished IPA ==="

          ls -lh \
            Blender-5.2-iPad-TouchView.ipa

          echo "=== TouchView entries ==="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | grep -i touchview \
            | head -100

      # ============================================================
      # 21. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-iPad-TouchView
          path: Blender-5.2-iPad-TouchView.ipa
          retention-days: 30

      # ============================================================
      # 22. ALWAYS UPLOAD USEFUL LOGS
      #
      # Now we get xcodebuild.log even when the build fails.
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-build-logs
          path: |
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
