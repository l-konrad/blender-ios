name: Build Blender iOS - Xcode 26.3

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-xcode26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Xcode 26.3
    runs-on: macos-15
    timeout-minutes: 180

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      # ============================================================
      # 1. CHECKOUT THE EXACT BLENDER SOURCE WE HAVE BEEN TESTING
      #
      # Important:
      # use the full 40-character commit, not the short SHA.
      # ============================================================

      - name: Checkout pinned Salmazov Blender iOS
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE
      # ============================================================

      - name: Verify source revision
        run: |
          set -euxo pipefail

          EXPECTED="1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6"
          ACTUAL="$(git rev-parse HEAD)"

          echo "========================================"
          echo "BLENDER SOURCE"
          echo "========================================"
          echo
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo
          git log -1 --oneline

          echo "BLENDER_SOURCE_SHA=$ACTUAL" >> "$GITHUB_ENV"

      # ============================================================
      # 3. SELECT XCODE 26.3
      #
      # macos-15 defaults to Xcode 16.4, so explicitly select 26.3.
      # ============================================================

      - name: Select Xcode 26.3
        run: |
          set -euxo pipefail

          XCODE="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.3 is not installed."
            echo
            echo "Installed Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select -s \
            "$XCODE/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "xcode-select:"
          xcode-select -p

          echo
          echo "DEVELOPER_DIR:"
          echo "$DEVELOPER_DIR"

      # ============================================================
      # 4. VERIFY IOS 26 SDK
      # ============================================================

      - name: Verify iOS SDK
        run: |
          set -euxo pipefail

          SDK_VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          SDK_PATH="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          echo "========================================"
          echo "IPHONEOS SDK"
          echo "========================================"

          echo
          echo "Version:"
          echo "$SDK_VERSION"

          echo
          echo "Path:"
          echo "$SDK_PATH"

          case "$SDK_VERSION" in
            26.*)
              echo
              echo "Using iOS 26 SDK."
              ;;
            *)
              echo
              echo "ERROR: Expected iOS 26.x SDK."
              exit 1
              ;;
          esac

          echo "IOS_SDK_VERSION=$SDK_VERSION" \
            >> "$GITHUB_ENV"

          echo "IOS_SDK_ROOT=$SDK_PATH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 5. PROVE THE NEW UIKIT API EXISTS
      #
      # This tests the exact API that failed under Xcode 16.4:
      #
      #   scene.effectiveGeometry.coordinateSpace.bounds
      #
      # Do this BEFORE spending time compiling Blender.
      # ============================================================

      - name: Test modern UIWindowScene API
        run: |
          set -euxo pipefail

          cat > /tmp/uikit_probe.mm <<'EOF'
          #import <UIKit/UIKit.h>

          static CGRect blender_scene_bounds(UIWindowScene *scene)
          {
            return scene.effectiveGeometry.coordinateSpace.bounds;
          }
          EOF

          echo "========================================"
          echo "UIKIT API PROBE"
          echo "========================================"

          cat /tmp/uikit_probe.mm

          echo
          echo "Compiling..."

          SDKROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          xcrun \
            --sdk iphoneos \
            clang++ \
            -x objective-c++ \
            -fsyntax-only \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=15.0 \
            /tmp/uikit_probe.mm

          echo
          echo "Modern UIWindowScene API compiled successfully."

      # ============================================================
      # 6. ENVIRONMENT INFORMATION
      # ============================================================

      - name: Show environment
        run: |
          set -eux

          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== Architecture ====="
          uname -m

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== iPhoneOS ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "===== Git ====="
          git --version

          echo
          echo "===== Disk ====="
          df -h

      # ============================================================
      # 7. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf \
            /usr/local/lib/android \
            || true

          sudo rm -rf \
            /usr/share/dotnet \
            || true

          sudo rm -rf \
            ~/Library/Android \
            || true

          sudo rm -rf \
            /opt/ghc \
            || true

          sudo rm -rf \
            /usr/local/.ghcup \
            || true

          sudo rm -rf \
            /Library/Developer/CoreSimulator/Profiles \
            || true

          sudo xcrun simctl delete all \
            2>/dev/null \
            || true

          df -h

      # ============================================================
      # 8. INSTALL BUILD TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -euxo pipefail

          brew install \
            cmake \
            git-lfs

          git lfs install

          echo
          echo "===== CMake ====="
          cmake --version

          echo
          echo "===== Git LFS ====="
          git lfs version

          echo
          echo "===== Python ====="
          python3 --version

          echo
          echo "===== Xcode still selected ====="
          xcodebuild -version

      # ============================================================
      # 9. FETCH startup.blend
      #
      # Fetch the LFS object from official Blender upstream.
      # ============================================================

      - name: Fetch startup.blend
        run: |
          set -euxo pipefail

          git remote add \
            blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null \
            || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config \
            lfs.remote.searchall \
            true

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f \
            release/datafiles/startup.blend

          SIZE="$(
            stat \
              -f '%z' \
              release/datafiles/startup.blend
          )"

          echo
          echo "startup.blend size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer."
            exit 1
          fi

          file \
            release/datafiles/startup.blend

      # ============================================================
      # 10. GET EXACT PREBUILT LIBRARY REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -euxo pipefail

          IOS_SHA="$(
            git rev-parse \
              HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse \
              HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "mac_sha=$MAC_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "ios_url=$IOS_URL" \
            >> "$GITHUB_OUTPUT"

          echo "mac_url=$MAC_URL" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "PREBUILT LIBRARIES"
          echo "========================================"

          echo
          echo "iOS:"
          echo "$IOS_URL"
          echo "$IOS_SHA"

          echo
          echo "macOS:"
          echo "$MAC_URL"
          echo "$MAC_SHA"

      # ============================================================
      # 11. VERIFY KNOWN PINS
      # ============================================================

      - name: Verify expected library revisions
        run: |
          set -euxo pipefail

          EXPECTED_IOS="393201c7c8525941553f6a96e19b909d6b3bfc4f"
          EXPECTED_MAC="a3e20428fb0ab2231903608cdca90301e130dbfc"

          ACTUAL_IOS="${{ steps.libs.outputs.ios_sha }}"
          ACTUAL_MAC="${{ steps.libs.outputs.mac_sha }}"

          echo "iOS expected:"
          echo "$EXPECTED_IOS"

          echo "iOS actual:"
          echo "$ACTUAL_IOS"

          echo
          echo "macOS expected:"
          echo "$EXPECTED_MAC"

          echo "macOS actual:"
          echo "$ACTUAL_MAC"

          test "$ACTUAL_IOS" = "$EXPECTED_IOS"
          test "$ACTUAL_MAC" = "$EXPECTED_MAC"

      # ============================================================
      # 12. CACHE IOS PREBUILT LIBRARIES
      # ============================================================

      - name: Cache iOS libraries
        id: ios-cache
        uses: actions/cache@v5
        with:
          path: lib/ios_arm64
          key: blender-ios-arm64-${{ steps.libs.outputs.ios_sha }}-v4

      # ============================================================
      # 13. CACHE MACOS HOST LIBRARIES
      # ============================================================

      - name: Cache macOS libraries
        id: mac-cache
        uses: actions/cache@v5
        with:
          path: lib/macos_arm64
          key: blender-macos-arm64-${{ steps.libs.outputs.mac_sha }}-v4

      # ============================================================
      # 14. FETCH IOS LIBRARIES ON CACHE MISS
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          EXPECTED="${{ steps.libs.outputs.ios_sha }}"

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/ios_arm64 \
            lfs install \
            --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 15. FETCH MACOS LIBRARIES ON CACHE MISS
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          EXPECTED="${{ steps.libs.outputs.mac_sha }}"

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/macos_arm64 \
            lfs install \
            --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 16. VERIFY PREBUILT LIBRARIES
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -euxo pipefail

          IOS_ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          MAC_ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test "$IOS_ACTUAL" = \
            "${{ steps.libs.outputs.ios_sha }}"

          test "$MAC_ACTUAL" = \
            "${{ steps.libs.outputs.mac_sha }}"

          echo "===== iOS Python ====="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo
          echo "===== macOS host Python ====="

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print \
              -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: macOS host Python missing."
            exit 1
          fi

          echo "$HOST_PYTHON"

          echo
          echo "===== Sizes ====="

          du -sh \
            lib/ios_arm64

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 17. APPLY ONLY THE TWO KNOWN FMT COMPATIBILITY FIXES
      #
      # IMPORTANT:
      #
      # We are NOT modifying:
      #
      #   GHOST_WindowIOS.mm
      #   GHOST_SystemIOS.mm
      #
      # We want Xcode 26.3 to compile Salmazov's modern UIKit code
      # exactly as written.
      #
      # We also do NOT replace fmt itself.
      # ============================================================

      - name: Patch old fmt compatibility
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          # ========================================================
          # PATCH A
          #
          # node_geo_join_bundle.cc
          #
          # fmt::join(overridden_keys, ", ")
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "overridden_keys fmt::join occurrences:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "overridden_keys fmt::join; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file1.write_text(text)

          print(
              "Patched:",
              file1,
          )


          # ========================================================
          # PATCH B
          #
          # geometry_nodes_bundle.cc
          #
          # There are exactly two:
          #
          #   fmt::join(path, "/")
          #
          # One path uses StringRef.
          # Another uses BundleKey.
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "path fmt::join occurrences:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: expected exactly two "
                  "path fmt::join expressions; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
          )

          file2.write_text(text)

          print(
              "Patched:",
              file2,
          )


          # ========================================================
          # VERIFY FMT PATCHES
          # ========================================================

          if 'fmt::join(overridden_keys, ", ")' in file1.read_text():
              raise SystemExit(
                  "ERROR: overridden_keys fmt::join remains"
              )

          if 'fmt::join(path, "/")' in file2.read_text():
              raise SystemExit(
                  "ERROR: path fmt::join remains"
              )

          print()
          print(
              "fmt compatibility patches verified."
          )
          PY

          echo
          echo "========================================"
          echo "FMT PATCH DIFF"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            > compatibility.patch

      # ============================================================
      # 18. VERIFY MODERN IOS SOURCE IS UNTOUCHED
      #
      # The previous builds found this API in both GHOST_WindowIOS
      # and GHOST_SystemIOS. Under Xcode 26.3 we want it intact.
      # ============================================================

      - name: Verify modern UIKit source
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "MODERN UIKIT CALLS"
          echo "========================================"

          grep -RIn \
            '\.effectiveGeometry\.coordinateSpace' \
            intern/ghost/intern \
            --include='GHOST_*IOS.mm' \
            | tee modern-uikit-calls.txt

          COUNT="$(
            grep -RIl \
              '\.effectiveGeometry\.coordinateSpace' \
              intern/ghost/intern \
              --include='GHOST_*IOS.mm' \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "Files using modern API: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo
            echo "ERROR: modern effectiveGeometry API unexpectedly missing."
            exit 1
          fi

          echo
          echo "No Xcode-16 UIKit fallback patch is being applied."

      # ============================================================
      # 19. CONFIGURE BLENDER FOR IOS
      #
      # Python stays ON.
      # Cycles stays OFF.
      #
      # No UIKit source workaround.
      # No fmt header replacement.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          rm -rf \
            build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "========================================"
          echo "CONFIGURE"
          echo "========================================"

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "SDK:"
          echo "$IOS_SDK_ROOT"

          echo
          echo "LIBDIR:"
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 20. VERIFY CMAKE CONFIGURATION
      # ============================================================

      - name: Verify configuration
        run: |
          set -euxo pipefail

          echo "===== Important options ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_PYTHON_NUMPY:|WITH_AUDASPACE:|WITH_METAL_BACKEND:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep \
              '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep \
              '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"
          echo "WITH_PYTHON=$PYTHON"

          test "$CYCLES" = "OFF"
          test "$PYTHON" = "ON"

          echo
          echo "===== CMake Xcode info ====="

          grep -E \
            'CMAKE_OSX_SYSROOT|CMAKE_XCODE' \
            build_ios/CMakeCache.txt \
            || true

      # ============================================================
      # 21. BUILD BLENDER
      #
      # Keep jobs at 3 to avoid unnecessary memory pressure.
      # ============================================================

      - name: Build Blender for physical iOS
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          echo
          xcodebuild -version

          echo
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo
            echo "===== Compiler / linker errors ====="

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt \
              || true

            echo
            echo "===== UIKit / GHOST diagnostics ====="

            grep -n -C 20 \
              -E \
              'GHOST_.*IOS|UIWindowScene|effectiveGeometry|coordinateSpace|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            cat \
              ios-errors.txt \
              || true

            echo
            echo "===== fmt / Bundle diagnostics ====="

            grep -n -C 15 \
              -E \
              'fmt::|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            cat \
              fmt-errors.txt \
              || true

            echo
            echo "===== Linker diagnostics ====="

            grep -n -C 30 \
              -E \
              'Undefined symbols|duplicate symbol|library not found|framework not found|ld: |clang: error: linker' \
              xcodebuild.log \
              > linker-errors.txt \
              || true

            cat \
              linker-errors.txt \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 150 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt \
              || true

            echo
            echo "===== Last 700 lines ====="

            tail -700 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 \
            xcodebuild.log

      # ============================================================
      # 22. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              \( \
                -name 'Blender.app' \
                -o \
                -name 'blender.app' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$APP" ] || \
             [ ! -d "$APP" ]
          then

            echo "ERROR: Blender.app not found."

            echo
            echo "===== All generated app bundles ====="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Blender.app ====="

          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 23. VERIFY APP EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -euxo pipefail

          test -f \
            "$APP/Info.plist"

          echo "===== Info.plist ====="

          plutil \
            -p \
            "$APP/Info.plist" \
            | head -100

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          elif [ -f "$APP/blender" ]
          then

            EXEC_NAME="blender"
            EXECUTABLE="$APP/blender"

          else

            echo
            echo "ERROR: executable not found."

            find \
              "$APP" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Executable ====="

          echo "$EXECUTABLE"

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 24. INSPECT APP
      # ============================================================

      - name: Inspect Blender.app
        run: |
          set -euxo pipefail

          echo "===== App size ====="

          du -sh \
            "$APP"

          echo
          echo "===== App contents ====="

          find \
            "$APP" \
            -maxdepth 2 \
            -print \
            | head -250

      # ============================================================
      # 25. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-Xcode26-Cycles-OFF.ipa \
            Payload

          cd ..

          test -f \
            Blender-5.2-iPad-Xcode26-Cycles-OFF.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Xcode26-Cycles-OFF.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Xcode26-Cycles-OFF.ipa \
            | head -150

      # ============================================================
      # 26. WRITE BUILD INFORMATION
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "Xcode:"
            xcodebuild -version \
              2>/dev/null \
              || true
            echo

            echo "iPhoneOS SDK:"
            xcrun \
              --sdk iphoneos \
              --show-sdk-version \
              2>/dev/null \
              || true
            echo

            echo "Build options:"
            echo "WITH_PYTHON=ON"
            echo "WITH_CYCLES=OFF"
            echo

            echo "Source compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path fmt::join"
            echo

            echo "UIKit compatibility patches:"
            echo "NONE"
            echo

            echo "UIKit source API:"
            echo "effectiveGeometry.coordinateSpace"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 27. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Xcode26
          path: |
            Blender-5.2-iPad-Xcode26-Cycles-OFF.ipa
            build-revision.txt
            compatibility.patch
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 28. ALWAYS UPLOAD DIAGNOSTIC LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-xcode26-build-logs
          path: |
            build-revision.txt
            compatibility.patch
            modern-uikit-calls.txt
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            linker-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
