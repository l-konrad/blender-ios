name: Build Blender iPad + TouchView

on:
  workflow_dispatch:

concurrency:
  group: blender-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iPad IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT SALMAZOV IOS-NEW
      # ============================================================

      - name: Checkout ios-new
        uses: actions/checkout@v4
        with:
          ref: ios-new
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # 2. ENVIRONMENT
      # ============================================================

      - name: Environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "===== macOS ====="
          sw_vers

          echo "===== Architecture ====="
          uname -m

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== Git commit ====="
          git rev-parse HEAD
          git branch --show-current

          echo "===== Disk ====="
          df -h

      # ============================================================
      # 3. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 4. BUILD TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version
          python3 --version
          curl --version | head -1

      # ============================================================
      # 5. FETCH BLENDER startup.blend
      # ============================================================

      - name: Fetch Blender startup.blend
        run: |
          set -euxo pipefail

          git config lfs.remote.searchall true

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f \
            release/datafiles/startup.blend

          SIZE="$(
            stat -f '%z' \
              release/datafiles/startup.blend
          )"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer"
            exit 1
          fi

          file \
            release/datafiles/startup.blend

          ls -lh \
            release/datafiles/startup.blend

      # ============================================================
      # 6. DETERMINE PINNED LIBRARY COMMITS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(
            git rev-parse HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse HEAD:lib/macos_arm64
          )"

          echo "ios=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac=$MAC_SHA" >> "$GITHUB_OUTPUT"

          echo "iOS libraries:"
          echo "$IOS_SHA"

          echo "macOS libraries:"
          echo "$MAC_SHA"

      # ============================================================
      # 7. RESTORE LIBRARY CACHES
      # ============================================================

      - name: Restore iOS library cache
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v4

      - name: Restore macOS library cache
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v4

      # ============================================================
      # 8. FETCH IOS LIBRARIES
      # ============================================================

      - name: Fetch iOS prebuilt libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init \
            lib/ios_arm64

          git config \
            submodule.lib/ios_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/ios_arm64

          IOS_ROOT="$(
            git -C lib/ios_arm64 \
              rev-parse --show-toplevel
          )"

          test "$IOS_ROOT" = \
            "$GITHUB_WORKSPACE/lib/ios_arm64"

          echo "===== iOS remote ====="

          git -C lib/ios_arm64 \
            remote -v

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.ios }}"

          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 9. FETCH MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS host libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init \
            lib/macos_arm64

          git config \
            submodule.lib/macos_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/macos_arm64

          MAC_ROOT="$(
            git -C lib/macos_arm64 \
              rev-parse --show-toplevel
          )"

          test "$MAC_ROOT" = \
            "$GITHUB_WORKSPACE/lib/macos_arm64"

          echo "===== macOS remote ====="

          git -C lib/macos_arm64 \
            remote -v

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.mac }}"

          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 10. VERIFY LIBRARIES
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: macOS host Python missing"
            exit 1
          fi

          echo "===== iOS Python ====="

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "===== Host Python ====="

          echo "$HOST_PYTHON"

          echo "===== Library sizes ====="

          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 11. SAVE LIBRARY CACHES
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v4

      - name: Save macOS library cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v4

      # ============================================================
      # 12. INSTALL BLENDER'S EXACT FMT VERSION
      #
      # IMPORTANT:
      #
      # Do NOT use CPATH.
      # Do NOT use CPLUS_INCLUDE_PATH.
      # Do NOT append a global CMAKE_CXX_FLAGS -I.
      #
      # Those caused fmt 12.1 ranges.h to be mixed with
      # OpenImageIO's older private fmt headers.
      #
      # Instead install matching fmt directly here:
      #
      # source/blender/blenlib/fmt/
      #
      # source/blender/blenlib is already one of Blender's normal
      # include paths, before the OpenImageIO system include.
      # ============================================================

      - name: Vendor Blender matching fmt
        run: |
          set -euxo pipefail

          VERSIONS_FILE="build_files/build_environment/cmake/versions.cmake"

          test -f \
            "$VERSIONS_FILE"

          FMT_VERSION="$(
            python3 <<'PY'
          import re
          from pathlib import Path

          text = Path(
              "build_files/build_environment/cmake/versions.cmake"
          ).read_text()

          match = re.search(
              r'set\s*\(\s*FMT_VERSION\s+([^\s\)]+)',
              text
          )

          if not match:
              raise SystemExit(
                  "Could not determine FMT_VERSION"
              )

          print(match.group(1))
          PY
          )"

          if [ -z "$FMT_VERSION" ]; then
            echo "ERROR: FMT_VERSION empty"
            exit 1
          fi

          echo "===== Blender fmt version ====="
          echo "$FMT_VERSION"

          echo "$FMT_VERSION" \
            > fmt-version.txt

          rm -rf \
            "$GITHUB_WORKSPACE/.deps/fmt"

          rm -f \
            "$GITHUB_WORKSPACE/.deps/fmt.tar.gz"

          mkdir -p \
            "$GITHUB_WORKSPACE/.deps/fmt"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz" \
            -o "$GITHUB_WORKSPACE/.deps/fmt.tar.gz"

          tar \
            -xzf "$GITHUB_WORKSPACE/.deps/fmt.tar.gz" \
            -C "$GITHUB_WORKSPACE/.deps/fmt" \
            --strip-components=1

          SOURCE_FMT="$GITHUB_WORKSPACE/.deps/fmt/include/fmt"

          test -f \
            "$SOURCE_FMT/base.h"

          test -f \
            "$SOURCE_FMT/format.h"

          test -f \
            "$SOURCE_FMT/ranges.h"

          # Remove any previous temporary vendored copy.
          rm -rf \
            source/blender/blenlib/fmt

          # Put the entire matching fmt tree into an include directory
          # Blender already places before OpenImageIO's private headers.
          cp -R \
            "$SOURCE_FMT" \
            source/blender/blenlib/fmt

          echo
          echo "===== Vendored fmt ====="

          ls \
            source/blender/blenlib/fmt \
            | head -30

          echo
          echo "===== fmt version macro ====="

          grep -n \
            '#define FMT_VERSION' \
            source/blender/blenlib/fmt/base.h

          echo
          echo "===== Required fmt macros ====="

          grep -n \
            -E '#.*define FMT_(PRAGMA_CLANG|EXPORT)' \
            source/blender/blenlib/fmt/base.h \
            | head -20

      # ============================================================
      # 13. FORCE BLI_fmt.hh TO USE ITS LOCAL fmt/
      #
      # This is the important anti-mixing patch.
      #
      # <fmt/foo.h>
      #
      # becomes:
      #
      # "fmt/foo.h"
      #
      # Because fmt/ now lives directly beside BLI_fmt.hh.
      # ============================================================

      - name: Make BLI_fmt use vendored fmt
        run: |
          set -euxo pipefail

          FILE="source/blender/blenlib/BLI_fmt.hh"

          test -f "$FILE"

          echo "===== Before ====="

          grep -n \
            'fmt/' \
            "$FILE" \
            || true

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "source/blender/blenlib/BLI_fmt.hh"
          )

          text = path.read_text()

          text, count = re.subn(
              r'#include\s*<fmt/([^>]+)>',
              r'#include "fmt/\1"',
              text,
          )

          if count == 0:
              print(
                  "No angle-bracket fmt includes needed replacement."
              )

          path.write_text(text)

          print(
              f"Rewritten fmt include statements: {count}"
          )
          PY

          echo
          echo "===== After ====="

          grep -n \
            'fmt/' \
            "$FILE" \
            || true

          if grep -q \
            '#include <fmt/' \
            "$FILE"
          then
            echo "ERROR: BLI_fmt.hh still contains external fmt include"
            exit 1
          fi

          test -f \
            source/blender/blenlib/fmt/format.h

          test -f \
            source/blender/blenlib/fmt/ranges.h

          echo
          echo "===== fmt header setup is self-contained ====="

      # ============================================================
      # 14. ADD SHLOK / NENDO TOUCHVIEW
      # ============================================================

      - name: Add Shlok TouchView
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            /tmp/shlok

          GIT_LFS_SKIP_SMUDGE=1 \
            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              https://github.com/Shlok-Bhakta/blender-ios-build.git \
              /tmp/shlok

          git -C /tmp/shlok \
            sparse-checkout set \
              scripts/addons_core/touchview \
              scripts/startup

          test -d \
            /tmp/shlok/scripts/addons_core/touchview

          test -f \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py

          rm -rf \
            scripts/addons_core/touchview

          cp -R \
            /tmp/shlok/scripts/addons_core/touchview \
            scripts/addons_core/touchview

          cp \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py \
            scripts/startup/touchview_ios_startup.py

          echo "===== TouchView files ====="

          find \
            scripts/addons_core/touchview \
            -maxdepth 3 \
            -type f \
            | head -100

          echo
          echo "===== Auto-start ====="

          cat \
            scripts/startup/touchview_ios_startup.py

      # ============================================================
      # 15. CONFIGURE
      #
      # NOTE:
      #
      # No CPATH
      # No CPLUS_INCLUDE_PATH
      # No CMAKE_CXX_FLAGS fmt hack
      #
      # Correct fmt is now physically inside blenlib.
      # ============================================================

      - name: Configure Blender for iPad
        run: |
          set -euxo pipefail

          rm -rf \
            build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "===== SDK ====="
          echo "$IOS_SDK_ROOT"

          echo "===== iOS libraries ====="
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_PYTHON_NUMPY=OFF \
            -DWITH_PYTHON_INSTALL_NUMPY=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_INSTALL_PORTABLE=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

          echo
          echo "===== Important settings ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_PYTHON_NUMPY:|WITH_AUDASPACE:|WITH_INSTALL_PORTABLE:' \
            build_ios/CMakeCache.txt \
            || true

          echo
          echo "===== Verify no old global fmt include hack ====="

          if grep -q \
            '\.deps/fmt/include' \
            build_ios/CMakeCache.txt
          then
            echo "ERROR: old .deps fmt compiler flag is still present"
            exit 1
          fi

      # ============================================================
      # 16. LIST XCODE TARGETS
      # ============================================================

      - name: List Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # 17. BUILD HOST CROSS TOOLS
      # ============================================================

      - name: Build Blender cross tools
        run: |
          set -o pipefail

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee cross-tools.log
          then

            echo
            echo "================================================"
            echo "          CROSS TOOLS BUILD FAILED"
            echo "================================================"

            grep -n -C 12 \
              -E \
              '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              cross-tools.log \
              | tail -800 \
              || true

            exit 1
          fi

          echo
          echo "===== CROSS TOOLS SUCCEEDED ====="

      # ============================================================
      # 18. BUILD BLENDER
      # ============================================================

      - name: Build Blender for physical iPad
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          echo "Using $NCPU jobs"

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log
          then

            echo
            echo "================================================"
            echo "             XCODE BUILD FAILED"
            echo "================================================"
            echo

            echo "===== Compiler / linker errors ====="

            grep -n -C 15 \
              -E \
              '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|Command .* failed' \
              xcodebuild.log \
              | tail -1200 \
              || true

            echo
            echo "===== fmt-related output ====="

            grep -n -C 8 \
              -E \
              'fmt/(base|core|format|ranges)\.h|FMT_(VERSION|EXPORT|PRAGMA)|fmt::' \
              xcodebuild.log \
              | tail -800 \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 100 \
              'The following build commands failed:' \
              xcodebuild.log \
              | tail -250 \
              || true

            echo
            echo "===== Last 300 lines ====="

            tail -300 \
              xcodebuild.log \
              || true

            exit 1
          fi

          echo
          echo "================================================"
          echo "            BLENDER BUILD SUCCEEDED"
          echo "================================================"

      # ============================================================
      # 19. FIND BLENDER.APP
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP=""

          if [ -d \
            "$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app" ]
          then
            APP="$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app"
          fi

          if [ -z "$APP" ]
          then
            APP="$(
              find \
                "$GITHUB_WORKSPACE/build_ios" \
                -type d \
                -name 'Blender.app' \
                -print -quit
            )"
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]
          then
            echo "ERROR: Blender.app not found"

            echo "===== Generated .app bundles ====="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== Blender.app ====="
          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 20. VERIFY BLENDER EXECUTABLE
      # ============================================================

      - name: Verify physical iPad executable
        run: |
          set -eux

          EXECUTABLE="$APP/Blender"

          if [ ! -f "$EXECUTABLE" ]
          then
            EXECUTABLE="$(
              find \
                "$APP" \
                -maxdepth 1 \
                -type f \
                -perm +111 \
                -print -quit
            )"
          fi

          if [ -z "$EXECUTABLE" ]
          then
            echo "ERROR: Blender executable not found"
            exit 1
          fi

          echo "===== Executable ====="
          echo "$EXECUTABLE"

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 21. VERIFY TOUCHVIEW
      # ============================================================

      - name: Verify TouchView inside Blender.app
        run: |
          set -eux

          echo "===== TouchView files ====="

          find \
            "$APP" \
            \( \
              -iname '*touchview*' \
              -o \
              -name 'touchview_ios_startup.py' \
            \) \
            -print \
            | head -100

          STARTUP="$(
            find \
              "$APP" \
              -name 'touchview_ios_startup.py' \
              -print -quit
          )"

          TOUCHVIEW="$(
            find \
              "$APP" \
              -type d \
              -name touchview \
              -print -quit
          )"

          if [ -z "$STARTUP" ]
          then
            echo "ERROR: TouchView auto-start script missing"
            exit 1
          fi

          if [ -z "$TOUCHVIEW" ]
          then
            echo "ERROR: TouchView add-on missing"
            exit 1
          fi

          echo "===== TouchView ====="
          echo "$TOUCHVIEW"

          echo "===== Auto-start ====="
          echo "$STARTUP"

      # ============================================================
      # 22. CLEAN UNNECESSARY PYTHON CONFIG FILES
      # ============================================================

      - name: Clean packaged app
        run: |
          set -eux

          rm -rf \
            "$APP/Assets/5.2/python/lib/python3.11/config-3.11-darwin" \
            || true

          rm -rf \
            "$APP/Assets/5.2/python/lib/python3.13/config-3.13-darwin" \
            || true

          du -sh \
            "$APP"

      # ============================================================
      # 23. PACKAGE IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-TouchView.ipa \
            Payload

          cd ..

          echo "===== IPA ====="

          ls -lh \
            Blender-5.2-iPad-TouchView.ipa

          echo
          echo "===== IPA structure ====="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | head -40

          echo
          echo "===== TouchView in IPA ====="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | grep -i touchview \
            | head -100

      # ============================================================
      # 24. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-iPad-TouchView
          path: Blender-5.2-iPad-TouchView.ipa
          retention-days: 30

      # ============================================================
      # 25. ALWAYS UPLOAD LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-build-logs
          path: |
            fmt-version.txt
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            cross-tools.log
            xcodebuild.log
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
