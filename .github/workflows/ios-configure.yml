name: Build Blender iOS - Xcode 26 Fast

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-xcode26-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Fast Incremental
    runs-on: macos-15
    timeout-minutes: 180

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

      BLENDER_SHA: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6

      EXPECTED_IOS_LIB_SHA: 393201c7c8525941553f6a96e19b909d6b3bfc4f
      EXPECTED_MAC_LIB_SHA: a3e20428fb0ab2231903608cdca90301e130dbfc

      IOS_DEPLOYMENT_TARGET: "26.2"

      # Keep unchanged so the successful partial build stays reusable.
      BUILD_CACHE_VERSION: fast-v3

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Blender iOS
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE
      # ============================================================

      - name: Verify source revision
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "========================================"
          echo "SOURCE"
          echo "========================================"
          echo "Expected: $BLENDER_SHA"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BLENDER_SHA"

          git log -1 --oneline

      # ============================================================
      # 3. NORMALIZE SOURCE TIMESTAMPS
      # ============================================================

      - name: Normalize source timestamps
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import subprocess

          stamp = int(
              subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%ct",
                      "HEAD",
                  ],
                  text=True,
              ).strip()
          )

          tracked = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
              ]
          )

          count = 0

          for raw in tracked.split(b"\0"):
              if not raw:
                  continue

              path = os.fsdecode(raw)

              if not os.path.lexists(path):
                  continue

              try:
                  os.utime(
                      path,
                      (stamp, stamp),
                      follow_symlinks=False,
                  )
                  count += 1
              except (OSError, NotImplementedError):
                  pass

          print(
              "Normalized timestamps for",
              count,
              "tracked paths",
          )
          PY

      # ============================================================
      # 4. SELECT XCODE 26.3
      # ============================================================

      - name: Select Xcode 26.3
        run: |
          set -euxo pipefail

          XCODE="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 26.3 unavailable."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select \
            -s "$XCODE/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          xcodebuild -version
          xcode-select -p

      # ============================================================
      # 5. VERIFY IOS SDK
      # ============================================================

      - name: Verify iOS SDK
        run: |
          set -euxo pipefail

          VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          PATH_SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          echo "SDK version: $VERSION"
          echo "SDK path:    $PATH_SDK"

          case "$VERSION" in
            26.*)
              ;;
            *)
              echo "ERROR: Expected iOS 26.x SDK."
              exit 1
              ;;
          esac

          echo "IOS_SDK_VERSION=$VERSION" \
            >> "$GITHUB_ENV"

          echo "IOS_SDK_ROOT=$PATH_SDK" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 6. UIKIT API PROBE
      # ============================================================

      - name: Test modern UIWindowScene API
        run: |
          set -euxo pipefail

          cat > /tmp/uikit_probe.mm <<'EOF'
          #import <UIKit/UIKit.h>

          static CGRect blender_scene_bounds(UIWindowScene *scene)
          {
            return scene.effectiveGeometry.coordinateSpace.bounds;
          }
          EOF

          SDKROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          xcrun \
            --sdk iphoneos \
            clang++ \
            -x objective-c++ \
            -fsyntax-only \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min="$IOS_DEPLOYMENT_TARGET" \
            /tmp/uikit_probe.mm

      # ============================================================
      # 7. DISK SPACE
      # ============================================================

      - name: Check disk space
        run: |
          set -euxo pipefail

          df -h "$GITHUB_WORKSPACE"

          FREE_KB="$(
            df -Pk "$GITHUB_WORKSPACE" \
              | awk 'NR == 2 {print $4}'
          )"

          if [ "$FREE_KB" -lt 30000000 ]; then

            sudo rm -rf \
              /usr/local/lib/android \
              || true

            sudo rm -rf \
              /usr/share/dotnet \
              || true

            sudo rm -rf \
              "$HOME/Library/Android" \
              || true

            sudo rm -rf \
              /opt/ghc \
              || true

            sudo rm -rf \
              /usr/local/.ghcup \
              || true

            sudo xcrun simctl delete all \
              2>/dev/null \
              || true

          fi

          df -h "$GITHUB_WORKSPACE"

      # ============================================================
      # 8. TOOLS
      # ============================================================

      - name: Ensure build tools
        run: |
          set -euxo pipefail

          NEED=""

          if ! command -v cmake >/dev/null 2>&1; then
            NEED="$NEED cmake"
          fi

          if ! command -v git-lfs >/dev/null 2>&1; then
            NEED="$NEED git-lfs"
          fi

          if [ -n "$NEED" ]; then
            brew install $NEED
          fi

          git lfs install

          cmake --version
          git lfs version

      # ============================================================
      # 9. BLENDER LFS REMOTE
      # ============================================================

      - name: Configure Blender LFS remote
        run: |
          set -euxo pipefail

          git remote add \
            blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null \
            || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config \
            lfs.remote.searchall \
            true

          git remote -v

      # ============================================================
      # 10. DETECT BUNDLED ASSET LAYOUT
      # ============================================================

      - name: Detect bundled asset layout
        id: asset-layout
        shell: bash
        run: |
          set -euxo pipefail

          MODE=""
          SOURCE=""
          SHA=""
          URL=""

          # --------------------------------------------------------
          # Current-style Blender source:
          #
          #   assets/brushes
          #   assets/nodes
          # --------------------------------------------------------

          if [ -d assets ]; then

            MODE="root"
            SOURCE="assets"

          else

            # ------------------------------------------------------
            # Older layout:
            #
            # release/datafiles/assets may be a gitlink.
            # ------------------------------------------------------

            TREE_LINE="$(
              git ls-tree \
                HEAD \
                release/datafiles/assets \
                || true
            )"

            TREE_MODE="$(
              printf '%s\n' "$TREE_LINE" \
                | awk '{print $1}'
            )"

            TREE_SHA="$(
              printf '%s\n' "$TREE_LINE" \
                | awk '{print $3}'
            )"

            if [ "$TREE_MODE" = "160000" ] && \
               [ -n "$TREE_SHA" ]
            then

              MODE="submodule"
              SOURCE="release/datafiles/assets"
              SHA="$TREE_SHA"

              SUBMODULE_NAME="$(
                git config \
                  -f .gitmodules \
                  --get-regexp '^submodule\..*\.path$' \
                | awk \
                    '$2 == "release/datafiles/assets" {
                      key=$1
                      sub(/^submodule\./, "", key)
                      sub(/\.path$/, "", key)
                      print key
                    }'
              )"

              if [ -z "$SUBMODULE_NAME" ]; then
                echo "ERROR: Cannot locate assets submodule entry."
                exit 1
              fi

              URL="$(
                git config \
                  -f .gitmodules \
                  --get \
                  "submodule.${SUBMODULE_NAME}.url"
              )"

              if [ -z "$URL" ]; then
                echo "ERROR: Cannot determine assets repository URL."
                exit 1
              fi

            else

              echo "ERROR: Could not determine Blender bundled asset layout."

              echo
              echo "Root:"
              ls -la

              echo
              echo "release/datafiles:"
              ls -la release/datafiles || true

              echo
              echo ".gitmodules:"
              cat .gitmodules || true

              exit 1

            fi

          fi

          echo "mode=$MODE" \
            >> "$GITHUB_OUTPUT"

          echo "source=$SOURCE" \
            >> "$GITHUB_OUTPUT"

          echo "sha=$SHA" \
            >> "$GITHUB_OUTPUT"

          echo "url=$URL" \
            >> "$GITHUB_OUTPUT"

          echo "BUNDLED_ASSETS_SOURCE=$SOURCE" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "BUNDLED ASSET LAYOUT"
          echo "========================================"
          echo "Mode:   $MODE"
          echo "Source: $SOURCE"
          echo "SHA:    $SHA"
          echo "URL:    $URL"

      # ============================================================
      # 11. RESTORE SOURCE RESOURCE CACHE
      # ============================================================

      - name: Restore source resources
        id: source-assets-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            release/datafiles/startup.blend
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
            assets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v5

      # ============================================================
      # 12. RESTORE LEGACY ASSETS
      # ============================================================

      - name: Restore legacy Blender assets
        id: legacy-assets-cache
        if: steps.asset-layout.outputs.mode == 'submodule'
        uses: actions/cache/restore@v5
        with:
          path: release/datafiles/assets
          key: blender-assets-${{ steps.asset-layout.outputs.sha }}-v2

      # ============================================================
      # 13. FETCH LEGACY ASSETS IF NEEDED
      # ============================================================

      - name: Fetch legacy Blender assets
        if: >-
          steps.asset-layout.outputs.mode == 'submodule' &&
          steps.legacy-assets-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="release/datafiles/assets"
          SHA="${{ steps.asset-layout.outputs.sha }}"
          URL="${{ steps.asset-layout.outputs.url }}"

          rm -rf "$ROOT"

          git clone \
            --filter=blob:none \
            --no-checkout \
            "$URL" \
            "$ROOT"

          git -C "$ROOT" \
            fetch \
            --depth=1 \
            origin \
            "$SHA"

          git -C "$ROOT" \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C "$ROOT" \
              rev-parse HEAD
          )"

          test "$ACTUAL" = "$SHA"

          git -C "$ROOT" \
            lfs install \
            --local

          git -C "$ROOT" \
            lfs pull \
            2>&1 | tee blender-assets-lfs.log

          du -sh "$ROOT"

      # ============================================================
      # 14. VERIFY LEGACY ASSETS
      # ============================================================

      - name: Verify legacy Blender assets
        if: steps.asset-layout.outputs.mode == 'submodule'
        run: |
          set -euxo pipefail

          ROOT="release/datafiles/assets"

          ACTUAL="$(
            git -C "$ROOT" \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.asset-layout.outputs.sha }}"

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "release/datafiles/assets"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in root.rglob("*"):

              if ".git" in path.parts:
                  continue

              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:
              print(
                  "ERROR: legacy blender-assets still "
                  "contains LFS pointers:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Legacy blender-assets fully materialized."
          )
          PY

      # ============================================================
      # 15. MATERIALIZE MAIN-REPOSITORY LFS FILES
      # ============================================================

      - name: Materialize packaged source resources
        shell: bash
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          materialize_pointer()
          {
            FILE="$1"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing source file:"
              echo "  $FILE"
              return 1
            fi

            if ! head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then
              return 0
            fi

            echo
            echo "Materializing:"
            echo "  $FILE"

            OID="$(
              sed -n \
                's/^oid sha256://p' \
                "$FILE"
            )"

            if [ -z "$OID" ]; then
              echo "ERROR: Invalid LFS pointer: $FILE"
              return 1
            fi

            GIT_DIR="$(
              git rev-parse \
                --git-dir
            )"

            OBJECT="$GIT_DIR/lfs/objects/${OID:0:2}/${OID:2:2}/$OID"

            if [ ! -f "$OBJECT" ]; then

              git lfs fetch \
                blender-lfs \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              git lfs fetch \
                origin \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              echo "ERROR: LFS object unavailable:"
              echo "  file: $FILE"
              echo "  oid:  $OID"

              return 1
            fi

            TEMP="${FILE}.materialized"

            cp \
              "$OBJECT" \
              "$TEMP"

            ACTUAL="$(
              shasum \
                -a 256 \
                "$TEMP" \
                | awk '{print $1}'
            )"

            if [ "$ACTUAL" != "$OID" ]; then

              echo "ERROR: LFS SHA mismatch."
              echo "Expected: $OID"
              echo "Actual:   $ACTUAL"

              rm -f "$TEMP"

              return 1
            fi

            mv \
              "$TEMP" \
              "$FILE"
          }

          # --------------------------------------------------------
          # Prefetch main Blender resources.
          # --------------------------------------------------------

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/**" \
            HEAD \
            2>&1 | tee source-lfs.log \
            || true

          git lfs fetch \
            blender-lfs \
            --include="scripts/startup/bl_app_templates_system/**" \
            HEAD \
            2>&1 | tee -a source-lfs.log \
            || true

          if [ "${{ steps.asset-layout.outputs.mode }}" = "root" ]; then

            git lfs fetch \
              blender-lfs \
              --include="assets/**" \
              HEAD \
              2>&1 | tee -a source-lfs.log \
              || true

          fi

          # --------------------------------------------------------
          # release/datafiles
          #
          # Exclude nested assets path because that can be its own
          # repository in the legacy layout.
          # --------------------------------------------------------

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_pointer "$FILE"

            fi

          done < <(
            find \
              release/datafiles \
              -path 'release/datafiles/assets' \
              -prune \
              -o \
              -type f \
              -print0
          )

          # --------------------------------------------------------
          # scripts
          # --------------------------------------------------------

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_pointer "$FILE"

            fi

          done < <(
            find \
              scripts \
              -type f \
              -print0
          )

          # --------------------------------------------------------
          # root assets/
          # --------------------------------------------------------

          if [ "${{ steps.asset-layout.outputs.mode }}" = "root" ]; then

            while IFS= read -r -d '' FILE
            do

              if head -c 200 "$FILE" \
                | grep -q "$LFS_MAGIC"
              then

                materialize_pointer "$FILE"

              fi

            done < <(
              find \
                assets \
                -type f \
                -print0
            )

          fi

          # --------------------------------------------------------
          # startup.blend hard check.
          # --------------------------------------------------------

          STARTUP="release/datafiles/startup.blend"

          materialize_pointer "$STARTUP"

          SIZE="$(
            stat \
              -f '%z' \
              "$STARTUP"
          )"

          echo "startup.blend size: $SIZE"

          test "$SIZE" -gt 1024

      # ============================================================
      # 16. APPICON WORKAROUND
      # ============================================================

      - name: Prepare iOS AppIcon
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          ICON_DIR="release/ios/Blender.app/Assets.xcassets/AppIcon.appiconset"

          ICON="$ICON_DIR/blender_icon_1024x1024.png"

          CONTENTS="$ICON_DIR/Contents.json"

          test -d "$ICON_DIR"
          test -f "$CONTENTS"

          NEED_ICON=0

          if [ ! -f "$ICON" ]; then
            NEED_ICON=1
          elif [ ! -s "$ICON" ]; then
            NEED_ICON=1
          elif head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then
            NEED_ICON=1
          fi

          if [ "$NEED_ICON" -eq 1 ]; then

            ICON_PATH="$ICON" python3 <<'PY'
          import binascii
          import os
          import struct
          import zlib

          path = os.environ["ICON_PATH"]

          width = 1024
          height = 1024

          pixel = bytes(
              (
                  243,
                  111,
                  33,
              )
          )

          row = (
              b"\x00"
              + pixel * width
          )

          raw = row * height

          def chunk(kind, data):
              return (
                  struct.pack(
                      ">I",
                      len(data),
                  )
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      binascii.crc32(
                          kind + data
                      ) & 0xFFFFFFFF,
                  )
              )

          png = bytearray(
              b"\x89PNG\r\n\x1a\n"
          )

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  2,
                  0,
                  0,
                  0,
              ),
          )

          png += chunk(
              b"IDAT",
              zlib.compress(
                  raw,
                  9,
              ),
          )

          png += chunk(
              b"IEND",
              b"",
          )

          with open(
              path,
              "wb",
          ) as handle:
              handle.write(png)

          print(
              "Generated fallback AppIcon:",
              path,
          )
          PY

          fi

          file "$ICON"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            -g format \
            -g hasAlpha \
            "$ICON"

          WIDTH="$(
            sips \
              -g pixelWidth \
              "$ICON" \
              | awk '/pixelWidth:/ {print $2}'
          )"

          HEIGHT="$(
            sips \
              -g pixelHeight \
              "$ICON" \
              | awk '/pixelHeight:/ {print $2}'
          )"

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

          if head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            echo "ERROR: AppIcon remains an LFS pointer."
            exit 1

          fi

      # ============================================================
      # 17. VERIFY ALL PACKAGED SOURCE RESOURCES
      # ============================================================

      - name: Verify source resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path(
                  "release/datafiles"
              ),
              Path(
                  "scripts"
              ),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  os.environ[
                      "BUNDLED_ASSETS_SOURCE"
                  ]
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []
          seen = set()

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  try:
                      resolved = path.resolve()
                  except OSError:
                      resolved = path

                  if resolved in seen:
                      continue

                  seen.add(resolved)

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:

              print(
                  "ERROR: source resources still "
                  "contain LFS pointers:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "All packaged source resources are materialized."
          )
          PY

      # ============================================================
      # 18. VERIFY PREVIOUSLY MISSING BUNDLED ASSETS
      # ============================================================

      - name: Verify bundled brushes and nodes
        run: |
          set -euxo pipefail

          ROOT="$BUNDLED_ASSETS_SOURCE"

          REQUIRED=(
            "brushes/essentials_brushes-mesh_sculpt.blend"
            "brushes/essentials_brushes-gp_weight.blend"
            "brushes/essentials_brushes-mesh_weight.blend"
            "brushes/essentials_brushes-curve_sculpt.blend"
            "brushes/essentials_brushes-gp_sculpt.blend"
            "brushes/essentials_brushes-gp_vertex.blend"
            "brushes/essentials_brushes-gp_draw.blend"
            "brushes/essentials_brushes-mesh_texture.blend"
            "brushes/essentials_brushes-mesh_vertex.blend"
            "nodes/compositing_nodes_essentials.blend"
            "nodes/shading_nodes_essentials.blend"
            "nodes/principal_components.blend"
            "nodes/geometry_nodes_dynamics_assets.blend"
            "nodes/geometry_nodes_essentials.blend"
            "nodes/procedural_hair_node_assets.blend"
          )

          for REL in "${REQUIRED[@]}"
          do

            FILE="$ROOT/$REL"

            echo "Checking: $FILE"

            test -f "$FILE"

            if head -c 200 "$FILE" \
              | grep -q \
                'version https://git-lfs.github.com/spec/v1'
            then

              echo "ERROR: Asset remains an LFS pointer:"
              echo "$FILE"

              exit 1

            fi

          done

          echo "All previously failing bundled assets are real files."

      # ============================================================
      # 19. SAVE SOURCE RESOURCE CACHE
      # ============================================================

      - name: Save source resource cache
        if: steps.source-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            release/datafiles/startup.blend
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
            assets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v5

      # ============================================================
      # 20. SAVE LEGACY ASSET CACHE
      # ============================================================

      - name: Save legacy Blender assets
        if: >-
          steps.asset-layout.outputs.mode == 'submodule' &&
          steps.legacy-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: release/datafiles/assets
          key: blender-assets-${{ steps.asset-layout.outputs.sha }}-v2

      # ============================================================
      # 21. DETERMINE PREBUILT LIB REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -euxo pipefail

          IOS_SHA="$(
            git rev-parse \
              HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse \
              HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "mac_sha=$MAC_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "ios_url=$IOS_URL" \
            >> "$GITHUB_OUTPUT"

          echo "mac_url=$MAC_URL" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # 22. VERIFY LIB PINS
      # ============================================================

      - name: Verify library revisions
        run: |
          set -euxo pipefail

          test \
            "${{ steps.libs.outputs.ios_sha }}" \
            = "$EXPECTED_IOS_LIB_SHA"

          test \
            "${{ steps.libs.outputs.mac_sha }}" \
            = "$EXPECTED_MAC_LIB_SHA"

      # ============================================================
      # 23. RESTORE IOS LIBS
      # ============================================================

      - name: Restore iOS libraries
        id: ios-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 24. FETCH IOS LIBS
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            lfs install \
            --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

      # ============================================================
      # 25. VERIFY IOS LIBS
      # ============================================================

      - name: Verify iOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test "$ACTUAL" = "$EXPECTED_IOS_LIB_SHA"

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

      # ============================================================
      # 26. SAVE IOS LIBS
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 27. RESTORE MAC LIBS
      # ============================================================

      - name: Restore macOS libraries
        id: mac-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 28. FETCH MAC LIBS
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            lfs install \
            --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

      # ============================================================
      # 29. VERIFY MAC LIBS
      # ============================================================

      - name: Verify macOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test "$ACTUAL" = "$EXPECTED_MAC_LIB_SHA"

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print \
              -quit
          )"

          test -n "$HOST_PYTHON"

          echo "Host Python: $HOST_PYTHON"

      # ============================================================
      # 30. SAVE MAC LIBS
      # ============================================================

      - name: Save macOS library cache
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 31. FMT COMPATIBILITY PATCHES
      # ============================================================

      - name: Apply fmt compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re


          # ========================================================
          # PATCH 1
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "BundleKey joins:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: expected exactly 1 "
                  "BundleKey fmt::join; "
                  f"found {count}"
              )

          file1.write_text(
              text.replace(
                  needle,
                  replacement,
                  1,
              )
          )


          # ========================================================
          # PATCH 2
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "Path joins:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: expected exactly 2 "
                  "path fmt::join calls; "
                  f"found {count}"
              )

          file2.write_text(
              text.replace(
                  needle,
                  replacement,
              )
          )


          # ========================================================
          # PATCH 3
          # ========================================================

          file3 = Path(
              "source/blender/geometry/intern/"
              "mesh_bevel.cc"
          )

          text = file3.read_text()

          call = "fmt::println("

          total = text.count(call)

          print(
              "mesh_bevel println calls:",
              total,
          )

          if total < 19:
              raise SystemExit(
                  "ERROR: expected at least 19 "
                  "println calls; "
                  f"found {total}"
              )

          # Empty println => newline.
          text = text.replace(
              "fmt::println();",
              'fmt::print("\\n");',
          )

          remaining = text.count(call)

          if remaining:

              macro = r'''

          /*
           * Compatibility for the older fmt implementation
           * exposed by the iOS dependency set.
           */
          #ifndef BLENDER_FMT_PRINTLN_COMPAT
          #  define BLENDER_FMT_PRINTLN_COMPAT(...) \
            do { \
              fmt::print(__VA_ARGS__); \
              fmt::print("\n"); \
            } while (false)
          #endif

          '''

              includes = list(
                  re.finditer(
                      r"(?m)^#include[^\n]*\n",
                      text,
                  )
              )

              if not includes:
                  raise SystemExit(
                      "ERROR: Could not locate mesh_bevel include block."
                  )

              insert_at = includes[-1].end()

              text = (
                  text[:insert_at]
                  + macro
                  + text[insert_at:]
              )

              text = text.replace(
                  call,
                  "BLENDER_FMT_PRINTLN_COMPAT(",
              )

          file3.write_text(text)


          # ========================================================
          # VERIFY
          # ========================================================

          if 'fmt::join(overridden_keys, ", ")' in file1.read_text():
              raise SystemExit(
                  "ERROR: BundleKey fmt join remains"
              )

          if 'fmt::join(path, "/")' in file2.read_text():
              raise SystemExit(
                  "ERROR: path fmt join remains"
              )

          if "fmt::println(" in file3.read_text():
              raise SystemExit(
                  "ERROR: real fmt::println call remains"
              )

          print(
              "All fmt compatibility patches verified."
          )
          PY

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc \
            > compatibility.patch

          if grep -nF \
            'fmt::println(' \
            source/blender/geometry/intern/mesh_bevel.cc
          then
            echo "ERROR: actual fmt::println call remains."
            exit 1
          fi

      # ============================================================
      # 32. FIX IOS TOUCH COORDINATE OFFSET
      #
      # UITouch / gesture locations are already in UIView logical
      # coordinates.
      #
      # Blender's current iOS window uses logical coordinates too.
      #
      # Remove the extra conversion to Retina/device pixels.
      # ============================================================

      - name: Fix iOS touch coordinate offset
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "intern/ghost/intern/GHOST_WindowIOS.mm"
          )

          text = path.read_text()

          original = text


          # ========================================================
          # A. GESTURE LOCATION
          #
          # Existing recognizers take a UIView point then pass it
          # through scalePointToWindow().
          #
          # Keep the original UIKit point instead.
          # ========================================================

          old = (
              "return window->scalePointToWindow(touch_point);"
          )

          count = text.count(old)

          print(
              "Scaled gesture-point returns:",
              count,
          )

          if count < 1:
              raise SystemExit(
                  "ERROR: Could not find expected "
                  "scalePointToWindow(touch_point) calls."
              )

          text = text.replace(
              old,
              "return touch_point;",
          )


          # ========================================================
          # B. PAN TRANSLATION
          #
          # translationInView is also in local view coordinates.
          # ========================================================

          old = (
              "return window->scalePointToWindow(translation);"
          )

          count = text.count(old)

          print(
              "Scaled gesture translations:",
              count,
          )

          if count >= 1:
              text = text.replace(
                  old,
                  "return translation;",
              )


          # ========================================================
          # C. PINCH POINTS
          #
          # Keep both finger locations in the same logical
          # coordinate space.
          # ========================================================

          for variable in (
              "touch_point0",
              "touch_point1",
          ):

              pattern = re.compile(
                  rf'^[ \t]*{variable}[ \t]*=[ \t]*'
                  rf'window->scalePointToWindow\('
                  rf'{variable}\);[ \t]*$',
                  re.MULTILINE,
              )

              matches = list(
                  pattern.finditer(text)
              )

              print(
                  f"Scaled {variable} assignments:",
                  len(matches),
              )

              if matches:
                  text = pattern.sub(
                      (
                          "    /* UIKit touch location is already "
                          "in the logical view coordinate space. */"
                      ),
                      text,
                  )


          # ========================================================
          # D. RAW UITOUCH LOCATION
          #
          # Replace:
          #
          # CGPoint loc = [touch locationInView:...];
          # CGFloat scale = [... contentScaleFactor];
          # loc.x *= scale;
          # loc.y *= scale;
          # return loc;
          #
          # with the direct UIKit coordinate.
          # ========================================================

          touch_pattern = re.compile(
              r'(- \(CGPoint\)scaledLocationOfTouch:'
              r'\(UITouch \*\)touch\s*'
              r'\{\s*)'
              r'CGPoint\s+loc\s*=\s*'
              r'\[touch\s+locationInView:'
              r'window->getView\(\)\];\s*'
              r'CGFloat\s+scale\s*=\s*'
              r'\[window->getView\(\)\s+'
              r'contentScaleFactor\];\s*'
              r'loc\.x\s*\*=\s*scale;\s*'
              r'loc\.y\s*\*=\s*scale;\s*'
              r'return\s+loc;\s*'
              r'\}',
              re.MULTILINE,
          )

          touch_matches = list(
              touch_pattern.finditer(text)
          )

          print(
              "Raw scaled UITouch helpers:",
              len(touch_matches),
          )

          if len(touch_matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "scaledLocationOfTouch helper with "
                  "contentScaleFactor; found "
                  f"{len(touch_matches)}"
              )

          text = touch_pattern.sub(
              (
                  r'\1'
                  'return [touch '
                  'locationInView:window->getView()];\n'
                  '}'
              ),
              text,
              count=1,
          )


          # ========================================================
          # E. RAW GESTURE LOCATION
          # ========================================================

          gesture_pattern = re.compile(
              r'(- \(CGPoint\)scaledLocationOfGesture:'
              r'\(UIGestureRecognizer \*\)gesture\s*'
              r'\{\s*)'
              r'CGPoint\s+loc\s*=\s*'
              r'\[gesture\s+locationInView:'
              r'window->getView\(\)\];\s*'
              r'CGFloat\s+scale\s*=\s*'
              r'\[window->getView\(\)\s+'
              r'contentScaleFactor\];\s*'
              r'loc\.x\s*\*=\s*scale;\s*'
              r'loc\.y\s*\*=\s*scale;\s*'
              r'return\s+loc;\s*'
              r'\}',
              re.MULTILINE,
          )

          gesture_matches = list(
              gesture_pattern.finditer(text)
          )

          print(
              "Raw scaled gesture helpers:",
              len(gesture_matches),
          )

          if len(gesture_matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "scaledLocationOfGesture helper with "
                  "contentScaleFactor; found "
                  f"{len(gesture_matches)}"
              )

          text = gesture_pattern.sub(
              (
                  r'\1'
                  'return [gesture '
                  'locationInView:window->getView()];\n'
                  '}'
              ),
              text,
              count=1,
          )


          # ========================================================
          # VERIFY PATCH ACTUALLY CHANGED SOURCE
          # ========================================================

          if text == original:
              raise SystemExit(
                  "ERROR: Touch patch made no changes."
              )

          path.write_text(text)

          patched = path.read_text()


          # ========================================================
          # VERIFY THE TOUCH-SPECIFIC DOUBLE-SCALING IS GONE
          # ========================================================

          forbidden = [
              (
                  "return window->"
                  "scalePointToWindow(touch_point);"
              ),
              (
                  "return window->"
                  "scalePointToWindow(translation);"
              ),
              (
                  "touch_point0 = window->"
                  "scalePointToWindow(touch_point0);"
              ),
              (
                  "touch_point1 = window->"
                  "scalePointToWindow(touch_point1);"
              ),
          ]

          for item in forbidden:

              if item in patched:
                  raise SystemExit(
                      "ERROR: touch coordinate scaling remains: "
                      + item
                  )


          # ========================================================
          # CHECK RAW TOUCH HELPERS
          # ========================================================

          helper_start = patched.find(
              "- (CGPoint)scaledLocationOfTouch:"
          )

          if helper_start < 0:
              raise SystemExit(
                  "ERROR: scaledLocationOfTouch helper vanished."
              )

          helper_end = patched.find(
              "- (void)",
              helper_start,
          )

          if helper_end < 0:
              helper_end = min(
                  len(patched),
                  helper_start + 3000,
              )

          touch_helper = patched[
              helper_start:helper_end
          ]

          if "contentScaleFactor" in touch_helper:
              raise SystemExit(
                  "ERROR: contentScaleFactor remains "
                  "inside scaledLocationOfTouch."
              )


          gesture_start = patched.find(
              "- (CGPoint)scaledLocationOfGesture:"
          )

          if gesture_start < 0:
              raise SystemExit(
                  "ERROR: scaledLocationOfGesture helper vanished."
              )

          gesture_end = patched.find(
              "- (void)",
              gesture_start,
          )

          if gesture_end < 0:
              gesture_end = min(
                  len(patched),
                  gesture_start + 3000,
              )

          gesture_helper = patched[
              gesture_start:gesture_end
          ]

          if "contentScaleFactor" in gesture_helper:
              raise SystemExit(
                  "ERROR: contentScaleFactor remains "
                  "inside scaledLocationOfGesture."
              )

          print()
          print(
              "iOS logical touch-coordinate patch verified."
          )
          PY

          echo
          echo "========================================"
          echo "TOUCH COORDINATE DIFF"
          echo "========================================"

          git diff -- \
            intern/ghost/intern/GHOST_WindowIOS.mm

          git diff -- \
            intern/ghost/intern/GHOST_WindowIOS.mm \
            > touch-coordinates.patch

      # ============================================================
      # 33. VERIFY MODERN UIKIT SOURCE
      # ============================================================

      - name: Verify modern UIKit source
        run: |
          set -euxo pipefail

          grep -RIn \
            '\.effectiveGeometry\.coordinateSpace' \
            intern/ghost/intern \
            --include='GHOST_*IOS.mm' \
            | tee modern-uikit-calls.txt

          test -s \
            modern-uikit-calls.txt

      # ============================================================
      # 34. RESTORE XCODE BUILD CACHE
      #
      # DO NOT change fast-v3.
      # ============================================================

      - name: Restore incremental Xcode build
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-

      # ============================================================
      # 35. INSPECT CACHE
      # ============================================================

      - name: Inspect incremental build cache
        run: |
          set -euxo pipefail

          echo "Exact cache hit:"
          echo "${{ steps.build-cache.outputs.cache-hit }}"

          if [ -d "$GITHUB_WORKSPACE/build_ios" ]; then

            du -sh \
              "$GITHUB_WORKSPACE/build_ios" \
              || true

          fi

          if [ -d "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" ]; then

            du -sh \
              "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
              || true

          fi

      # ============================================================
      # 36. CONFIGURE
      #
      # DO NOT DELETE build_ios.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DWITH_GPU_BACKEND_TESTS=OFF \
            -DWITH_GPU_COMPOSITOR_TESTS=OFF \
            -DWITH_GPU_DRAW_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 37. VERIFY CONFIG
      # ============================================================

      - name: Verify configuration
        run: |
          set -euxo pipefail

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_GTESTS:|WITH_TESTS_BATCHED:|WITH_METAL_BACKEND:|CMAKE_OSX_DEPLOYMENT_TARGET:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep \
              '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep \
              '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          test "$CYCLES" = "OFF"
          test "$PYTHON" = "ON"

      # ============================================================
      # 38. FINAL RESOURCE CHECK
      # ============================================================

      - name: Final pre-build resource check
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path("release/datafiles"),
              Path("scripts"),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  os.environ[
                      "BUNDLED_ASSETS_SOURCE"
                  ]
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []
          seen = set()

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  try:
                      resolved = path.resolve()
                  except OSError:
                      resolved = path

                  if resolved in seen:
                      continue

                  seen.add(resolved)

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:

              print(
                  "ERROR: source resources still contain "
                  "Git LFS pointers:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Pre-build resource check passed."
          )
          PY

      # ============================================================
      # 39. BUILD
      # ============================================================

      - name: Build Blender
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          xcodebuild -version

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:|actool|CompileAssetCatalog|AppIcon|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            grep -n -C 25 \
              -E \
              'fmt::|println|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            grep -n -C 25 \
              -E \
              'GHOST_.*IOS|UIWindowScene|effectiveGeometry|coordinateSpace|contentScaleFactor|scalePointToWindow|locationInView|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            grep -n -C 30 \
              -E \
              'actool|Assets.xcassets|AppIcon|CompileAssetCatalog|asset catalog|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > asset-errors.txt \
              || true

            grep -n -C 30 \
              -E \
              'Undefined symbols|duplicate symbol|library not found|framework not found|ld: |clang: error: linker' \
              xcodebuild.log \
              > linker-errors.txt \
              || true

            grep -n -A 180 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            echo
            echo "===== MAIN ERRORS ====="
            cat compiler-errors.txt || true

            echo
            echo "===== IOS ERRORS ====="
            cat ios-errors.txt || true

            echo
            echo "===== FMT ERRORS ====="
            cat fmt-errors.txt || true

            echo
            echo "===== ASSET ERRORS ====="
            cat asset-errors.txt || true

            echo
            echo "===== LINKER ERRORS ====="
            cat linker-errors.txt || true

            echo
            echo "===== FAILED COMMANDS ====="
            cat failed-commands.txt || true

            echo
            echo "===== LAST 700 LINES ====="
            tail -700 xcodebuild.log || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 xcodebuild.log

      # ============================================================
      # 40. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              \( \
                -name 'Blender.app' \
                -o \
                -name 'blender.app' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Blender.app not found."

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "Blender.app:"
          echo "$APP"

          du -sh "$APP"

      # ============================================================
      # 41. REPAIR CACHED RESOURCE COPIES
      # ============================================================

      - name: Repair and verify packaged app resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil

          app = Path(
              os.environ["APP"]
          )

          asset_source = Path(
              os.environ[
                  "BUNDLED_ASSETS_SOURCE"
              ]
          )

          base = (
              app
              / "Assets"
              / "5.2"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          def is_pointer(path):
              try:
                  return (
                      path.read_bytes()[:200]
                      .startswith(magic)
                  )
              except OSError:
                  return False

          pointers = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          print(
              "Pointers initially found inside Blender.app:",
              len(pointers),
          )

          repaired = 0

          for destination in pointers:

              try:
                  relative = destination.relative_to(
                      base
                  )
              except ValueError:

                  print(
                      "Cannot map pointer outside Assets/5.2:",
                      destination,
                  )

                  continue

              parts = relative.parts

              if not parts:
                  continue

              source = None

              # datafiles/assets/foo -> bundled assets source/foo
              if (
                  len(parts) >= 2
                  and parts[0] == "datafiles"
                  and parts[1] == "assets"
              ):

                  source = (
                      asset_source
                      / Path(
                          *parts[2:]
                      )
                  )

              # other datafiles/foo -> release/datafiles/foo
              elif parts[0] == "datafiles":

                  source = (
                      Path("release")
                      / relative
                  )

              # scripts/foo -> scripts/foo
              elif parts[0] == "scripts":

                  source = Path(
                      *parts
                  )

              else:

                  print(
                      "Unknown packaged mapping:",
                      destination,
                  )

                  continue

              if not source.is_file():

                  print(
                      "Mapped source does not exist:"
                  )

                  print(
                      "  destination:",
                      destination,
                  )

                  print(
                      "  source:     ",
                      source,
                  )

                  continue

              if is_pointer(source):

                  print(
                      "Mapped source remains a pointer:",
                      source,
                  )

                  continue

              print(
                  "Repairing:"
              )

              print(
                  "  destination:",
                  destination,
              )

              print(
                  "  source:     ",
                  source,
              )

              shutil.copy2(
                  source,
                  destination,
              )

              repaired += 1

          print(
              "Repaired stale packaged resources:",
              repaired,
          )

          remaining = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          if remaining:

              print(
                  "ERROR: unresolved Git LFS pointers "
                  "remain in Blender.app:"
              )

              for path in remaining:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Blender.app contains no Git LFS pointers."
          )
          PY

      # ============================================================
      # 42. VERIFY EXECUTABLE
      #
      # No BSD-incompatible "find -maxdepth".
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -euxo pipefail

          test -f \
            "$APP/Info.plist"

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          elif [ -f "$APP/blender" ]
          then

            EXEC_NAME="blender"
            EXECUTABLE="$APP/blender"

          else

            echo "ERROR: Blender executable not found."

            echo
            echo "Files in app bundle:"

            find \
              "$APP" \
              -type f \
              -print \
              | head -100 \
              || true

            exit 1
          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          file "$EXECUTABLE"

          lipo \
            -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 43. FINAL APP POINTER SCAN
      # ============================================================

      - name: Final Blender.app validation
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          app = Path(
              os.environ["APP"]
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in app.rglob("*"):

              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:

              print(
                  "ERROR: Git LFS pointers remain in final app:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Final Blender.app validation passed."
          )
          PY

      # ============================================================
      # 44. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          (
            cd package

            zip \
              -qry \
              -y \
              ../Blender-5.2-iPad-Xcode26-TouchFix.ipa \
              Payload
          )

          test -f \
            Blender-5.2-iPad-Xcode26-TouchFix.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Xcode26-TouchFix.ipa

      # ============================================================
      # 45. BUILD INFO
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "Xcode:"
            xcodebuild -version \
              2>/dev/null \
              || true
            echo

            echo "iPhoneOS SDK:"
            xcrun \
              --sdk iphoneos \
              --show-sdk-version \
              2>/dev/null \
              || true
            echo

            echo "Deployment target:"
            echo "$IOS_DEPLOYMENT_TARGET"
            echo

            echo "Bundled asset source:"
            echo "${BUNDLED_ASSETS_SOURCE:-unknown}"
            echo

            echo "Build options:"
            echo "WITH_PYTHON=ON"
            echo "WITH_CYCLES=OFF"
            echo "WITH_GTESTS=OFF"
            echo "WITH_TESTS_BATCHED=OFF"
            echo

            echo "Compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path fmt::join"
            echo "legacy fmt println compatibility"
            echo

            echo "iOS input fixes:"
            echo "logical UIKit touch coordinates"
            echo "removed touch contentScaleFactor conversion"
            echo "removed gesture scalePointToWindow conversion"
            echo "logical pan and pinch coordinates"
            echo

            echo "UIKit compatibility patches:"
            echo "NONE"
            echo

            echo "UIKit API:"
            echo "effectiveGeometry.coordinateSpace"
            echo

            echo "Resource handling:"
            echo "release/datafiles LFS materialization"
            echo "scripts LFS materialization"
            echo "bundled assets LFS materialization"
            echo "dead AppIcon LFS replacement"
            echo "post-build stale-resource repair"
            echo "final app LFS scan"
            echo

            echo "Speed features:"
            echo "source resource cache"
            echo "iOS library cache"
            echo "macOS library cache"
            echo "partial Xcode build cache"
            echo "failed partial builds saved"
            echo "source timestamp normalization"
            echo "index store disabled"
            echo "debug symbols disabled"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 46. BUILD CACHE SIZE
      # ============================================================

      - name: Show incremental build size
        if: always()
        run: |
          echo "===== build_ios ====="

          du -sh \
            "$GITHUB_WORKSPACE/build_ios" \
            2>/dev/null \
            || true

          echo
          echo "===== host tools ====="

          du -sh \
            "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
            2>/dev/null \
            || true

      # ============================================================
      # 47. SAVE PARTIAL/COMPLETE BUILD CACHE
      #
      # fast-v3 remains unchanged.
      # ============================================================

      - name: Save incremental Xcode build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}

      # ============================================================
      # 48. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Xcode26-TouchFix
          path: |
            Blender-5.2-iPad-Xcode26-TouchFix.ipa
            build-revision.txt
            compatibility.patch
            touch-coordinates.patch
            modern-uikit-calls.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 49. UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-xcode26-touchfix-logs
          path: |
            build-revision.txt
            compatibility.patch
            touch-coordinates.patch
            modern-uikit-calls.txt
            source-lfs.log
            blender-assets-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            asset-errors.txt
            linker-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
