name: Inspect Blender iOS Keyboard

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Blender iOS source
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Show iOS keyboard code
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================================"
          echo "ALL KEYBOARD REFERENCES"
          echo "================================================"

          grep -RIn -E \
            'popupOnscreenKeyboard|hideOnscreenKeyboard|popupOnScreenKeyboard|hideOnScreenKeyboard|UITextField|UIKeyInput|insertText|deleteBackward|text_field_string|getLastKeyboardString|getKeyboardInput' \
            intern/ghost/intern \
            || true

          echo
          echo "================================================"
          echo "GHOST_WindowIOS.hh"
          echo "================================================"

          cat intern/ghost/intern/GHOST_WindowIOS.hh

          echo
          echo "================================================"
          echo "GHOST_WindowIOS.mm RELEVANT SECTIONS"
          echo "================================================"

          grep -n -A120 -B80 \
            -E \
            'GHOSTUIWindow|popupOnscreenKeyboard|hideOnscreenKeyboard|UITextField|UIKeyInput|insertText|deleteBackward|text_field_string' \
            intern/ghost/intern/GHOST_WindowIOS.mm \
            || true

          echo
          echo "================================================"
          echo "GHOST_SystemIOS.mm KEYBOARD SECTIONS"
          echo "================================================"

          grep -n -A100 -B60 \
            -E \
            'popupOnScreenKeyboard|hideOnScreenKeyboard|getKeyboardInput|Keyboard' \
            intern/ghost/intern/GHOST_SystemIOS.mm \
            || true
