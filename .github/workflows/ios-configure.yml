- name: Patch Blender 5.2 BundleKey fmt compatibility
  run: |
    set -euxo pipefail

    python3 <<'PY'
    from pathlib import Path

    # ============================================================
    # 1. Join Bundle node error message
    # ============================================================

    p = Path(
        "source/blender/nodes/geometry/nodes/"
        "node_geo_join_bundle.cc"
    )

    text = p.read_text()

    old = '''    std::string message = fmt::format(
        "{}: {}", TIP_("Duplicate keys"), fmt::join(overridden_keys, ", "));'''

    new = '''    std::string duplicate_keys;
    for (const BundleKey &key : overridden_keys) {
      if (!duplicate_keys.empty()) {
        duplicate_keys += ", ";
      }
      const auto key_ref = key.ustr().ref();
      duplicate_keys.append(key_ref.data(), key_ref.size());
    }

    std::string message = fmt::format(
        "{}: {}", TIP_("Duplicate keys"), duplicate_keys);'''

    if old not in text:
        raise SystemExit(
            "ERROR: expected node_geo_join_bundle.cc code not found"
        )

    text = text.replace(old, new, 1)
    p.write_text(text)

    print("Patched:", p)

    # ============================================================
    # 2. Bundle path formatting
    #
    # This is the second BundleKey fmt::join incompatibility we
    # already encountered in an earlier build.
    # ============================================================

    p = Path(
        "source/blender/nodes/intern/"
        "geometry_nodes_bundle.cc"
    )

    text = p.read_text()

    old = '''  return fmt::format("{}", fmt::join(path, "/"));'''

    new = '''  std::string result;
  for (const BundleKey &key : path) {
    if (!result.empty()) {
      result += '/';
    }
    const auto key_ref = key.ustr().ref();
    result.append(key_ref.data(), key_ref.size());
  }
  return result;'''

    if old not in text:
        raise SystemExit(
            "ERROR: expected geometry_nodes_bundle.cc code not found"
        )

    text = text.replace(old, new, 1)
    p.write_text(text)

    print("Patched:", p)
    PY

    echo
    echo "===== Verify problematic joins are gone ====="

    if grep -RIn \
      'fmt::join(overridden_keys' \
      source/blender/nodes
    then
      echo "ERROR: overridden_keys fmt::join still exists"
      exit 1
    fi

    if grep -RIn \
      'fmt::join(path, "/")' \
      source/blender/nodes
    then
      echo "ERROR: BundleKey path fmt::join still exists"
      exit 1
    fi

    echo
    echo "===== Patch ====="

    git diff -- \
      source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
      source/blender/nodes/intern/geometry_nodes_bundle.cc
