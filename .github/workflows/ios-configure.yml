      # ============================================================
      # 23. APPLY FMT COMPATIBILITY FIXES
      #
      # Fix 1:
      #   fmt::join(BundleKey)
      #
      # Fix 2:
      #   fmt::join(path) with StringRef / BundleKey
      #
      # Fix 3:
      #   Old iOS fmt has fmt::print but no fmt::println.
      #
      # No replacement fmt headers.
      # No UIKit changes.
      # ============================================================

      - name: Apply fmt compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path


          # ========================================================
          # PATCH 1
          #
          # node_geo_join_bundle.cc
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "overridden_keys fmt::join occurrences:",
              count,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: expected exactly 1 "
                  "overridden_keys fmt::join; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
              1,
          )

          file1.write_text(text)


          # ========================================================
          # PATCH 2
          #
          # geometry_nodes_bundle.cc
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(needle)

          print(
              "path fmt::join occurrences:",
              count,
          )

          if count != 2:
              raise SystemExit(
                  "ERROR: expected exactly 2 "
                  "path fmt::join expressions; "
                  f"found {count}"
              )

          text = text.replace(
              needle,
              replacement,
          )

          file2.write_text(text)


          # ========================================================
          # PATCH 3
          #
          # mesh_bevel.cc
          #
          # The prebuilt iOS dependency set exposes an older fmt
          # version which has fmt::print but not fmt::println.
          #
          # Do NOT simply change println -> print, because that would
          # remove the newline.
          #
          # Instead:
          #
          #   fmt::println(...)
          #
          # becomes:
          #
          #   BLENDER_FMT_PRINTLN_COMPAT(...)
          #
          # which executes:
          #
          #   fmt::print(...);
          #   fmt::print("\\n");
          #
          # This preserves the intended output semantics.
          # ========================================================

          file3 = Path(
              "source/blender/geometry/intern/"
              "mesh_bevel.cc"
          )

          text = file3.read_text()

          println_needle = "fmt::println("

          println_count = text.count(
              println_needle
          )

          print()
          print(
              "mesh_bevel.cc fmt::println occurrences:",
              println_count,
          )

          # Compiler already reached at least 19 distinct println
          # calls before hitting clang's error limit.
          if println_count < 19:
              raise SystemExit(
                  "ERROR: expected at least 19 "
                  "fmt::println calls in mesh_bevel.cc; "
                  f"found {println_count}"
              )

          compat_macro = r'''
          /*
           * iOS dependency compatibility:
           *
           * The bundled fmt predates fmt::println.
           * Keep println semantics using the older fmt::print API.
           */
          #ifndef BLENDER_FMT_PRINTLN_COMPAT
          #  define BLENDER_FMT_PRINTLN_COMPAT(...) \
            do { \
              fmt::print(__VA_ARGS__); \
              fmt::print("\n"); \
            } while (false)
          #endif
          '''

          # Put the macro after fmt/format.h if possible.
          include_needle = "#include <fmt/format.h>"

          include_count = text.count(
              include_needle
          )

          print(
              "mesh_bevel.cc fmt header occurrences:",
              include_count,
          )

          if include_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "#include <fmt/format.h>; "
                  f"found {include_count}"
              )

          text = text.replace(
              include_needle,
              include_needle + "\n" + compat_macro,
              1,
          )

          text = text.replace(
              println_needle,
              "BLENDER_FMT_PRINTLN_COMPAT(",
          )

          file3.write_text(text)


          # ========================================================
          # VERIFY ALL THREE FIXES
          # ========================================================

          print()
          print(
              "========================================"
          )
          print(
              "VERIFY COMPATIBILITY PATCHES"
          )
          print(
              "========================================"
          )

          if (
              'fmt::join(overridden_keys, ", ")'
              in file1.read_text()
          ):
              raise SystemExit(
                  "ERROR: overridden_keys fmt::join remains"
              )

          if (
              'fmt::join(path, "/")'
              in file2.read_text()
          ):
              raise SystemExit(
                  "ERROR: path fmt::join remains"
              )

          patched3 = file3.read_text()

          remaining_println = patched3.count(
              "fmt::println("
          )

          compat_calls = patched3.count(
              "BLENDER_FMT_PRINTLN_COMPAT("
          )

          print(
              "Remaining fmt::println:",
              remaining_println,
          )

          print(
              "Compatibility println calls:",
              compat_calls,
          )

          if remaining_println != 0:
              raise SystemExit(
                  "ERROR: fmt::println remains "
                  "in mesh_bevel.cc"
              )

          # +1 because the macro definition itself contains
          # BLENDER_FMT_PRINTLN_COMPAT(
          if compat_calls < println_count:
              raise SystemExit(
                  "ERROR: not all println calls "
                  "were converted"
              )

          print()
          print(
              "All fmt compatibility fixes verified."
          )
          PY

          echo
          echo "========================================"
          echo "COMPATIBILITY DIFF"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc \
            > compatibility.patch

          echo
          echo "===== Check for remaining mesh bevel println ====="

          if grep -n \
            'fmt::println' \
            source/blender/geometry/intern/mesh_bevel.cc
          then
            echo "ERROR: fmt::println still remains"
            exit 1
          fi

          echo "mesh_bevel fmt::println compatibility fix applied."
