name: Baseline Salmazov iOS Build

on:
  workflow_dispatch:

concurrency:
  group: baseline-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Untouched Salmazov ios-new
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT EXACTLY SALMAZOV IOS-NEW
      #
      # No TouchView.
      # No source patches.
      # No fmt changes.
      # ============================================================

      - name: Checkout ios-new
        uses: actions/checkout@v4
        with:
          ref: ios-new
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # 2. VERIFY WE REALLY HAVE CLEAN IOS-NEW
      # ============================================================

      - name: Verify clean source
        run: |
          set -eux

          echo "===== Branch ====="
          git branch --show-current

          echo "===== Commit ====="
          git rev-parse HEAD

          echo "===== Working tree ====="
          git status --short

          test -z "$(git status --porcelain)"

      # ============================================================
      # 3. MACOS / XCODE ENVIRONMENT
      # ============================================================

      - name: Environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "===== macOS ====="
          sw_vers

          echo "===== CPU ====="
          uname -m

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== Disk ====="
          df -h

          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: Expected an Apple Silicon runner."
            exit 1
          fi

      # ============================================================
      # 4. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 5. TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version

      # ============================================================
      # 6. FETCH startup.blend FROM OFFICIAL BLENDER LFS
      #
      # This only materializes the LFS file already referenced by
      # the source tree. It does not patch Blender source.
      # ============================================================

      - name: Fetch startup.blend
        run: |
          set -euxo pipefail

          git remote add blender-upstream \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url blender-upstream \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-upstream \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f release/datafiles/startup.blend

          SIZE="$(stat -f '%z' release/datafiles/startup.blend)"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer."
            exit 1
          fi

      # ============================================================
      # 7. READ EXACT LIBRARY COMMITS FROM SALMAZOV'S TREE
      # ============================================================

      - name: Determine pinned library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(git rev-parse HEAD:lib/ios_arm64)"
          MAC_SHA="$(git rev-parse HEAD:lib/macos_arm64)"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac_sha=$MAC_SHA" >> "$GITHUB_OUTPUT"
          echo "ios_url=$IOS_URL" >> "$GITHUB_OUTPUT"
          echo "mac_url=$MAC_URL" >> "$GITHUB_OUTPUT"

          echo "===== iOS ====="
          echo "URL: $IOS_URL"
          echo "SHA: $IOS_SHA"

          echo "===== macOS ====="
          echo "URL: $MAC_URL"
          echo "SHA: $MAC_SHA"

      # ============================================================
      # 8. RESTORE PREBUILT LIBRARY CACHES
      # ============================================================

      - name: Restore iOS libraries
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: lib/ios_arm64
          key: baseline-ios-${{ steps.libs.outputs.ios_sha }}

      - name: Restore macOS libraries
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: lib/macos_arm64
          key: baseline-macos-${{ steps.libs.outputs.mac_sha }}

      # ============================================================
      # 9. FETCH EXACT IOS LIBRARY GITLINK
      #
      # Clone directly instead of modifying Salmazov's .gitmodules.
      # ============================================================

      - name: Fetch exact iOS libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 fetch \
            --depth 1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout --detach FETCH_HEAD

          echo "===== Exact iOS commit ====="
          git -C lib/ios_arm64 rev-parse HEAD

          test "$(
            git -C lib/ios_arm64 rev-parse HEAD
          )" = "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh lib/ios_arm64

      # ============================================================
      # 10. FETCH EXACT MACOS HOST LIBRARY GITLINK
      # ============================================================

      - name: Fetch exact macOS libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 fetch \
            --depth 1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout --detach FETCH_HEAD

          echo "===== Exact macOS commit ====="
          git -C lib/macos_arm64 rev-parse HEAD

          test "$(
            git -C lib/macos_arm64 rev-parse HEAD
          )" = "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh lib/macos_arm64

      # ============================================================
      # 11. VERIFY THE DEPENDENCIES SALMAZOV'S SCRIPT EXPECTS
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: host Python missing."
            exit 1
          fi

          echo "===== iOS Python ====="
          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "===== Host Python ====="
          echo "$HOST_PYTHON"

          echo "===== Dependency sizes ====="
          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 12. SAVE LIBRARY CACHES
      # ============================================================

      - name: Save iOS libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lib/ios_arm64
          key: baseline-ios-${{ steps.libs.outputs.ios_sha }}

      - name: Save macOS libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lib/macos_arm64
          key: baseline-macos-${{ steps.libs.outputs.mac_sha }}

      # ============================================================
      # 13. CHECK THAT WE HAVE NOT PATCHED BLENDER SOURCE
      #
      # startup.blend is expected to differ because LFS materialized
      # it. Ignore that one path when checking.
      # ============================================================

      - name: Verify source is untouched
        run: |
          set -eux

          CHANGED="$(
            git status \
              --porcelain \
              --untracked-files=no \
              | grep -v 'release/datafiles/startup.blend' \
              || true
          )"

          if [ -n "$CHANGED" ]; then
            echo "ERROR: Blender source was modified:"
            echo "$CHANGED"
            exit 1
          fi

          echo "No Blender source patches present."

      # ============================================================
      # 14. CONFIGURE EXACTLY LIKE setup_ios.sh
      #
      # NO:
      #
      # WITH_CYCLES=OFF
      # WITH_AUDASPACE=OFF
      # WITH_PYTHON=...
      # fmt overrides
      # TouchView
      # source patches
      #
      # These are Salmazov's actual configure arguments.
      # ============================================================

      - name: Configure untouched Salmazov build
        run: |
          set -euxo pipefail

          rm -rf build_ios
          mkdir -p build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun --sdk iphoneos --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          cd build_ios

          cmake \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            "$GITHUB_WORKSPACE" \
            2>&1 | tee "$GITHUB_WORKSPACE/configure.log"

      # ============================================================
      # 15. SHOW CONFIGURATION
      #
      # This is useful because we are intentionally NOT forcing any
      # Blender feature flags.
      # ============================================================

      - name: Show baseline configuration
        run: |
          echo "===== Relevant defaults ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_AUDASPACE:|WITH_INSTALL_PORTABLE:|APPLE_TARGET_DEVICE:' \
            build_ios/CMakeCache.txt \
            || true

          echo
          echo "===== Xcode schemes/targets ====="

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # 16. BUILD EXACTLY THE BLENDER SCHEME
      #
      # Salmazov's setup_ios.sh uses:
      #
      # xcodebuild
      #   -project Blender.xcodeproj
      #   -scheme blender
      #   -configuration Release
      #   -sdk iphoneos
      #   build
      #
      # The only extra arguments below disable signing so CI can
      # compile without an Apple developer certificate.
      # ============================================================

      - name: Build untouched Salmazov Blender
        run: |
          set -o pipefail

          NCPU="$(sysctl -n hw.ncpu)"

          echo "Using $NCPU jobs"

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -jobs "$NCPU" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "================================================"
            echo "       UNTOUCHED IOS-NEW BUILD FAILED"
            echo "================================================"
            echo

            grep -n -C 15 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            echo "===== Compiler/linker errors ====="
            cat compiler-errors.txt

            echo
            echo "===== Failed commands ====="

            grep -n -A 100 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat failed-commands.txt

            echo
            echo "===== Last 250 lines ====="

            tail -250 xcodebuild.log

            exit "$STATUS"
          fi

          echo
          echo "================================================"
          echo "       UNTOUCHED IOS-NEW BUILD SUCCEEDED"
          echo "================================================"

          tail -80 xcodebuild.log

      # ============================================================
      # 17. FIND RESULTING BLENDER.APP
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              -name 'Blender.app' \
              -print -quit
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Build succeeded but Blender.app wasn't found."

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "===== Blender.app ====="
          echo "$APP"

          du -sh "$APP"

      # ============================================================
      # 18. VERIFY EXECUTABLE
      # ============================================================

      - name: Verify built application
        run: |
          set -eux

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          echo "Bundle executable: $EXEC_NAME"

          if [ -n "$EXEC_NAME" ]; then
            file "$APP/$EXEC_NAME"
            lipo -info "$APP/$EXEC_NAME" || true
          fi

      # ============================================================
      # 19. PACKAGE UNMODIFIED APP AS IPA
      #
      # This does not modify Blender.app.
      # It only wraps it in the standard Payload structure.
      # ============================================================

      - name: Package baseline IPA
        run: |
          set -eux

          rm -rf package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Salmazov-ios-new-baseline.ipa \
            Payload

          cd ..

          ls -lh \
            Salmazov-ios-new-baseline.ipa

      # ============================================================
      # 20. UPLOAD BASELINE IPA
      # ============================================================

      - name: Upload baseline IPA
        uses: actions/upload-artifact@v4
        with:
          name: Salmazov-ios-new-baseline
          path: Salmazov-ios-new-baseline.ipa
          retention-days: 30

      # ============================================================
      # 21. ALWAYS UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Salmazov-ios-new-baseline-logs
          path: |
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
