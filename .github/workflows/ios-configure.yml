name: Build Blender iOS - Fixed

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-fixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT SALMAZOV IOS-NEW
      # ============================================================

      - name: Checkout Salmazov ios-new
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: ios-new
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. PIN EXACT SOURCE COMMIT
      #
      # Exact commit from our last build:
      # 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
      # ============================================================

      - name: Checkout exact Blender source commit
        run: |
          set -euxo pipefail

          EXPECTED="1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6"

          git fetch \
            origin \
            "$EXPECTED" \
            --depth=1

          git checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git log -1 --oneline

      # ============================================================
      # 3. ENVIRONMENT
      # ============================================================

      - name: Show environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== CPU ====="
          uname -m

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "===== Git ====="
          git --version

          echo
          echo "===== Source commit ====="
          git rev-parse HEAD

          echo
          echo "===== Disk ====="
          df -h

      # ============================================================
      # 4. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 5. INSTALL BUILD TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          brew install cmake git-lfs

          git lfs install

          echo "===== CMake ====="
          cmake --version

          echo
          echo "===== Git LFS ====="
          git lfs version

          echo
          echo "===== Python ====="
          python3 --version

      # ============================================================
      # 6. FETCH startup.blend
      # ============================================================

      - name: Fetch Blender startup.blend
        run: |
          set -euxo pipefail

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config lfs.remote.searchall true

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f \
            release/datafiles/startup.blend

          SIZE="$(
            stat -f '%z' \
              release/datafiles/startup.blend
          )"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer"
            exit 1
          fi

          file \
            release/datafiles/startup.blend

      # ============================================================
      # 7. DETERMINE PINNED LIBRARY COMMITS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(
            git rev-parse HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac_sha=$MAC_SHA" >> "$GITHUB_OUTPUT"
          echo "ios_url=$IOS_URL" >> "$GITHUB_OUTPUT"
          echo "mac_url=$MAC_URL" >> "$GITHUB_OUTPUT"

          echo
          echo "===== iOS libraries ====="
          echo "$IOS_URL"
          echo "$IOS_SHA"

          echo
          echo "===== macOS libraries ====="
          echo "$MAC_URL"
          echo "$MAC_SHA"

      # ============================================================
      # 8. VERIFY LIBRARY COMMITS
      #
      # These are the exact revisions from our last run.
      # ============================================================

      - name: Verify expected library revisions
        run: |
          set -eux

          EXPECTED_IOS="393201c7c8525941553f6a96e19b909d6b3bfc4f"
          EXPECTED_MAC="a3e20428fb0ab2231903608cdca90301e130dbfc"

          ACTUAL_IOS="${{ steps.libs.outputs.ios_sha }}"
          ACTUAL_MAC="${{ steps.libs.outputs.mac_sha }}"

          echo "iOS expected: $EXPECTED_IOS"
          echo "iOS actual:   $ACTUAL_IOS"

          echo
          echo "macOS expected: $EXPECTED_MAC"
          echo "macOS actual:   $ACTUAL_MAC"

          test "$ACTUAL_IOS" = "$EXPECTED_IOS"
          test "$ACTUAL_MAC" = "$EXPECTED_MAC"

      # ============================================================
      # 9. CACHE IOS LIBRARIES
      # ============================================================

      - name: Cache iOS libraries
        id: ios-cache
        uses: actions/cache@v5
        with:
          path: lib/ios_arm64
          key: blender-ios-arm64-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 10. CACHE MACOS LIBRARIES
      # ============================================================

      - name: Cache macOS libraries
        id: mac-cache
        uses: actions/cache@v5
        with:
          path: lib/macos_arm64
          key: blender-macos-arm64-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 11. FETCH IOS LIBRARIES
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.ios_sha }}"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh lib/ios_arm64

      # ============================================================
      # 12. FETCH MACOS LIBRARIES
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.mac_sha }}"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh lib/macos_arm64

      # ============================================================
      # 13. VERIFY LIBRARIES
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          IOS_ACTUAL="$(
            git -C lib/ios_arm64 rev-parse HEAD
          )"

          MAC_ACTUAL="$(
            git -C lib/macos_arm64 rev-parse HEAD
          )"

          test "$IOS_ACTUAL" = \
            "${{ steps.libs.outputs.ios_sha }}"

          test "$MAC_ACTUAL" = \
            "${{ steps.libs.outputs.mac_sha }}"

          echo "===== iOS Python ====="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo
          echo "===== macOS host Python ====="

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: host Python missing"
            exit 1
          fi

          echo "$HOST_PYTHON"

          echo
          echo "===== Library sizes ====="

          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 14. PATCH BundleKey / OLD FMT COMPATIBILITY
      #
      # Expected in this exact source revision:
      #
      # node_geo_join_bundle.cc:
      #   1 x fmt::join(overridden_keys, ", ")
      #
      # geometry_nodes_bundle.cc:
      #   2 x fmt::join(path, "/")
      #
      # ALL THREE are patched.
      #
      # fmt itself is NOT replaced.
      # OpenImageIO is NOT modified.
      # ============================================================

      - name: Patch BundleKey formatting
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ========================================================
          # node_geo_join_bundle.cc
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle1 = 'fmt::join(overridden_keys, ", ")'

          replacement1 = '''[&]() {
                std::string result;
                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref = key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count1 = text.count(needle1)

          print(
              "node_geo_join_bundle.cc occurrences:",
              count1,
          )

          if count1 != 1:
              raise SystemExit(
                  "ERROR: Expected exactly 1 "
                  "fmt::join(overridden_keys, \", \")"
              )

          text = text.replace(
              needle1,
              replacement1,
          )

          file1.write_text(text)

          print(
              "Patched:",
              file1,
          )

          # ========================================================
          # geometry_nodes_bundle.cc
          #
          # IMPORTANT:
          # This exact revision contains TWO occurrences.
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle2 = 'fmt::join(path, "/")'

          replacement2 = '''[&]() {
                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  const auto key_ref = key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count2 = text.count(needle2)

          print(
              "geometry_nodes_bundle.cc occurrences:",
              count2,
          )

          if count2 != 2:
              raise SystemExit(
                  "ERROR: Expected exactly 2 "
                  "fmt::join(path, \"/\") expressions, "
                  f"found {count2}"
              )

          text = text.replace(
              needle2,
              replacement2,
          )

          file2.write_text(text)

          print(
              "Patched all",
              count2,
              "occurrences in:",
              file2,
          )

          # ========================================================
          # VERIFY
          # ========================================================

          remaining1 = (
              file1.read_text().count(needle1)
          )

          remaining2 = (
              file2.read_text().count(needle2)
          )

          print()
          print(
              "Remaining overridden_keys joins:",
              remaining1,
          )

          print(
              "Remaining path joins:",
              remaining2,
          )

          if remaining1 != 0:
              raise SystemExit(
                  "ERROR: overridden_keys join remains"
              )

          if remaining2 != 0:
              raise SystemExit(
                  "ERROR: path joins remain"
              )

          print()
          print(
              "BundleKey compatibility patch successful."
          )
          PY

          echo
          echo "========================================"
          echo "PATCH DIFF"
          echo "========================================"

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc

          echo
          echo "===== Verify joins are gone ====="

          if grep -RIn \
            'fmt::join(overridden_keys' \
            source/blender/nodes
          then
            echo "ERROR: overridden_keys fmt::join still exists"
            exit 1
          fi

          if grep -n \
            'fmt::join(path, "/")' \
            source/blender/nodes/intern/geometry_nodes_bundle.cc
          then
            echo "ERROR: path fmt::join still exists"
            exit 1
          fi

          echo
          echo "Patch verification passed."

      # ============================================================
      # 15. CONFIGURE BLENDER
      #
      # Cycles stays OFF.
      #
      # No fmt override.
      # No CPATH.
      # No CPLUS_INCLUDE_PATH.
      # No downloaded fmt.
      # ============================================================

      - name: Configure Blender for iOS
        run: |
          set -euxo pipefail

          rm -rf build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "===== SDK ====="
          echo "$IOS_SDK_ROOT"

          echo
          echo "===== LIBDIR ====="
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_CYCLES=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 16. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify build configuration
        run: |
          set -eux

          echo "===== Important options ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_PYTHON_NUMPY:|WITH_AUDASPACE:|WITH_METAL_BACKEND:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"

          if [ "$CYCLES" != "OFF" ]; then
            echo "ERROR: Cycles is not OFF"
            exit 1
          fi

          PYTHON="$(
            grep '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo "WITH_PYTHON=$PYTHON"

          if [ "$PYTHON" != "ON" ]; then
            echo "ERROR: Python is not ON"
            exit 1
          fi

      # ============================================================
      # 17. BUILD BLENDER
      # ============================================================

      - name: Build Blender for physical iOS
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          echo "Build jobs: $NCPU"

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo
            echo "===== Compiler/linker errors ====="

            grep -n -C 20 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt \
              || true

            echo
            echo "===== fmt / BundleKey errors ====="

            grep -n -C 10 \
              -E \
              'fmt::|BundleKey|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            cat \
              fmt-errors.txt \
              || true

            echo
            echo "===== Failed commands ====="

            grep -n -A 100 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt \
              || true

            echo
            echo "===== Last 400 lines ====="

            tail -400 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -100 \
            xcodebuild.log

      # ============================================================
      # 18. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              -name 'Blender.app' \
              -print -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Blender.app was not found"

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== Blender.app ====="

          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 19. VERIFY EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -eux

          test -f \
            "$APP/Info.plist"

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          else

            echo "ERROR: Blender executable not found"
            exit 1

          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Binary ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 20. PACKAGE IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-Cycles-OFF.ipa \
            Payload

          cd ..

          test -f \
            Blender-5.2-iPad-Cycles-OFF.ipa

          echo
          echo "===== IPA ====="

          ls -lh \
            Blender-5.2-iPad-Cycles-OFF.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Cycles-OFF.ipa \
            | head -80

      # ============================================================
      # 21. WRITE BUILD INFORMATION
      # ============================================================

      - name: Write build revision
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD 2>/dev/null || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null || true
            echo

            echo "Build options:"
            echo "WITH_CYCLES=OFF"
            echo

            echo "Compatibility patches:"
            echo "1 x overridden_keys BundleKey fmt::join"
            echo "2 x path BundleKey fmt::join"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 22. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Cycles-OFF
          path: |
            Blender-5.2-iPad-Cycles-OFF.ipa
            build-revision.txt
          retention-days: 30

      # ============================================================
      # 23. ALWAYS UPLOAD LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-build-logs
          path: |
            build-revision.txt
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            fmt-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
