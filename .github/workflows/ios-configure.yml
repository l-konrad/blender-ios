name: iOS configure

on:
  push:
    branches: [ios-new, main]
  pull_request:
    branches: [ios-new]
  workflow_dispatch:

# Keep only the latest run per branch to save CI minutes.
concurrency:
  group: ios-configure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: CMake configure (Xcode generator, iOS SDK)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do not fetch LFS — not needed for a configure-only step and
          # adds ~multi-GB of bandwidth.
          lfs: false
          submodules: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install CMake
        run: |
          # GitHub runners ship an old-ish cmake; use the latest stable.
          brew update --quiet
          brew install cmake ninja
          cmake --version

      - name: Configure (iOS device, Xcode generator)
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          # Configure-only. We do NOT build because that requires the
          # ~GB-scale pre-built library bundle (lib/ios_arm64) which is
          # fetched via Git LFS from a private mirror. Configure-only
          # catches 60%+ of rebase breakage: missing CMake options,
          # syntactic errors in our CMake, missing files, bad guards.
          cmake -S . -B build_ios_ci \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DWITH_PYTHON=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_INSTALL_PORTABLE=OFF \
            --no-warn-unused-cli \
            2>&1 | tee configure.log
          echo "---"
          # Surface any non-fatal warnings that smell like real problems.
          ! grep -E '^CMake (Warning|Error)' configure.log | \
            grep -Ev 'find_package|Could NOT find' || true

      - name: Upload configure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-log
          path: configure.log
          if-no-files-found: ignore
          retention-days: 7

  shellcheck:
    name: Shellcheck iOS scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck -x setup_ios.sh || true
          shellcheck -x release/ios/scripts/*.sh
