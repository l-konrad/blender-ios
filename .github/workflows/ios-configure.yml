name: Build Blender iOS - Xcode 26 Fast

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-xcode26-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Touch + Keyboard Fix
    runs-on: macos-15
    timeout-minutes: 180

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

      BLENDER_SHA: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6

      EXPECTED_IOS_LIB_SHA: 393201c7c8525941553f6a96e19b909d6b3bfc4f
      EXPECTED_MAC_LIB_SHA: a3e20428fb0ab2231903608cdca90301e130dbfc

      IOS_DEPLOYMENT_TARGET: "26.2"

      # IMPORTANT:
      # Keep this exactly at fast-v3.
      #
      # The previous successful Blender compilation can then be
      # restored instead of recompiling everything.
      BUILD_CACHE_VERSION: fast-v3

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT SOURCE
      # ============================================================

      - name: Checkout Blender iOS
        uses: actions/checkout@v6
        with:
          repository: salmazov/blender-ios
          ref: 1e391616fea93b759ac5ad73cdbbbcb7f2fa08e6
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE
      # ============================================================

      - name: Verify source revision
        run: |
          set -euxo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          echo "========================================"
          echo "SOURCE"
          echo "========================================"
          echo
          echo "Expected: $BLENDER_SHA"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$BLENDER_SHA"

          git log -1 --oneline

      # ============================================================
      # 3. NORMALIZE SOURCE TIMESTAMPS
      #
      # This allows Xcode to reuse restored object files.
      # ============================================================

      - name: Normalize source timestamps
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import subprocess

          stamp = int(
              subprocess.check_output(
                  [
                      "git",
                      "show",
                      "-s",
                      "--format=%ct",
                      "HEAD",
                  ],
                  text=True,
              ).strip()
          )

          tracked = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
              ]
          )

          count = 0

          for raw in tracked.split(b"\0"):
              if not raw:
                  continue

              path = os.fsdecode(raw)

              if not os.path.lexists(path):
                  continue

              try:
                  os.utime(
                      path,
                      (stamp, stamp),
                      follow_symlinks=False,
                  )
                  count += 1
              except (OSError, NotImplementedError):
                  pass

          print(
              "Normalized timestamps for",
              count,
              "tracked paths",
          )
          PY

      # ============================================================
      # 4. SELECT XCODE 26.3
      # ============================================================

      - name: Select Xcode 26.3
        run: |
          set -euxo pipefail

          XCODE="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE" ]; then

            echo "ERROR: Xcode 26.3 unavailable."

            echo
            echo "Installed Xcode versions:"

            ls -d \
              /Applications/Xcode*.app \
              || true

            exit 1

          fi

          sudo xcode-select \
            -s "$XCODE/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "Developer directory:"

          xcode-select -p

      # ============================================================
      # 5. VERIFY IOS SDK
      # ============================================================

      - name: Verify iOS SDK
        run: |
          set -euxo pipefail

          VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          SDK_PATH="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          echo "========================================"
          echo "IPHONEOS SDK"
          echo "========================================"

          echo "Version: $VERSION"
          echo "Path:    $SDK_PATH"

          case "$VERSION" in

            26.*)
              ;;

            *)
              echo "ERROR: Expected iOS 26.x SDK."
              exit 1
              ;;

          esac

          echo "IOS_SDK_VERSION=$VERSION" \
            >> "$GITHUB_ENV"

          echo "IOS_SDK_ROOT=$SDK_PATH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 6. TEST MODERN UIKIT API
      # ============================================================

      - name: Test modern UIWindowScene API
        run: |
          set -euxo pipefail

          cat > /tmp/uikit_probe.mm <<'EOF'
          #import <UIKit/UIKit.h>

          static CGRect blender_scene_bounds(UIWindowScene *scene)
          {
            return scene.effectiveGeometry.coordinateSpace.bounds;
          }
          EOF

          SDKROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          xcrun \
            --sdk iphoneos \
            clang++ \
            -x objective-c++ \
            -fsyntax-only \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min="$IOS_DEPLOYMENT_TARGET" \
            /tmp/uikit_probe.mm

          echo
          echo "Modern UIWindowScene API probe passed."

      # ============================================================
      # 7. DISK SPACE
      # ============================================================

      - name: Check disk space
        run: |
          set -euxo pipefail

          df -h \
            "$GITHUB_WORKSPACE"

          FREE_KB="$(
            df -Pk "$GITHUB_WORKSPACE" \
              | awk 'NR == 2 {print $4}'
          )"

          echo
          echo "Available KB: $FREE_KB"

          if [ "$FREE_KB" -lt 30000000 ]; then

            echo
            echo "Low disk space. Cleaning runner..."

            sudo rm -rf \
              /usr/local/lib/android \
              || true

            sudo rm -rf \
              /usr/share/dotnet \
              || true

            sudo rm -rf \
              "$HOME/Library/Android" \
              || true

            sudo rm -rf \
              /opt/ghc \
              || true

            sudo rm -rf \
              /usr/local/.ghcup \
              || true

            sudo xcrun simctl delete all \
              2>/dev/null \
              || true

          else

            echo
            echo "Enough disk space."

          fi

          df -h \
            "$GITHUB_WORKSPACE"

      # ============================================================
      # 8. REQUIRED TOOLS
      # ============================================================

      - name: Ensure build tools
        run: |
          set -euxo pipefail

          NEED=""

          if ! command -v cmake >/dev/null 2>&1; then
            NEED="$NEED cmake"
          fi

          if ! command -v git-lfs >/dev/null 2>&1; then
            NEED="$NEED git-lfs"
          fi

          if [ -n "$NEED" ]; then

            brew install $NEED

          else

            echo "CMake and Git LFS already available."

          fi

          git lfs install

          echo
          cmake --version

          echo
          git lfs version

      # ============================================================
      # 9. OFFICIAL BLENDER LFS REMOTE
      # ============================================================

      - name: Configure Blender LFS remote
        run: |
          set -euxo pipefail

          git remote add \
            blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null \
            || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git config \
            lfs.remote.searchall \
            true

          echo
          echo "===== Git remotes ====="

          git remote -v

      # ============================================================
      # 10. DETECT BUNDLED ASSET LAYOUT
      # ============================================================

      - name: Detect bundled asset layout
        id: asset-layout
        shell: bash
        run: |
          set -euxo pipefail

          MODE=""
          SOURCE=""
          SHA=""
          URL=""

          if [ -d assets ]; then

            MODE="root"
            SOURCE="assets"

          else

            TREE_LINE="$(
              git ls-tree \
                HEAD \
                release/datafiles/assets \
                || true
            )"

            TREE_MODE="$(
              printf '%s\n' "$TREE_LINE" \
                | awk '{print $1}'
            )"

            TREE_SHA="$(
              printf '%s\n' "$TREE_LINE" \
                | awk '{print $3}'
            )"

            if [ "$TREE_MODE" = "160000" ] && \
               [ -n "$TREE_SHA" ]
            then

              MODE="submodule"
              SOURCE="release/datafiles/assets"
              SHA="$TREE_SHA"

              SUBMODULE_NAME="$(
                git config \
                  -f .gitmodules \
                  --get-regexp '^submodule\..*\.path$' \
                | awk \
                    '$2 == "release/datafiles/assets" {
                      key=$1
                      sub(/^submodule\./, "", key)
                      sub(/\.path$/, "", key)
                      print key
                    }'
              )"

              if [ -z "$SUBMODULE_NAME" ]; then

                echo "ERROR: Cannot locate assets submodule entry."

                exit 1

              fi

              URL="$(
                git config \
                  -f .gitmodules \
                  --get \
                  "submodule.${SUBMODULE_NAME}.url"
              )"

              if [ -z "$URL" ]; then

                echo "ERROR: Cannot determine assets repository URL."

                exit 1

              fi

            else

              echo "ERROR: Could not determine Blender asset layout."

              echo
              echo "Root:"

              ls -la \
                || true

              echo
              echo "release/datafiles:"

              ls -la \
                release/datafiles \
                || true

              echo
              echo ".gitmodules:"

              cat \
                .gitmodules \
                || true

              exit 1

            fi

          fi

          echo "mode=$MODE" \
            >> "$GITHUB_OUTPUT"

          echo "source=$SOURCE" \
            >> "$GITHUB_OUTPUT"

          echo "sha=$SHA" \
            >> "$GITHUB_OUTPUT"

          echo "url=$URL" \
            >> "$GITHUB_OUTPUT"

          echo "BUNDLED_ASSETS_SOURCE=$SOURCE" \
            >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "BUNDLED ASSET LAYOUT"
          echo "========================================"

          echo "Mode:   $MODE"
          echo "Source: $SOURCE"
          echo "SHA:    $SHA"
          echo "URL:    $URL"

      # ============================================================
      # 11. RESTORE SOURCE RESOURCE CACHE
      # ============================================================

      - name: Restore source resources
        id: source-assets-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            release/datafiles/startup.blend
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
            assets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v5

      # ============================================================
      # 12. RESTORE LEGACY ASSETS IF NEEDED
      # ============================================================

      - name: Restore legacy Blender assets
        id: legacy-assets-cache
        if: steps.asset-layout.outputs.mode == 'submodule'
        uses: actions/cache/restore@v5
        with:
          path: release/datafiles/assets
          key: blender-assets-${{ steps.asset-layout.outputs.sha }}-v2

      # ============================================================
      # 13. FETCH LEGACY ASSETS IF NEEDED
      # ============================================================

      - name: Fetch legacy Blender assets
        if: >-
          steps.asset-layout.outputs.mode == 'submodule' &&
          steps.legacy-assets-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="release/datafiles/assets"

          SHA="${{ steps.asset-layout.outputs.sha }}"
          URL="${{ steps.asset-layout.outputs.url }}"

          rm -rf \
            "$ROOT"

          git clone \
            --filter=blob:none \
            --no-checkout \
            "$URL" \
            "$ROOT"

          git -C "$ROOT" \
            fetch \
            --depth=1 \
            origin \
            "$SHA"

          git -C "$ROOT" \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C "$ROOT" \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$SHA"

          git -C "$ROOT" \
            lfs install \
            --local

          git -C "$ROOT" \
            lfs pull \
            2>&1 | tee blender-assets-lfs.log

          du -sh \
            "$ROOT"

      # ============================================================
      # 14. VERIFY LEGACY ASSETS
      # ============================================================

      - name: Verify legacy Blender assets
        if: steps.asset-layout.outputs.mode == 'submodule'
        run: |
          set -euxo pipefail

          ROOT="release/datafiles/assets"

          ACTUAL="$(
            git -C "$ROOT" \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.asset-layout.outputs.sha }}"

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "release/datafiles/assets"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in root.rglob("*"):

              if ".git" in path.parts:
                  continue

              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:

              print(
                  "ERROR: legacy blender-assets "
                  "still contains LFS pointers:"
              )

              for path in bad:
                  print(" ", path)

              raise SystemExit(1)

          print(
              "Legacy blender-assets fully materialized."
          )
          PY

      # ============================================================
      # 15. MATERIALIZE MAIN REPOSITORY LFS RESOURCES
      # ============================================================

      - name: Materialize packaged source resources
        shell: bash
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          materialize_pointer()
          {
            FILE="$1"

            if [ ! -f "$FILE" ]; then

              echo "ERROR: Missing source file:"
              echo "  $FILE"

              return 1

            fi

            if ! head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              return 0

            fi

            echo
            echo "----------------------------------------"
            echo "Materializing:"
            echo "  $FILE"

            OID="$(
              sed -n \
                's/^oid sha256://p' \
                "$FILE"
            )"

            if [ -z "$OID" ]; then

              echo "ERROR: Invalid LFS pointer:"
              echo "  $FILE"

              return 1

            fi

            echo "OID:"
            echo "  $OID"

            GIT_DIR="$(
              git rev-parse \
                --git-dir
            )"

            OBJECT="$GIT_DIR/lfs/objects/${OID:0:2}/${OID:2:2}/$OID"

            if [ ! -f "$OBJECT" ]; then

              git lfs fetch \
                blender-lfs \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              git lfs fetch \
                origin \
                --include="$FILE" \
                HEAD \
                || true

            fi

            if [ ! -f "$OBJECT" ]; then

              echo
              echo "ERROR: LFS object unavailable."
              echo "File:"
              echo "  $FILE"
              echo "OID:"
              echo "  $OID"

              return 1

            fi

            TEMP="${FILE}.materialized"

            cp \
              "$OBJECT" \
              "$TEMP"

            ACTUAL="$(
              shasum \
                -a 256 \
                "$TEMP" \
                | awk '{print $1}'
            )"

            if [ "$ACTUAL" != "$OID" ]; then

              echo
              echo "ERROR: LFS SHA-256 mismatch."
              echo "Expected: $OID"
              echo "Actual:   $ACTUAL"

              rm -f \
                "$TEMP"

              return 1

            fi

            mv \
              "$TEMP" \
              "$FILE"

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              echo "ERROR: Materialized file still looks like a pointer."

              return 1

            fi
          }

          # --------------------------------------------------------
          # Prefetch common resources.
          # --------------------------------------------------------

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/**" \
            HEAD \
            2>&1 | tee source-lfs.log \
            || true

          git lfs fetch \
            blender-lfs \
            --include="scripts/startup/bl_app_templates_system/**" \
            HEAD \
            2>&1 | tee -a source-lfs.log \
            || true

          if [ "${{ steps.asset-layout.outputs.mode }}" = "root" ]; then

            git lfs fetch \
              blender-lfs \
              --include="assets/**" \
              HEAD \
              2>&1 | tee -a source-lfs.log \
              || true

          fi

          # --------------------------------------------------------
          # release/datafiles
          # --------------------------------------------------------

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_pointer \
                "$FILE"

            fi

          done < <(
            find \
              release/datafiles \
              -path 'release/datafiles/assets' \
              -prune \
              -o \
              -type f \
              -print0
          )

          # --------------------------------------------------------
          # scripts
          # --------------------------------------------------------

          while IFS= read -r -d '' FILE
          do

            if head -c 200 "$FILE" \
              | grep -q "$LFS_MAGIC"
            then

              materialize_pointer \
                "$FILE"

            fi

          done < <(
            find \
              scripts \
              -type f \
              -print0
          )

          # --------------------------------------------------------
          # root assets/
          # --------------------------------------------------------

          if [ "${{ steps.asset-layout.outputs.mode }}" = "root" ]; then

            while IFS= read -r -d '' FILE
            do

              if head -c 200 "$FILE" \
                | grep -q "$LFS_MAGIC"
              then

                materialize_pointer \
                  "$FILE"

              fi

            done < <(
              find \
                assets \
                -type f \
                -print0
            )

          fi

          # --------------------------------------------------------
          # startup.blend is required.
          # --------------------------------------------------------

          STARTUP="release/datafiles/startup.blend"

          materialize_pointer \
            "$STARTUP"

          SIZE="$(
            stat \
              -f '%z' \
              "$STARTUP"
          )"

          echo
          echo "startup.blend size: $SIZE"

          test \
            "$SIZE" \
            -gt 1024

      # ============================================================
      # 16. APPICON WORKAROUND
      # ============================================================

      - name: Prepare iOS AppIcon
        run: |
          set -euxo pipefail

          LFS_MAGIC='version https://git-lfs.github.com/spec/v1'

          ICON_DIR="release/ios/Blender.app/Assets.xcassets/AppIcon.appiconset"

          ICON="$ICON_DIR/blender_icon_1024x1024.png"

          CONTENTS="$ICON_DIR/Contents.json"

          test -d \
            "$ICON_DIR"

          test -f \
            "$CONTENTS"

          NEED_ICON=0

          if [ ! -f "$ICON" ]; then

            NEED_ICON=1

          elif [ ! -s "$ICON" ]; then

            NEED_ICON=1

          elif head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            NEED_ICON=1

          fi

          if [ "$NEED_ICON" -eq 1 ]; then

            echo
            echo "Generating fallback 1024x1024 RGB AppIcon..."

            ICON_PATH="$ICON" python3 <<'PY'
          import binascii
          import os
          import struct
          import zlib

          path = os.environ["ICON_PATH"]

          width = 1024
          height = 1024

          pixel = bytes(
              (
                  243,
                  111,
                  33,
              )
          )

          row = (
              b"\x00"
              + pixel * width
          )

          raw = row * height

          def chunk(kind, data):
              return (
                  struct.pack(
                      ">I",
                      len(data),
                  )
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      binascii.crc32(
                          kind + data
                      ) & 0xFFFFFFFF,
                  )
              )

          png = bytearray(
              b"\x89PNG\r\n\x1a\n"
          )

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  2,
                  0,
                  0,
                  0,
              ),
          )

          png += chunk(
              b"IDAT",
              zlib.compress(
                  raw,
                  9,
              ),
          )

          png += chunk(
              b"IEND",
              b"",
          )

          with open(
              path,
              "wb",
          ) as handle:
              handle.write(png)

          print(
              "Generated fallback AppIcon:",
              path,
          )
          PY

          fi

          echo
          echo "===== AppIcon ====="

          file \
            "$ICON"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            -g format \
            -g hasAlpha \
            "$ICON"

          WIDTH="$(
            sips \
              -g pixelWidth \
              "$ICON" \
              | awk '/pixelWidth:/ {print $2}'
          )"

          HEIGHT="$(
            sips \
              -g pixelHeight \
              "$ICON" \
              | awk '/pixelHeight:/ {print $2}'
          )"

          test \
            "$WIDTH" \
            = "1024"

          test \
            "$HEIGHT" \
            = "1024"

          if head -c 200 "$ICON" \
            | grep -q "$LFS_MAGIC"
          then

            echo "ERROR: AppIcon remains an LFS pointer."

            exit 1

          fi

      # ============================================================
      # 17. VERIFY ALL SOURCE RESOURCES
      # ============================================================

      - name: Verify source resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path(
                  "release/datafiles"
              ),
              Path(
                  "scripts"
              ),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  os.environ[
                      "BUNDLED_ASSETS_SOURCE"
                  ]
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []
          seen = set()

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  try:
                      resolved = path.resolve()
                  except OSError:
                      resolved = path

                  if resolved in seen:
                      continue

                  seen.add(
                      resolved
                  )

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:

              print(
                  "ERROR: source resources still "
                  "contain Git LFS pointers:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "All packaged source resources are materialized."
          )
          PY

      # ============================================================
      # 18. VERIFY BUNDLED BRUSH/NODE ASSETS
      # ============================================================

      - name: Verify bundled brushes and nodes
        run: |
          set -euxo pipefail

          ROOT="$BUNDLED_ASSETS_SOURCE"

          REQUIRED=(
            "brushes/essentials_brushes-mesh_sculpt.blend"
            "brushes/essentials_brushes-gp_weight.blend"
            "brushes/essentials_brushes-mesh_weight.blend"
            "brushes/essentials_brushes-curve_sculpt.blend"
            "brushes/essentials_brushes-gp_sculpt.blend"
            "brushes/essentials_brushes-gp_vertex.blend"
            "brushes/essentials_brushes-gp_draw.blend"
            "brushes/essentials_brushes-mesh_texture.blend"
            "brushes/essentials_brushes-mesh_vertex.blend"
            "nodes/compositing_nodes_essentials.blend"
            "nodes/shading_nodes_essentials.blend"
            "nodes/principal_components.blend"
            "nodes/geometry_nodes_dynamics_assets.blend"
            "nodes/geometry_nodes_essentials.blend"
            "nodes/procedural_hair_node_assets.blend"
          )

          for REL in "${REQUIRED[@]}"
          do

            FILE="$ROOT/$REL"

            echo "Checking:"
            echo "  $FILE"

            test -f \
              "$FILE"

            if head -c 200 "$FILE" \
              | grep -q \
                'version https://git-lfs.github.com/spec/v1'
            then

              echo "ERROR: Asset remains an LFS pointer:"
              echo "  $FILE"

              exit 1

            fi

          done

          echo
          echo "All previously failing bundled assets are valid."

      # ============================================================
      # 19. SAVE SOURCE RESOURCE CACHE
      # ============================================================

      - name: Save source resource cache
        if: steps.source-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            release/datafiles/startup.blend
            scripts/startup/bl_app_templates_system
            release/ios/Blender.app/Assets.xcassets
            assets
          key: blender-source-assets-${{ env.BLENDER_SHA }}-materialized-v5

      # ============================================================
      # 20. SAVE LEGACY ASSETS CACHE
      # ============================================================

      - name: Save legacy Blender assets
        if: >-
          steps.asset-layout.outputs.mode == 'submodule' &&
          steps.legacy-assets-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: release/datafiles/assets
          key: blender-assets-${{ steps.asset-layout.outputs.sha }}-v2

      # ============================================================
      # 21. DETERMINE PREBUILT LIBRARY REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -euxo pipefail

          IOS_SHA="$(
            git rev-parse \
              HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse \
              HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get \
              submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "mac_sha=$MAC_SHA" \
            >> "$GITHUB_OUTPUT"

          echo "ios_url=$IOS_URL" \
            >> "$GITHUB_OUTPUT"

          echo "mac_url=$MAC_URL" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # 22. VERIFY LIBRARY PINS
      # ============================================================

      - name: Verify library revisions
        run: |
          set -euxo pipefail

          test \
            "${{ steps.libs.outputs.ios_sha }}" \
            = "$EXPECTED_IOS_LIB_SHA"

          test \
            "${{ steps.libs.outputs.mac_sha }}" \
            = "$EXPECTED_MAC_LIB_SHA"

      # ============================================================
      # 23. RESTORE IOS LIBRARIES
      # ============================================================

      - name: Restore iOS libraries
        id: ios-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 24. FETCH IOS LIBRARIES
      # ============================================================

      - name: Fetch iOS libraries
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            lfs install \
            --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 25. VERIFY IOS LIBRARIES
      # ============================================================

      - name: Verify iOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$EXPECTED_IOS_LIB_SHA"

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

      # ============================================================
      # 26. SAVE IOS LIBRARIES
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/ios_arm64
          key: blender-ioslib-${{ steps.libs.outputs.ios_sha }}-v3

      # ============================================================
      # 27. RESTORE MACOS LIBRARIES
      # ============================================================

      - name: Restore macOS libraries
        id: mac-lib-cache
        uses: actions/cache/restore@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 28. FETCH MACOS LIBRARIES
      # ============================================================

      - name: Fetch macOS libraries
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth=1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            lfs install \
            --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 29. VERIFY MACOS LIBRARIES
      # ============================================================

      - name: Verify macOS libraries
        run: |
          set -euxo pipefail

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          test \
            "$ACTUAL" \
            = "$EXPECTED_MAC_LIB_SHA"

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
