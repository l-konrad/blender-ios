          )"

          test -n \
            "$HOST_PYTHON"

          echo
          echo "Host Python:"
          echo "$HOST_PYTHON"

      # ============================================================
      # 30. SAVE MACOS LIBRARIES
      # ============================================================

      - name: Save macOS library cache
        if: steps.mac-lib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: lib/macos_arm64
          key: blender-maclib-${{ steps.libs.outputs.mac_sha }}-v3

      # ============================================================
      # 31. APPLY FMT COMPATIBILITY FIXES
      # ============================================================

      - name: Apply fmt compatibility fixes
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re


          # ========================================================
          # PATCH 1
          # ========================================================

          file1 = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          text = file1.read_text()

          needle = 'fmt::join(overridden_keys, ", ")'

          replacement = '''[&]() {
                std::string result;

                for (const auto &key : overridden_keys) {
                  if (!result.empty()) {
                    result += ", ";
                  }

                  const auto key_ref =
                      key.ustr().ref();

                  result.append(
                      key_ref.data(),
                      key_ref.size());
                }

                return result;
              }()'''

          count = text.count(
              needle
          )

          print(
              "BundleKey joins:",
              count,
          )

          if count != 1:

              raise SystemExit(
                  "ERROR: expected exactly 1 "
                  "BundleKey fmt::join; "
                  f"found {count}"
              )

          file1.write_text(
              text.replace(
                  needle,
                  replacement,
                  1,
              )
          )


          # ========================================================
          # PATCH 2
          # ========================================================

          file2 = Path(
              "source/blender/nodes/intern/"
              "geometry_nodes_bundle.cc"
          )

          text = file2.read_text()

          needle = 'fmt::join(path, "/")'

          replacement = '''[&]() {
                struct PathPartAppender {
                  static void append(
                      std::string &result,
                      const StringRef value)
                  {
                    result.append(
                        value.data(),
                        value.size());
                  }

                  static void append(
                      std::string &result,
                      const BundleKey &value)
                  {
                    const auto value_ref =
                        value.ustr().ref();

                    result.append(
                        value_ref.data(),
                        value_ref.size());
                  }
                };

                std::string result;

                for (const auto &key : path) {
                  if (!result.empty()) {
                    result += '/';
                  }

                  PathPartAppender::append(
                      result,
                      key);
                }

                return result;
              }()'''

          count = text.count(
              needle
          )

          print(
              "Path joins:",
              count,
          )

          if count != 2:

              raise SystemExit(
                  "ERROR: expected exactly 2 "
                  "path fmt::join calls; "
                  f"found {count}"
              )

          file2.write_text(
              text.replace(
                  needle,
                  replacement,
              )
          )


          # ========================================================
          # PATCH 3
          # ========================================================

          file3 = Path(
              "source/blender/geometry/intern/"
              "mesh_bevel.cc"
          )

          text = file3.read_text()

          call = "fmt::println("

          total = text.count(
              call
          )

          print(
              "mesh_bevel println calls:",
              total,
          )

          if total < 19:

              raise SystemExit(
                  "ERROR: expected at least 19 "
                  "println calls; "
                  f"found {total}"
              )

          text = text.replace(
              "fmt::println();",
              'fmt::print("\\n");',
          )

          remaining = text.count(
              call
          )

          if remaining:

              macro = r'''

          /*
           * Compatibility for the older fmt implementation exposed
           * by the iOS dependency set.
           */
          #ifndef BLENDER_FMT_PRINTLN_COMPAT
          #  define BLENDER_FMT_PRINTLN_COMPAT(...) \
            do { \
              fmt::print(__VA_ARGS__); \
              fmt::print("\n"); \
            } while (false)
          #endif

          '''

              includes = list(
                  re.finditer(
                      r"(?m)^#include[^\n]*\n",
                      text,
                  )
              )

              if not includes:

                  raise SystemExit(
                      "ERROR: could not locate mesh_bevel include block."
                  )

              insert_at = includes[-1].end()

              text = (
                  text[:insert_at]
                  + macro
                  + text[insert_at:]
              )

              text = text.replace(
                  call,
                  "BLENDER_FMT_PRINTLN_COMPAT(",
              )

          file3.write_text(
              text
          )


          # ========================================================
          # VERIFY
          # ========================================================

          if 'fmt::join(overridden_keys, ", ")' in file1.read_text():

              raise SystemExit(
                  "ERROR: BundleKey fmt join remains."
              )

          if 'fmt::join(path, "/")' in file2.read_text():

              raise SystemExit(
                  "ERROR: path fmt join remains."
              )

          if "fmt::println(" in file3.read_text():

              raise SystemExit(
                  "ERROR: real fmt::println call remains."
              )

          print()
          print(
              "All fmt compatibility patches verified."
          )
          PY

          git diff -- \
            source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc \
            source/blender/nodes/intern/geometry_nodes_bundle.cc \
            source/blender/geometry/intern/mesh_bevel.cc \
            > compatibility.patch

          echo
          echo "===== Verify no actual println calls ====="

          if grep -nF \
            'fmt::println(' \
            source/blender/geometry/intern/mesh_bevel.cc
          then

            echo "ERROR: actual fmt::println call remains."

            exit 1

          fi

      # ============================================================
      # 32. FIX IOS TOUCH COORDINATE OFFSET
      #
      # This is the version that produced correct touch positioning
      # on the physical iPad.
      # ============================================================

      - name: Fix iOS touch coordinate offset
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "intern/ghost/intern/GHOST_WindowIOS.mm"
          )

          text = path.read_text()

          original = text


          # ========================================================
          # A. NORMAL GESTURE POINTS
          # ========================================================

          old = (
              "return window->scalePointToWindow(touch_point);"
          )

          count = text.count(
              old
          )

          print(
              "Scaled gesture-point returns:",
              count,
          )

          if count < 1:

              raise SystemExit(
                  "ERROR: Could not find expected "
                  "scalePointToWindow(touch_point) calls."
              )

          text = text.replace(
              old,
              "return touch_point;",
          )


          # ========================================================
          # B. PAN TRANSLATION
          # ========================================================

          old = (
              "return window->scalePointToWindow(translation);"
          )

          count = text.count(
              old
          )

          print(
              "Scaled gesture translations:",
              count,
          )

          if count >= 1:

              text = text.replace(
                  old,
                  "return translation;",
              )


          # ========================================================
          # C. PINCH POINTS
          # ========================================================

          for variable in (
              "touch_point0",
              "touch_point1",
          ):

              pattern = re.compile(
                  rf'^[ \t]*{variable}[ \t]*=[ \t]*'
                  rf'window->scalePointToWindow\('
                  rf'{variable}\);[ \t]*$',
                  re.MULTILINE,
              )

              matches = list(
                  pattern.finditer(
                      text
                  )
              )

              print(
                  f"Scaled {variable} assignments:",
                  len(matches),
              )

              if matches:

                  text = pattern.sub(
                      (
                          "    /* UIKit location is already "
                          "in logical view coordinates. */"
                      ),
                      text,
                  )


          # ========================================================
          # D. RAW UITOUCH LOCATION
          # ========================================================

          touch_pattern = re.compile(
              r'(- \(CGPoint\)scaledLocationOfTouch:'
              r'\(UITouch \*\)touch\s*'
              r'\{\s*)'
              r'CGPoint\s+loc\s*=\s*'
              r'\[touch\s+locationInView:'
              r'window->getView\(\)\];\s*'
              r'CGFloat\s+scale\s*=\s*'
              r'\[window->getView\(\)\s+'
              r'contentScaleFactor\];\s*'
              r'loc\.x\s*\*=\s*scale;\s*'
              r'loc\.y\s*\*=\s*scale;\s*'
              r'return\s+loc;\s*'
              r'\}',
              re.MULTILINE,
          )

          touch_matches = list(
              touch_pattern.finditer(
                  text
              )
          )

          print(
              "Raw scaled UITouch helpers:",
              len(touch_matches),
          )

          if len(touch_matches) != 1:

              raise SystemExit(
                  "ERROR: expected exactly one "
                  "scaledLocationOfTouch helper; "
                  f"found {len(touch_matches)}"
              )

          text = touch_pattern.sub(
              (
                  r'\1'
                  'return [touch '
                  'locationInView:window->getView()];\n'
                  '}'
              ),
              text,
              count=1,
          )


          # ========================================================
          # E. RAW GESTURE LOCATION
          # ========================================================

          gesture_pattern = re.compile(
              r'(- \(CGPoint\)scaledLocationOfGesture:'
              r'\(UIGestureRecognizer \*\)gesture\s*'
              r'\{\s*)'
              r'CGPoint\s+loc\s*=\s*'
              r'\[gesture\s+locationInView:'
              r'window->getView\(\)\];\s*'
              r'CGFloat\s+scale\s*=\s*'
              r'\[window->getView\(\)\s+'
              r'contentScaleFactor\];\s*'
              r'loc\.x\s*\*=\s*scale;\s*'
              r'loc\.y\s*\*=\s*scale;\s*'
              r'return\s+loc;\s*'
              r'\}',
              re.MULTILINE,
          )

          gesture_matches = list(
              gesture_pattern.finditer(
                  text
              )
          )

          print(
              "Raw scaled gesture helpers:",
              len(gesture_matches),
          )

          if len(gesture_matches) != 1:

              raise SystemExit(
                  "ERROR: expected exactly one "
                  "scaledLocationOfGesture helper; "
                  f"found {len(gesture_matches)}"
              )

          text = gesture_pattern.sub(
              (
                  r'\1'
                  'return [gesture '
                  'locationInView:window->getView()];\n'
                  '}'
              ),
              text,
              count=1,
          )


          # ========================================================
          # VERIFY PATCH
          # ========================================================

          if text == original:

              raise SystemExit(
                  "ERROR: touch patch made no changes."
              )

          path.write_text(
              text
          )

          patched = path.read_text()

          forbidden = [
              (
                  "return window->"
                  "scalePointToWindow(touch_point);"
              ),
              (
                  "return window->"
                  "scalePointToWindow(translation);"
              ),
              (
                  "touch_point0 = window->"
                  "scalePointToWindow(touch_point0);"
              ),
              (
                  "touch_point1 = window->"
                  "scalePointToWindow(touch_point1);"
              ),
          ]

          for item in forbidden:

              if item in patched:

                  raise SystemExit(
                      "ERROR: touch scaling remains: "
                      + item
                  )

          print()
          print(
              "iOS logical touch-coordinate patch verified."
          )
          PY

          echo
          echo "========================================"
          echo "TOUCH COORDINATE DIFF"
          echo "========================================"

          git diff -- \
            intern/ghost/intern/GHOST_WindowIOS.mm

          git diff -- \
            intern/ghost/intern/GHOST_WindowIOS.mm \
            > touch-coordinates.patch

      # ============================================================
      # 33. FIX popupOnscreenKeyboard: CRASH
      #
      # Crash:
      #
      # -[GHOSTUIWindow popupOnscreenKeyboard:]:
      # unrecognized selector sent to instance
      #
      # Add the missing selector through an Objective-C category.
      #
      # If an existing responder is capable of accepting text input,
      # try to make it first responder.
      #
      # Otherwise the method safely becomes a no-op instead of
      # terminating Blender.
      # ============================================================

      - name: Fix iOS onscreen keyboard selector crash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "EXISTING KEYBOARD SELECTOR REFERENCES"
          echo "========================================"

          grep -RIn \
            'popupOnscreenKeyboard' \
            intern/ghost \
            source/blender \
            release/ios \
            2>/dev/null \
            || true

          python3 <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path(
                  "intern/ghost/intern"
              ),
              Path(
                  "release/ios"
              ),
          ]

          candidates = []

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if path.suffix not in {
                      ".m",
                      ".mm",
                  }:
                      continue

                  try:
                      text = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue

                  if "@implementation GHOSTUIWindow" in text:

                      candidates.append(
                          path
                      )

          print()
          print(
              "GHOSTUIWindow implementation candidates:"
          )

          for path in candidates:
              print(
                  " ",
                  path,
              )

          if not candidates:

              raise SystemExit(
                  "ERROR: could not locate "
                  "@implementation GHOSTUIWindow."
              )

          target = candidates[0]

          text = target.read_text()

          print()
          print(
              "Keyboard patch target:",
              target,
          )


          # ========================================================
          # CHECK THE PRIMARY GHOSTUIWindow IMPLEMENTATION
          # ========================================================

          implementation_start = text.find(
              "@implementation GHOSTUIWindow"
          )

          if implementation_start < 0:

              raise SystemExit(
                  "ERROR: GHOSTUIWindow implementation vanished."
              )

          implementation_end = text.find(
              "@end",
              implementation_start,
          )

          if implementation_end < 0:

              raise SystemExit(
                  "ERROR: Could not locate GHOSTUIWindow @end."
              )

          implementation_block = text[
              implementation_start:
              implementation_end
          ]

          method_pattern = re.compile(
              r'(?m)^[ \t]*-[ \t]*'
              r'\([ \t]*void[ \t]*\)[ \t]*'
              r'popupOnscreenKeyboard[ \t]*:'
          )

          already_implemented = bool(
              method_pattern.search(
                  implementation_block
              )
          )

          print(
              "Already implemented in main class:",
              already_implemented,
          )

          if already_implemented:

              raise SystemExit(
                  "ERROR: popupOnscreenKeyboard: is already "
                  "implemented inside GHOSTUIWindow. "
                  "Do not add a duplicate implementation."
              )


          # ========================================================
          # A CATEGORY ADDS THE MISSING RUNTIME SELECTOR WITHOUT
          # HAVING TO RESTRUCTURE THE EXISTING CLASS.
          # ========================================================

          category_marker = (
              "@implementation "
              "GHOSTUIWindow "
              "(BlenderOnscreenKeyboardFix)"
          )

          if category_marker in text:

              raise SystemExit(
                  "ERROR: keyboard compatibility category "
                  "already exists unexpectedly."
              )

          patch = r'''

          /*
           * Blender iOS compatibility.
           *
           * Some Blender UI paths request the software keyboard via
           * popupOnscreenKeyboard:, while this GHOSTUIWindow revision
           * does not implement that selector.
           *
           * Missing Objective-C selectors raise an exception and
           * terminate the application.
           *
           * Provide the selector and use UIKit's existing responder
           * chain when available.
           */
          @implementation GHOSTUIWindow (BlenderOnscreenKeyboardFix)

          - (void)popupOnscreenKeyboard:(BOOL)show
          {
            if (show) {

              /*
               * Prefer GHOSTUIWindow itself if this revision exposes
               * text-input responder behavior there.
               */
              if ([self canBecomeFirstResponder]) {

                [self becomeFirstResponder];

                return;
              }

              /*
               * Some revisions keep responder behavior on the root
               * content view instead.
               */
              UIViewController *controller =
                  self.rootViewController;

              UIView *view =
                  controller != nil ? controller.view : nil;

              if (view != nil &&
                  [view canBecomeFirstResponder])
              {
                [view becomeFirstResponder];

                return;
              }

              /*
               * No compatible responder is present.
               *
               * Do nothing rather than raising an Objective-C
               * unrecognized-selector exception.
               */
              return;
            }

            /*
             * Dismiss an existing software keyboard/responder.
             */
            [self endEditing:YES];

            if ([self isFirstResponder]) {
              [self resignFirstResponder];
            }
          }

          @end

          '''

          text += patch

          target.write_text(
              text
          )

          patched = target.read_text()


          # ========================================================
          # VERIFY CATEGORY + METHOD
          # ========================================================

          if category_marker not in patched:

              raise SystemExit(
                  "ERROR: keyboard category was not written."
              )

          if not re.search(
              r'(?m)^[ \t]*-[ \t]*'
              r'\([ \t]*void[ \t]*\)[ \t]*'
              r'popupOnscreenKeyboard[ \t]*:',
              patched,
          ):

              raise SystemExit(
                  "ERROR: popupOnscreenKeyboard: "
                  "implementation is missing after patch."
              )

          Path(
              "/tmp/ghost-keyboard-target.txt"
          ).write_text(
              str(target)
          )

          print()
          print(
              "popupOnscreenKeyboard: compatibility "
              "implementation added successfully."
          )
          PY

          TARGET="$(
            cat /tmp/ghost-keyboard-target.txt
          )"

          echo
          echo "========================================"
          echo "KEYBOARD PATCH TARGET"
          echo "========================================"

          echo "$TARGET"

          echo
          echo "========================================"
          echo "KEYBOARD SELECTOR AFTER PATCH"
          echo "========================================"

          grep -n \
            -E \
            'popupOnscreenKeyboard|BlenderOnscreenKeyboardFix|becomeFirstResponder|resignFirstResponder|endEditing' \
            "$TARGET" \
            || true

          echo
          echo "========================================"
          echo "COMBINED IOS GHOST DIFF"
          echo "========================================"

          git diff -- \
            intern/ghost/intern \
            release/ios \
            || true

          git diff -- \
            intern/ghost/intern \
            release/ios \
            > ios-ghost-fixes.patch

      # ============================================================
      # 34. VERIFY MODERN UIKIT SOURCE
      # ============================================================

      - name: Verify modern UIKit source
        run: |
          set -euxo pipefail

          grep -RIn \
            '\.effectiveGeometry\.coordinateSpace' \
            intern/ghost/intern \
            --include='GHOST_*IOS.mm' \
            | tee modern-uikit-calls.txt

          test -s \
            modern-uikit-calls.txt

          echo
          echo "Modern UIKit source remains intact."

      # ============================================================
      # 35. RESTORE PARTIAL XCODE BUILD
      #
      # Keep fast-v3 unchanged.
      # ============================================================

      - name: Restore incremental Xcode build
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-

      # ============================================================
      # 36. INSPECT BUILD CACHE
      # ============================================================

      - name: Inspect incremental build cache
        run: |
          set -euxo pipefail

          echo "Exact cache hit:"
          echo "${{ steps.build-cache.outputs.cache-hit }}"

          echo

          if [ -d "$GITHUB_WORKSPACE/build_ios" ]; then

            echo "Restored build_ios:"

            du -sh \
              "$GITHUB_WORKSPACE/build_ios" \
              || true

          else

            echo "No previous build_ios cache restored."

          fi

          echo

          if [ -d "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" ]; then

            echo "Restored host tools:"

            du -sh \
              "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
              || true

          fi

      # ============================================================
      # 37. CONFIGURE
      #
      # Do NOT delete build_ios.
      # ============================================================

      - name: Configure Blender
        run: |
          set -euxo pipefail

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "========================================"
          echo "CONFIGURE"
          echo "========================================"

          echo
          echo "Xcode:"

          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"

          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          echo
          echo "Deployment target:"
          echo "$IOS_DEPLOYMENT_TARGET"

          echo
          echo "Bundled asset source:"
          echo "$BUNDLED_ASSETS_SOURCE"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS_BATCHED=OFF \
            -DWITH_UI_TESTS=OFF \
            -DWITH_GPU_BACKEND_TESTS=OFF \
            -DWITH_GPU_COMPOSITOR_TESTS=OFF \
            -DWITH_GPU_DRAW_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

      # ============================================================
      # 38. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify configuration
        run: |
          set -euxo pipefail

          echo "===== Important CMake options ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_GTESTS:|WITH_TESTS_BATCHED:|WITH_METAL_BACKEND:|CMAKE_OSX_DEPLOYMENT_TARGET:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep \
              '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          PYTHON="$(
            grep \
              '^WITH_PYTHON:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"
          echo "WITH_PYTHON=$PYTHON"

          test \
            "$CYCLES" \
            = "OFF"

          test \
            "$PYTHON" \
            = "ON"

      # ============================================================
      # 39. FINAL PRE-BUILD RESOURCE CHECK
      # ============================================================

      - name: Final pre-build resource check
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path(
                  "release/datafiles"
              ),
              Path(
                  "scripts"
              ),
              Path(
                  "release/ios/Blender.app/"
                  "Assets.xcassets"
              ),
              Path(
                  os.environ[
                      "BUNDLED_ASSETS_SOURCE"
                  ]
              ),
          ]

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []
          seen = set()

          for root in roots:

              if not root.exists():
                  continue

              for path in root.rglob("*"):

                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  try:
                      resolved = path.resolve()
                  except OSError:
                      resolved = path

                  if resolved in seen:
                      continue

                  seen.add(
                      resolved
                  )

                  try:
                      if path.read_bytes()[:200].startswith(magic):
                          bad.append(path)
                  except OSError:
                      pass

          if bad:

              print(
                  "ERROR: source resources still "
                  "contain Git LFS pointers:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "Pre-build resource check passed."
          )
          PY

      # ============================================================
      # 40. BUILD BLENDER
      # ============================================================

      - name: Build Blender
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BLENDER"
          echo "========================================"

          xcodebuild -version

          echo
          echo "SDK:"

          xcrun \
            --sdk iphoneos \
            --show-sdk-version

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            grep -n -C 30 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:|actool|CompileAssetCatalog|AppIcon|git-lfs.github.com/spec/v1|popupOnscreenKeyboard' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            grep -n -C 25 \
              -E \
              'fmt::|println|BundleKey|StringRef|fallback_formatter|formattable|OpenImageIO/detail/fmt' \
              xcodebuild.log \
              > fmt-errors.txt \
              || true

            grep -n -C 30 \
              -E \
              'GHOST_.*IOS|GHOSTUIWindow|UIWindowScene|effectiveGeometry|coordinateSpace|contentScaleFactor|scalePointToWindow|locationInView|popupOnscreenKeyboard|becomeFirstResponder|UIKit' \
              xcodebuild.log \
              > ios-errors.txt \
              || true

            grep -n -C 30 \
              -E \
              'actool|Assets.xcassets|AppIcon|CompileAssetCatalog|asset catalog|git-lfs.github.com/spec/v1' \
              xcodebuild.log \
              > asset-errors.txt \
              || true

            grep -n -C 30 \
              -E \
              'Undefined symbols|duplicate symbol|library not found|framework not found|ld: |clang: error: linker' \
              xcodebuild.log \
              > linker-errors.txt \
              || true

            grep -n -A 180 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            echo
            echo "===== MAIN ERRORS ====="
            cat compiler-errors.txt || true

            echo
            echo "===== IOS ERRORS ====="
            cat ios-errors.txt || true

            echo
            echo "===== FMT ERRORS ====="
            cat fmt-errors.txt || true

            echo
            echo "===== ASSET ERRORS ====="
            cat asset-errors.txt || true

            echo
            echo "===== LINKER ERRORS ====="
            cat linker-errors.txt || true

            echo
            echo "===== FAILED COMMANDS ====="
            cat failed-commands.txt || true

            echo
            echo "===== LAST 700 LINES ====="

            tail -700 \
              xcodebuild.log \
              || true

            exit "$STATUS"

          fi

          echo
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"

          tail -150 \
            xcodebuild.log

      # ============================================================
      # 41. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              \( \
                -name 'Blender.app' \
                -o \
                -name 'blender.app' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Blender.app not found."

            echo
            echo "Generated app bundles:"

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1

          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "Blender.app:"
          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 42. REPAIR STALE CACHED RESOURCE COPIES
      # ============================================================

      - name: Repair and verify packaged app resources
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil

          app = Path(
              os.environ["APP"]
          )

          asset_source = Path(
              os.environ[
                  "BUNDLED_ASSETS_SOURCE"
              ]
          )

          base = (
              app
              / "Assets"
              / "5.2"
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          def is_pointer(path):

              try:
                  return (
                      path.read_bytes()[:200]
                      .startswith(magic)
                  )
              except OSError:
                  return False

          pointers = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          print(
              "Pointers initially found inside Blender.app:",
              len(pointers),
          )

          repaired = 0

          for destination in pointers:

              try:
                  relative = destination.relative_to(
                      base
                  )
              except ValueError:

                  print(
                      "Cannot map pointer outside Assets/5.2:",
                      destination,
                  )

                  continue

              parts = relative.parts

              if not parts:
                  continue

              source = None

              # ----------------------------------------------------
              # datafiles/assets/* -> bundled asset source/*
              # ----------------------------------------------------

              if (
                  len(parts) >= 2
                  and parts[0] == "datafiles"
                  and parts[1] == "assets"
              ):

                  source = (
                      asset_source
                      / Path(
                          *parts[2:]
                      )
                  )

              # ----------------------------------------------------
              # datafiles/* -> release/datafiles/*
              # ----------------------------------------------------

              elif parts[0] == "datafiles":

                  source = (
                      Path("release")
                      / relative
                  )

              # ----------------------------------------------------
              # scripts/* -> scripts/*
              # ----------------------------------------------------

              elif parts[0] == "scripts":

                  source = Path(
                      *parts
                  )

              else:

                  print(
                      "Unknown packaged resource mapping:",
                      destination,
                  )

                  continue

              if not source.is_file():

                  print(
                      "Mapped source does not exist:"
                  )

                  print(
                      "  destination:",
                      destination,
                  )

                  print(
                      "  source:     ",
                      source,
                  )

                  continue

              if is_pointer(
                  source
              ):

                  print(
                      "Mapped source remains a pointer:",
                      source,
                  )

                  continue

              print(
                  "Repairing:"
              )

              print(
                  "  destination:",
                  destination,
              )

              print(
                  "  source:     ",
                  source,
              )

              shutil.copy2(
                  source,
                  destination,
              )

              repaired += 1

          print()
          print(
              "Repaired stale packaged resources:",
              repaired,
          )

          remaining = [
              path
              for path in app.rglob("*")
              if path.is_file()
              and is_pointer(path)
          ]

          if remaining:

              print()
              print(
                  "ERROR: unresolved Git LFS pointers "
                  "remain in Blender.app:"
              )

              for path in remaining:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print()
          print(
              "Blender.app contains no Git LFS pointers."
          )
          PY

      # ============================================================
      # 43. VERIFY EXECUTABLE
      #
      # No find -maxdepth; macOS BSD find does not support it.
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -euxo pipefail

          test -f \
            "$APP/Info.plist"

          echo "===== Info.plist ====="

          plutil \
            -p \
            "$APP/Info.plist" \
            | head -150

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist" \
              2>/dev/null \
              || true
          )"

          EXECUTABLE=""

          if [ -n "$EXEC_NAME" ] && \
             [ -f "$APP/$EXEC_NAME" ]
          then

            EXECUTABLE="$APP/$EXEC_NAME"

          elif [ -f "$APP/Blender" ]
          then

            EXEC_NAME="Blender"
            EXECUTABLE="$APP/Blender"

          elif [ -f "$APP/blender" ]
          then

            EXEC_NAME="blender"
            EXECUTABLE="$APP/blender"

          else

            echo "ERROR: Blender executable not found."

            echo
            echo "First files inside app bundle:"

            find \
              "$APP" \
              -type f \
              -print \
              | head -100 \
              || true

            exit 1

          fi

          echo "EXEC_NAME=$EXEC_NAME" \
            >> "$GITHUB_ENV"

          echo "EXECUTABLE=$EXECUTABLE" \
            >> "$GITHUB_ENV"

          echo
          echo "===== Executable ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architecture ====="

          lipo \
            -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 44. FINAL APP POINTER SCAN
      # ============================================================

      - name: Final Blender.app validation
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          app = Path(
              os.environ["APP"]
          )

          magic = (
              b"version "
              b"https://git-lfs.github.com/spec/v1"
          )

          bad = []

          for path in app.rglob("*"):

              if not path.is_file():
                  continue

              try:
                  if path.read_bytes()[:200].startswith(magic):
                      bad.append(path)
              except OSError:
                  pass

          if bad:

              print(
                  "ERROR: Git LFS pointers remain in final app:"
              )

              for path in bad:
                  print(
                      " ",
                      path,
                  )

              raise SystemExit(1)

          print(
              "Final Blender.app validation passed."
          )
          PY

      # ============================================================
      # 45. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          (
            cd package

            zip \
              -qry \
              -y \
              ../Blender-5.2-iPad-Touch-KeyboardFix.ipa \
              Payload
          )

          test -f \
            Blender-5.2-iPad-Touch-KeyboardFix.ipa

          echo
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            Blender-5.2-iPad-Touch-KeyboardFix.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-5.2-iPad-Touch-KeyboardFix.ipa \
            | head -180

      # ============================================================
      # 46. BUILD INFORMATION
      # ============================================================

      - name: Write build information
        if: always()
        run: |
          {
            echo "Source:"
            echo "salmazov/blender-ios"
            echo

            echo "Source commit:"
            git rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "iOS libraries:"
            git -C lib/ios_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "macOS libraries:"
            git -C lib/macos_arm64 \
              rev-parse HEAD \
              2>/dev/null \
              || true
            echo

            echo "Xcode:"
            xcodebuild -version \
              2>/dev/null \
              || true
            echo

            echo "iPhoneOS SDK:"
            xcrun \
              --sdk iphoneos \
              --show-sdk-version \
              2>/dev/null \
              || true
            echo

            echo "Deployment target:"
            echo "$IOS_DEPLOYMENT_TARGET"
            echo

            echo "Bundled asset source:"
            echo "${BUNDLED_ASSETS_SOURCE:-unknown}"
            echo

            echo "Build options:"
            echo "WITH_PYTHON=ON"
            echo "WITH_CYCLES=OFF"
            echo "WITH_GTESTS=OFF"
            echo "WITH_TESTS_BATCHED=OFF"
            echo

            echo "fmt compatibility fixes:"
            echo "BundleKey fmt::join"
            echo "StringRef / BundleKey path fmt::join"
            echo "legacy fmt println compatibility"
            echo

            echo "iOS touch fixes:"
            echo "logical UIKit touch coordinates"
            echo "removed touch contentScaleFactor conversion"
            echo "removed gesture scalePointToWindow conversion"
            echo "logical pan/pinch coordinates"
            echo

            echo "iOS keyboard fixes:"
            echo "GHOSTUIWindow popupOnscreenKeyboard selector"
            echo "safe first-responder attempt"
            echo "safe keyboard dismissal"
            echo "missing responder becomes no-op instead of crash"
            echo

            echo "UIKit compatibility patches:"
            echo "NONE"
            echo

            echo "UIKit API:"
            echo "effectiveGeometry.coordinateSpace"
            echo

            echo "Resource handling:"
            echo "release/datafiles LFS materialization"
            echo "scripts LFS materialization"
            echo "bundled assets LFS materialization"
            echo "dead AppIcon LFS replacement"
            echo "post-build stale resource repair"
            echo "final app LFS scan"
            echo

            echo "Speed features:"
            echo "source resource cache"
            echo "iOS library cache"
            echo "macOS library cache"
            echo "partial Xcode build cache"
            echo "failed partial builds saved"
            echo "source timestamp normalization"
            echo "index store disabled"
            echo "debug symbols disabled"
          } > build-revision.txt

          cat \
            build-revision.txt

      # ============================================================
      # 47. SHOW BUILD CACHE SIZE
      # ============================================================

      - name: Show incremental build size
        if: always()
        run: |
          echo "===== build_ios ====="

          du -sh \
            "$GITHUB_WORKSPACE/build_ios" \
            2>/dev/null \
            || true

          echo
          echo "===== host tools ====="

          du -sh \
            "$GITHUB_WORKSPACE/../build_ios/build_darwin_tools" \
            2>/dev/null \
            || true

      # ============================================================
      # 48. SAVE PARTIAL/COMPLETE BUILD CACHE
      #
      # Keep fast-v3 unchanged.
      # ============================================================

      - name: Save incremental Xcode build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/build_ios
            ${{ github.workspace }}/../build_ios/build_darwin_tools
          key: >-
            blender-build-${{ env.BUILD_CACHE_VERSION }}-xcode26.3-${{ env.BLENDER_SHA }}-ios26.2-cyclesoff-${{ github.run_id }}-${{ github.run_attempt }}

      # ============================================================
      # 49. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Blender-5.2-iPad-Touch-KeyboardFix
          path: |
            Blender-5.2-iPad-Touch-KeyboardFix.ipa
            build-revision.txt
            compatibility.patch
            touch-coordinates.patch
            ios-ghost-fixes.patch
            modern-uikit-calls.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 50. ALWAYS UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ios-touch-keyboardfix-logs
          path: |
            build-revision.txt
            compatibility.patch
            touch-coordinates.patch
            ios-ghost-fixes.patch
            modern-uikit-calls.txt
            source-lfs.log
            blender-assets-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            ios-errors.txt
            fmt-errors.txt
            asset-errors.txt
            linker-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
