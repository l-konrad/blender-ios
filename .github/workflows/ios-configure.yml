name: Build Blender iOS Baseline

on:
  workflow_dispatch:

concurrency:
  group: blender-ios-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iOS - Cycles OFF
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # 1. CHECKOUT KNOWN IOS-NEW COMMIT
      # ============================================================

      - name: Checkout Salmazov ios-new
        uses: actions/checkout@v4
        with:
          ref: ccd09fe
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # 2. ENVIRONMENT
      # ============================================================

      - name: Show environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "===== macOS ====="
          sw_vers

          echo "===== CPU ====="
          uname -m

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== Blender commit ====="
          git rev-parse HEAD

          echo "===== Branch / ref ====="
          git branch --show-current || true

          echo "===== Disk ====="
          df -h

      # ============================================================
      # 3. FREE SOME RUNNER DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # 4. INSTALL BUILD TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version
          python3 --version

      # ============================================================
      # 5. FETCH startup.blend
      #
      # Salmazov's GitHub fork does not contain all Blender LFS
      # objects, so fetch startup.blend from Blender upstream.
      # ============================================================

      - name: Fetch Blender startup.blend
        run: |
          set -euxo pipefail

          git config lfs.remote.searchall true

          git remote add blender-upstream \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-upstream \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-upstream \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f \
            release/datafiles/startup.blend

          SIZE="$(
            stat -f '%z' \
              release/datafiles/startup.blend
          )"

          echo "startup.blend size: $SIZE"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: startup.blend is still an LFS pointer"
            exit 1
          fi

          file \
            release/datafiles/startup.blend

      # ============================================================
      # 6. DETERMINE EXACT PREBUILT LIBRARY COMMITS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(
            git rev-parse HEAD:lib/ios_arm64
          )"

          MAC_SHA="$(
            git rev-parse HEAD:lib/macos_arm64
          )"

          IOS_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/ios_arm64.url
          )"

          MAC_URL="$(
            git config \
              -f .gitmodules \
              --get submodule.lib/macos_arm64.url
          )"

          echo "ios_sha=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac_sha=$MAC_SHA" >> "$GITHUB_OUTPUT"
          echo "ios_url=$IOS_URL" >> "$GITHUB_OUTPUT"
          echo "mac_url=$MAC_URL" >> "$GITHUB_OUTPUT"

          echo "===== iOS libraries ====="
          echo "URL: $IOS_URL"
          echo "SHA: $IOS_SHA"

          echo
          echo "===== macOS libraries ====="
          echo "URL: $MAC_URL"
          echo "SHA: $MAC_SHA"

      # ============================================================
      # 7. RESTORE LIBRARY CACHES
      # ============================================================

      - name: Restore iOS library cache
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: lib/ios_arm64
          key: blender-ios-libs-${{ steps.libs.outputs.ios_sha }}-v1

      - name: Restore macOS library cache
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: lib/macos_arm64
          key: blender-macos-libs-${{ steps.libs.outputs.mac_sha }}-v1

      # ============================================================
      # 8. FETCH EXACT IOS PREBUILT LIBRARIES
      # ============================================================

      - name: Fetch iOS prebuilt libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/ios_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.ios_url }}" \
            lib/ios_arm64

          git -C lib/ios_arm64 \
            fetch \
            --depth 1 \
            origin \
            "${{ steps.libs.outputs.ios_sha }}"

          git -C lib/ios_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.ios_sha }}"

          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          echo
          echo "===== Verify iOS Python ====="

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          du -sh \
            lib/ios_arm64

      # ============================================================
      # 9. FETCH EXACT MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS host libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          rm -rf \
            lib/macos_arm64

          git clone \
            --filter=blob:none \
            --no-checkout \
            "${{ steps.libs.outputs.mac_url }}" \
            lib/macos_arm64

          git -C lib/macos_arm64 \
            fetch \
            --depth 1 \
            origin \
            "${{ steps.libs.outputs.mac_sha }}"

          git -C lib/macos_arm64 \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          EXPECTED="${{ steps.libs.outputs.mac_sha }}"

          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh \
            lib/macos_arm64

      # ============================================================
      # 10. VERIFY LIBRARIES
      # ============================================================

      - name: Verify prebuilt libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          if [ -z "$HOST_PYTHON" ]; then
            echo "ERROR: macOS host Python missing"
            exit 1
          fi

          echo "===== iOS Python ====="

          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo
          echo "===== Host Python ====="

          echo "$HOST_PYTHON"

          echo
          echo "===== Library sizes ====="

          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # 11. SAVE LIBRARY CACHES
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lib/ios_arm64
          key: blender-ios-libs-${{ steps.libs.outputs.ios_sha }}-v1

      - name: Save macOS library cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lib/macos_arm64
          key: blender-macos-libs-${{ steps.libs.outputs.mac_sha }}-v1

      # ============================================================
      # 12. CONFIGURE BLENDER
      #
      # THIS IS THE ONLY IMPORTANT CHANGE FROM THE BASELINE:
      #
      #   -DWITH_CYCLES=OFF
      #
      # No TouchView.
      # No fmt changes.
      # No Blender C/C++ source patches.
      # ============================================================

      - name: Configure Blender for iOS
        run: |
          set -euxo pipefail

          rm -rf \
            build_ios

          mkdir -p \
            build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "===== iOS SDK ====="
          echo "$IOS_SDK_ROOT"

          echo
          echo "===== iOS LIBDIR ====="
          echo "$IOS_LIBDIR"

          cd build_ios

          cmake \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_CYCLES=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            "$GITHUB_WORKSPACE" \
            2>&1 | tee "$GITHUB_WORKSPACE/configure.log"

      # ============================================================
      # 13. VERIFY CYCLES REALLY IS OFF
      # ============================================================

      - name: Verify configuration
        run: |
          set -eux

          echo "===== Important CMake values ====="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_AUDASPACE:|WITH_METAL_BACKEND:' \
            build_ios/CMakeCache.txt \
            || true

          CYCLES="$(
            grep '^WITH_CYCLES:BOOL=' \
              build_ios/CMakeCache.txt \
              | cut -d= -f2
          )"

          echo
          echo "WITH_CYCLES=$CYCLES"

          if [ "$CYCLES" != "OFF" ]; then
            echo "ERROR: Cycles was not disabled"
            exit 1
          fi

      # ============================================================
      # 14. SHOW XCODE TARGETS
      # ============================================================

      - name: List Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # 15. BUILD BLENDER
      # ============================================================

      - name: Build Blender for physical iOS
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          echo "Using $NCPU jobs"

          set +e

          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            > xcodebuild.log 2>&1

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "================================================"
            echo "              BLENDER BUILD FAILED"
            echo "================================================"
            echo

            echo "===== Compiler / linker errors ====="

            grep -n -C 15 \
              -E \
              '(^|[[:space:]])error:|fatal error:|static assertion failed|Undefined symbols|duplicate symbol|ld: |clang: error:' \
              xcodebuild.log \
              > compiler-errors.txt \
              || true

            cat \
              compiler-errors.txt

            echo
            echo "===== Failed build commands ====="

            grep -n -A 100 \
              'The following build commands failed:' \
              xcodebuild.log \
              > failed-commands.txt \
              || true

            cat \
              failed-commands.txt

            echo
            echo "===== Last 300 lines ====="

            tail -300 \
              xcodebuild.log \
              || true

            exit "$STATUS"
          fi

          echo
          echo "================================================"
          echo "             BLENDER BUILD SUCCEEDED"
          echo "================================================"

          tail -80 \
            xcodebuild.log

      # ============================================================
      # 16. FIND Blender.app
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build_ios" \
              -type d \
              -name 'Blender.app' \
              -print -quit
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then

            echo "ERROR: Blender.app not found"

            echo
            echo "===== Generated app bundles ====="

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== Blender.app ====="

          echo "$APP"

          du -sh \
            "$APP"

      # ============================================================
      # 17. VERIFY EXECUTABLE
      # ============================================================

      - name: Verify Blender executable
        run: |
          set -eux

          EXEC_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )"

          EXECUTABLE="$APP/$EXEC_NAME"

          echo "===== Bundle executable ====="
          echo "$EXEC_NAME"

          test -f \
            "$EXECUTABLE"

          echo
          echo "===== File type ====="

          file \
            "$EXECUTABLE"

          echo
          echo "===== Architectures ====="

          lipo -info \
            "$EXECUTABLE" \
            || true

      # ============================================================
      # 18. PACKAGE UNSIGNED IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf \
            package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-ios-new-Cycles-OFF.ipa \
            Payload

          cd ..

          echo "===== IPA ====="

          ls -lh \
            Blender-ios-new-Cycles-OFF.ipa

          echo
          echo "===== IPA contents ====="

          unzip -l \
            Blender-ios-new-Cycles-OFF.ipa \
            | head -50

      # ============================================================
      # 19. UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-ios-new-Cycles-OFF
          path: Blender-ios-new-Cycles-OFF.ipa
          retention-days: 30

      # ============================================================
      # 20. ALWAYS UPLOAD BUILD LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-build-logs
          path: |
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            xcodebuild.log
            compiler-errors.txt
            failed-commands.txt
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
