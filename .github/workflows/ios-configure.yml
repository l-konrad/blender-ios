name: Build Blender iPad + TouchView

on:
  workflow_dispatch:

concurrency:
  group: blender-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender iPad IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      # ============================================================
      # ENVIRONMENT
      # ============================================================

      - name: Environment
        run: |
          set -eux

          sudo xcode-select -s /Applications/Xcode.app

          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

          echo "=== Disk ==="
          df -h

      # ============================================================
      # FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf ~/Library/Android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true

          sudo xcrun simctl delete all 2>/dev/null || true

          df -h

      # ============================================================
      # TOOLS
      # ============================================================

      - name: Install tools
        run: |
          brew install cmake git-lfs

          git lfs install

          cmake --version
          git lfs version

      # ============================================================
      # BLENDER SOURCE LFS
      # ============================================================

      - name: Fetch Blender startup.blend
        run: |
          set -euxo pipefail

          git config lfs.remote.searchall true

          git remote add blender-lfs \
            https://projects.blender.org/blender/blender.git \
            2>/dev/null || true

          git remote set-url \
            blender-lfs \
            https://projects.blender.org/blender/blender.git

          git lfs fetch \
            blender-lfs \
            --include="release/datafiles/startup.blend" \
            2>&1 | tee source-lfs.log

          git lfs checkout \
            release/datafiles/startup.blend

          test -f release/datafiles/startup.blend

          ls -lh release/datafiles/startup.blend
          file release/datafiles/startup.blend

      # ============================================================
      # DETERMINE SALMAZOV LIBRARY REVISIONS
      # ============================================================

      - name: Determine library revisions
        id: libs
        run: |
          set -eux

          IOS_SHA="$(git rev-parse HEAD:lib/ios_arm64)"
          MAC_SHA="$(git rev-parse HEAD:lib/macos_arm64)"

          echo "ios=$IOS_SHA" >> "$GITHUB_OUTPUT"
          echo "mac=$MAC_SHA" >> "$GITHUB_OUTPUT"

          echo "iOS:   $IOS_SHA"
          echo "macOS: $MAC_SHA"

      # ============================================================
      # RESTORE IOS LIB CACHE
      # ============================================================

      - name: Restore iOS library cache
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v4

      # ============================================================
      # RESTORE MAC LIB CACHE
      # ============================================================

      - name: Restore macOS library cache
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v4

      # ============================================================
      # FETCH IOS PREBUILT LIBRARIES
      # ============================================================

      - name: Fetch iOS prebuilt libraries
        if: steps.ios-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init lib/ios_arm64

          git config \
            submodule.lib/ios_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/ios_arm64

          IOS_ROOT="$(
            git -C lib/ios_arm64 \
              rev-parse --show-toplevel
          )"

          echo "=== iOS repository ==="
          echo "$IOS_ROOT"

          test "$IOS_ROOT" = \
            "$GITHUB_WORKSPACE/lib/ios_arm64"

          git -C lib/ios_arm64 remote -v

          ACTUAL="$(
            git -C lib/ios_arm64 \
              rev-parse HEAD
          )"

          echo "Actual:   $ACTUAL"
          echo "Expected: ${{ steps.libs.outputs.ios }}"

          test "$ACTUAL" = \
            "${{ steps.libs.outputs.ios }}"

          git -C lib/ios_arm64 \
            lfs install --local

          git -C lib/ios_arm64 \
            lfs pull \
            2>&1 | tee ios-lfs.log

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          du -sh lib/ios_arm64

      # ============================================================
      # FETCH MACOS HOST LIBRARIES
      # ============================================================

      - name: Fetch macOS host libraries
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail

          git submodule init lib/macos_arm64

          git config \
            submodule.lib/macos_arm64.update \
            checkout

          GIT_LFS_SKIP_SMUDGE=1 \
            git submodule update \
              --checkout \
              lib/macos_arm64

          MAC_ROOT="$(
            git -C lib/macos_arm64 \
              rev-parse --show-toplevel
          )"

          echo "=== macOS repository ==="
          echo "$MAC_ROOT"

          test "$MAC_ROOT" = \
            "$GITHUB_WORKSPACE/lib/macos_arm64"

          git -C lib/macos_arm64 remote -v

          ACTUAL="$(
            git -C lib/macos_arm64 \
              rev-parse HEAD
          )"

          echo "Actual:   $ACTUAL"
          echo "Expected: ${{ steps.libs.outputs.mac }}"

          test "$ACTUAL" = \
            "${{ steps.libs.outputs.mac }}"

          git -C lib/macos_arm64 \
            lfs install --local

          git -C lib/macos_arm64 \
            lfs pull \
            2>&1 | tee macos-lfs.log

          du -sh lib/macos_arm64

      # ============================================================
      # VERIFY LIBRARIES
      # ============================================================

      - name: Verify libraries
        run: |
          set -eux

          test -f \
            lib/ios_arm64/python/lib/libpython3.11.a

          HOST_PYTHON="$(
            find \
              lib/macos_arm64/python/bin \
              -type f \
              -name 'python3.*' \
              -not -name '*config*' \
              -print -quit
          )"

          test -n "$HOST_PYTHON"

          echo "=== iOS Python ==="
          ls -lh \
            lib/ios_arm64/python/lib/libpython3.11.a

          echo "=== Host Python ==="
          echo "$HOST_PYTHON"

          echo "=== Sizes ==="
          du -sh lib/ios_arm64
          du -sh lib/macos_arm64

      # ============================================================
      # SAVE LIBRARY CACHES
      # ============================================================

      - name: Save iOS library cache
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ios-arm64-${{ steps.libs.outputs.ios }}-v4

      - name: Save macOS library cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/macos_arm64
            .git/modules/lib/macos_arm64
          key: macos-arm64-${{ steps.libs.outputs.mac }}-v4

      # ============================================================
      # ADD SHLOK / NENDO TOUCHVIEW
      # ============================================================

      - name: Add Shlok TouchView
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -eux

          rm -rf /tmp/shlok

          GIT_LFS_SKIP_SMUDGE=1 \
            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              https://github.com/Shlok-Bhakta/blender-ios-build.git \
              /tmp/shlok

          git -C /tmp/shlok \
            sparse-checkout set \
              scripts/addons_core/touchview \
              scripts/startup

          test -d \
            /tmp/shlok/scripts/addons_core/touchview

          test -f \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py

          rm -rf \
            scripts/addons_core/touchview

          cp -R \
            /tmp/shlok/scripts/addons_core/touchview \
            scripts/addons_core/touchview

          cp \
            /tmp/shlok/scripts/startup/touchview_ios_startup.py \
            scripts/startup/touchview_ios_startup.py

          echo "=== TouchView copied ==="

          find \
            scripts/addons_core/touchview \
            -maxdepth 3 \
            -type f \
            | head -100

          echo "=== Auto-start ==="

          cat \
            scripts/startup/touchview_ios_startup.py

      # ============================================================
      # PATCH BLENDER 5.2 / OLD IOS FMT INCOMPATIBILITY
      #
      # The iOS libraries expose OpenImageIO's older vendored fmt.
      #
      # Blender 5.2 node_geo_join_bundle.cc attempts:
      #
      # fmt::join(overridden_keys, ", ")
      #
      # The older fmt cannot format BundleKey.
      #
      # Keep the warning, omit only its key list.
      # ============================================================

      - name: Patch iOS fmt BundleKey incompatibility
        run: |
          set -euxo pipefail

          FILE="source/blender/nodes/geometry/nodes/node_geo_join_bundle.cc"

          test -f "$FILE"

          echo "=== Before patch ==="

          grep -n -A 4 -B 4 \
            'fmt::join(overridden_keys' \
            "$FILE" \
            || true

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "source/blender/nodes/geometry/nodes/"
              "node_geo_join_bundle.cc"
          )

          source = path.read_text()

          old = '''    std::string message = fmt::format(
                  "{}: {}", TIP_("Duplicate keys"), fmt::join(overridden_keys, ", "));
          '''

          new = '''    std::string message = TIP_("Duplicate keys");
          '''

          if old not in source:
              print("Exact text did not match; trying flexible patch.")

              import re

              pattern = re.compile(
                  r'''    std::string message = fmt::format\(\s*
                      "\{\}: \{\}",\s*
                      TIP_\("Duplicate keys"\),\s*
                      fmt::join\(overridden_keys,\s*", "\)\s*
                      \);''',
                  re.VERBOSE | re.MULTILINE,
              )

              source, count = pattern.subn(
                  '    std::string message = TIP_("Duplicate keys");',
                  source,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not patch "
                      "node_geo_join_bundle.cc"
                  )
          else:
              source = source.replace(old, new, 1)

          path.write_text(source)

          print("Patch applied successfully.")
          PY

          echo "=== After patch ==="

          grep -n -A 4 -B 4 \
            'Duplicate keys' \
            "$FILE"

          if grep -q \
            'fmt::join(overridden_keys' \
            "$FILE"
          then
            echo "ERROR: broken fmt::join is still present"
            exit 1
          fi

          echo "=== fmt workaround installed ==="

      # ============================================================
      # CONFIGURE
      #
      # Python: ON for TouchView.
      # Cycles: OFF.
      # Audio: OFF.
      # ============================================================

      - name: Configure Blender for iPad
        run: |
          set -euxo pipefail

          rm -rf build_ios

          IOS_LIBDIR="$GITHUB_WORKSPACE/lib/ios_arm64"

          IOS_SDK_ROOT="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          IOS_DEV_ROOT="$(
            dirname "$IOS_SDK_ROOT"
          )"

          echo "=== SDK ==="
          echo "$IOS_SDK_ROOT"

          echo "=== LIBDIR ==="
          echo "$IOS_LIBDIR"

          cmake \
            -S . \
            -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_PYTHON=ON \
            -DWITH_CYCLES=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_INSTALL_PORTABLE=OFF \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$IOS_LIBDIR" \
            2>&1 | tee configure.log

          echo
          echo "=== Important settings ==="

          grep -E \
            'WITH_CYCLES:|WITH_PYTHON:|WITH_AUDASPACE:|WITH_INSTALL_PORTABLE:' \
            build_ios/CMakeCache.txt \
            || true

      # ============================================================
      # LIST GENERATED XCODE TARGETS
      # ============================================================

      - name: List Xcode targets
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -list

      # ============================================================
      # BUILD HOST CROSS-COMPILE TOOLS FIRST
      # ============================================================

      - name: Build Blender cross tools
        run: |
          set -o pipefail

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee cross-tools.log
          then

            echo "=== CROSS TOOLS FAILED ==="

            grep -n -C 8 \
              -E 'error:|fatal error:|Undefined symbols|ld: |clang: error:' \
              cross-tools.log \
              | tail -400 \
              || true

            exit 1
          fi

      # ============================================================
      # BUILD BLENDER
      # ============================================================

      - name: Build Blender for physical iPad
        run: |
          set -o pipefail

          NCPU="$(
            sysctl -n hw.ncpu
          )"

          echo "Using $NCPU build jobs"

          if ! xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs "$NCPU" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log
          then

            echo
            echo "================================================"
            echo "             XCODE BUILD FAILED"
            echo "================================================"
            echo

            echo "=== Actual compiler/linker errors ==="

            grep -n -C 10 \
              -E \
              '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld: |clang: error:|Command .* failed' \
              xcodebuild.log \
              | tail -800 \
              || true

            echo
            echo "=== Failed commands ==="

            grep -n -A 80 \
              'The following build commands failed:' \
              xcodebuild.log \
              | tail -150 \
              || true

            echo
            echo "=== Last 250 lines ==="

            tail -250 \
              xcodebuild.log \
              || true

            exit 1
          fi

          echo
          echo "================================================"
          echo "             BLENDER BUILD SUCCESS"
          echo "================================================"

      # ============================================================
      # FIND BLENDER.APP
      # ============================================================

      - name: Find Blender.app
        run: |
          set -eux

          APP=""

          if [ -d \
            "$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app" ]
          then
            APP="$GITHUB_WORKSPACE/build_ios/bin/Release/Blender.app"
          fi

          if [ -z "$APP" ]
          then
            APP="$(
              find \
                "$GITHUB_WORKSPACE/build_ios" \
                -type d \
                -name 'Blender.app' \
                -print -quit
            )"
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]
          then
            echo "ERROR: Blender.app not found."

            find \
              build_ios \
              -type d \
              -name '*.app' \
              -print \
              || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "=== Blender.app ==="
          echo "$APP"

          du -sh "$APP"

      # ============================================================
      # VERIFY APP IS PHYSICAL IOS ARM64
      # ============================================================

      - name: Verify Blender binary
        run: |
          set -eux

          EXECUTABLE="$APP/Blender"

          if [ ! -f "$EXECUTABLE" ]
          then
            EXECUTABLE="$(
              find "$APP" \
                -maxdepth 1 \
                -type f \
                -perm +111 \
                -print -quit
            )"
          fi

          test -n "$EXECUTABLE"

          echo "=== Binary ==="
          file "$EXECUTABLE"

          echo "=== Architecture ==="
          lipo -info "$EXECUTABLE" || true

      # ============================================================
      # VERIFY TOUCHVIEW PACKAGED
      # ============================================================

      - name: Verify TouchView inside Blender.app
        run: |
          set -eux

          echo "=== TouchView files ==="

          find \
            "$APP" \
            \( \
              -iname '*touchview*' \
              -o \
              -name 'touchview_ios_startup.py' \
            \) \
            -print \
            | head -100

          STARTUP="$(
            find \
              "$APP" \
              -name 'touchview_ios_startup.py' \
              -print -quit
          )"

          TOUCHVIEW="$(
            find \
              "$APP" \
              -type d \
              -name touchview \
              -print -quit
          )"

          if [ -z "$STARTUP" ]
          then
            echo "ERROR: TouchView auto-start was not packaged."
            exit 1
          fi

          if [ -z "$TOUCHVIEW" ]
          then
            echo "ERROR: TouchView add-on was not packaged."
            exit 1
          fi

          echo "TouchView:"
          echo "$TOUCHVIEW"

          echo "Auto-start:"
          echo "$STARTUP"

      # ============================================================
      # PACKAGE IPA
      # ============================================================

      - name: Package unsigned IPA
        run: |
          set -eux

          rm -rf package

          mkdir -p \
            package/Payload

          ditto \
            "$APP" \
            package/Payload/Blender.app

          cd package

          zip \
            -qry \
            -y \
            ../Blender-5.2-iPad-TouchView.ipa \
            Payload

          cd ..

          echo "=== Finished IPA ==="

          ls -lh \
            Blender-5.2-iPad-TouchView.ipa

          echo "=== IPA structure ==="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | head -30

          echo "=== TouchView in IPA ==="

          unzip -l \
            Blender-5.2-iPad-TouchView.ipa \
            | grep -i touchview \
            | head -100

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload Blender IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.2-iPad-TouchView
          path: Blender-5.2-iPad-TouchView.ipa
          retention-days: 30

      # ============================================================
      # ALWAYS UPLOAD LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-build-logs
          path: |
            source-lfs.log
            ios-lfs.log
            macos-lfs.log
            configure.log
            cross-tools.log
            xcodebuild.log
            build_ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
